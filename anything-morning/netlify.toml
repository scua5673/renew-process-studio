# 애니띵 모닝 — 별도 Netlify 사이트용 설정 (사이트의 Base directory: anything-morning)
# 빌드가 없는 정적 앱이라 폴더를 그대로 게시한다.
[build]
  publish = "."
  command = "echo '정적 사이트 — 빌드 없음'"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
