<!DOCTYPE html>
<html lang="ko">
<head>
<!-- PROCESS — 공용어 (팀 공용 신호·용어 사전 · 편집형) -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<script src="storage.js"></script>
<script src="football-language.js"></script>

<link rel="stylesheet" href="/vendor/fonts.css?v=2.552b"><link rel="stylesheet" href="/vendor/tokens.css?v=2.552b">
<style>
  b,strong{font-weight:var(--fw-head)}   /* 브라우저 기본 bold=700 차단 — 무게는 600·800만 */
:focus-visible{outline:2px solid #3a6df0 !important;outline-offset:2px;border-radius:6px;}
  /* UI 규칙: 레포 UI-가이드.md — 색은 의미로만(보라=목표·초록=완료·빨강=경고·파랑=코치), 이모지 금지(라인 SVG), 무게 600/800 */
  :root{
    --bg:#ECEDF0; --frame:#FFFFFF; --surface:#FFFFFF; --surface-2:#F1F2F4;
    --line:#E3E6EA; --line-soft:#ECEDF0;
    --text:#14161A; --text-2:#646A73; --text-3:#646A73;
    --accent:#3a6df0; --accent-soft:#edf2fe;
    --c-att:#3a6df0; --c-att-soft:#edf2fe;
    --c-def:#C24A46; --c-def-soft:#FBEBEA;
    --c-tra:#B5762B; --c-tra-soft:#FBF1E0;
    --c-com:#2E7D63; --c-com-soft:#E8F3EE;
    --r:12px;
    --f:'Pretendard Variable','Pretendard',-apple-system,BlinkMacSystemFont,system-ui,'Apple SD Gothic Neo','Malgun Gothic','Segoe UI',Roboto,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{background:var(--bg);font-family:var(--f);color:var(--text);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;line-height:1.5}
  body{display:flex;flex-direction:column;height:100dvh;overflow:hidden}

  /* ===== UNIFIED APP HEADER — scout/gamemodel과 동일 패턴 ===== */
  /* IDP(.top/.top-h/.layers)와 같은 결 — 제목 행 위, 밑줄 탭 아래 2단 */
  .apphd{flex:0 0 auto;display:flex;flex-direction:column;align-items:stretch;gap:0;
    padding:0;
    background:var(--surface);border-bottom:1px solid var(--line);
    box-shadow:0 1px 2px var(--sh06,rgba(16,24,40,.06));position:sticky;top:0;z-index:40}
  .apphd-name{display:flex;align-items:center;line-height:1;white-space:nowrap;color:var(--text);
    font-weight:var(--fw-head);font-size:var(--fs-h2);letter-spacing:-.2px;flex:0 0 auto;height:52px;box-sizing:border-box;padding:0 20px;border-bottom:1px solid var(--line);margin-bottom:0;}
  .apphd-name{display:none!important}
  .apphd-name .sub{font-size:var(--fs-sub);font-weight:var(--fw-body);color:#8A9099;margin-left:9px;letter-spacing:-.2px}
  .apphd-seg{display:flex;gap:4px;margin-left:0;padding:6px 20px;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none;flex:0 1 auto;align-self:stretch;align-items:center;scroll-padding-inline:20px}
  .apphd-seg::-webkit-scrollbar{display:none}
  .apphd-seg button{min-height:40px;border:0;background:transparent;color:var(--text-2);font-weight:var(--fw-strong);font-size:var(--fs-body);
    letter-spacing:-.2px;padding:0 14px;cursor:pointer;transition:.15s;position:relative;border-radius:10px;
    white-space:nowrap;font-family:inherit;flex:0 0 auto}
  .apphd-seg button.on{color:var(--accent,#3a6df0);font-weight:var(--fw-head);background:rgba(58,109,240,.09)}
  .apphd-seg button.on::after{display:none}
  .apphd-seg button:not(.on):hover{color:var(--text);background:var(--surface-2)}
  .apphd-more{position:relative;display:flex;align-self:stretch}
  .apphd-more>#teamMoreBtn{min-width:64px}
  .apphd-more-menu{display:none;position:fixed;z-index:180;width:172px;padding:7px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 18px 42px var(--sh18,rgba(16,24,40,.18))}
  .apphd-more.open .apphd-more-menu{display:grid}
  .apphd-more-menu button{width:100%;height:40px!important;display:flex!important;align-items:center!important;justify-content:flex-start!important;padding:0 12px!important;border-radius:10px!important}
  .apphd-more-menu button::before{content:"";width:16px;flex:0 0 16px;font-size:var(--fs-sub)}
  .apphd-more-menu button.on{background:rgba(58,109,240,.1)!important;color:var(--accent,#3a6df0)!important}
  .apphd-more-menu button.on::before{content:"✓"}
  @media(max-width:520px){.apphd-name .sub{display:none}.apphd-seg{padding:6px 10px;gap:3px;scroll-padding-inline:10px;flex:1 1 100%}.apphd-seg>button,.apphd-more{flex:0 0 auto}.apphd-seg button{min-height:32px;padding:0 12px;text-align:center;font-size:var(--fs-sub)}.apphd-more>#teamMoreBtn{min-width:60px;width:auto}}

  /* ---------- sub top (검색 + 계층) ---------- */
  .top{flex:0 0 auto;background:var(--frame);border-bottom:1px solid var(--line);padding:12px 20px 0}
  .search{position:relative;margin-bottom:11px}
  .search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--text-3);pointer-events:none}
  .search input{width:100%;height:40px;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;
    padding:0 34px;font-family:var(--f);font-size:var(--fs-title);color:var(--text);outline:none}
  .search input:focus{border-color:var(--accent);background:var(--surface)}
  .search .clr{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:22px;height:22px;border:0;
    background:var(--line);color:var(--text-2);border-radius:50%;cursor:pointer;display:none;align-items:center;justify-content:center;font-size:var(--fs-body)}
  .search .clr.on{display:flex}
  .layers{display:flex;gap:4px}
  .tm-back{display:inline-flex;align-items:center;gap:4px;height:32px;padding:0 10px 0 6px;margin:0 0 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface,#fff);color:var(--text-2,#4b5563);font:inherit;font-size:13px;font-weight:600;cursor:pointer}
  .tm-back:hover{background:var(--surface-2,#f4f5f7);color:var(--text)}
  .layers button{flex:1;border:0;background:transparent;color:var(--text-3);font-family:var(--f);
    font-weight:var(--fw-body);font-size:var(--fs-body);padding:9px 4px 11px;cursor:pointer;position:relative;letter-spacing:-.2px}
  .layers button b{display:block;font-size:var(--fs-body);font-weight:var(--fw-head)}
  .layers button span{display:block;font-size:var(--fs-micro);font-weight:var(--fw-body);color:var(--text-3);margin-top:1px}
  .layers button.on{color:var(--text)}
  .layers button.on::after{content:"";position:absolute;left:14%;right:14%;bottom:0;height:2.5px;border-radius:2px;background:var(--accent)}
  /* 2.592 — 탭 밑줄은 층마다 색을 달리하지 않는다(초록은 «가능» 의 색). 전부 accent(위 규칙) */
  
  

  /* ---------- body ---------- */
  .stage{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:14px 16px 72px}
  .stage::-webkit-scrollbar{width:0}

  .note{background:var(--surface);border:1px solid var(--line-soft);border-left:3px solid var(--accent);
    border-radius:10px;padding:11px 13px;font-size:var(--fs-sub);line-height:1.65;color:var(--text-2);margin-bottom:12px}
  .note b{color:var(--text);font-weight:var(--fw-body)}
  .ro{background:var(--surface-2);border:1px solid var(--line);border-left:3px solid var(--text-3);
    border-radius:10px;padding:10px 13px;font-size:var(--fs-sub);line-height:1.6;color:var(--text-2);margin-bottom:12px}
  .ro b{color:var(--text);font-weight:var(--fw-body)}

  .toolbar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
  .btn{border:1px solid var(--line);background:var(--surface);color:var(--text);font-family:var(--f);
    font-weight:var(--fw-body);font-size:var(--fs-body);padding:9px 14px;border-radius:10px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
  .btn:active{transform:scale(.97)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.ghost{background:transparent;color:var(--text-2)}
  .btn.warn{background:transparent;color:var(--c-def);border-color:var(--line)}
  .toolbar .spacer{flex:1}

  .gfilter{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
  .gfilter button{border:1px solid var(--line);background:var(--surface);color:var(--text-2);font-family:var(--f);
    font-weight:var(--fw-body);font-size:var(--fs-sub);padding:6px 12px;border-radius:20px;cursor:pointer}
  .gfilter button .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:1px}
  .gfilter button.on{color:#fff;border-color:transparent;background:var(--text)}
  .gfilter button.on.att{background:var(--c-att)} .gfilter button.on.def{background:var(--c-def)}
  .gfilter button.on.tra{background:var(--c-tra)} .gfilter button.on.com{background:var(--c-com)}

  .grp{display:flex;align-items:center;gap:8px;margin:20px 2px 10px;font-size:var(--fs-sub);font-weight:var(--fw-head);color:var(--text-2);letter-spacing:.02em}
  .grp:first-of-type{margin-top:2px}
  .grp .bar{width:3px;height:14px;border-radius:2px;background:var(--text-3)}
  .grp .cnt{font-weight:var(--fw-body);color:var(--text-3);font-size:var(--fs-caption)}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:9px}
  .card{position:relative;background:var(--surface);border:1px solid var(--line-soft);border-radius:12px;padding:12px 34px 12px 13px;
    border-left:3px solid var(--text-3);cursor:pointer;transition:transform .08s,box-shadow .12s}
  .card:hover{box-shadow:0 3px 12px var(--sh08,rgba(16,24,40,.08))}
  .card:active{transform:scale(.985)}
  .card .hd{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:5px}
  .card .en{font-size:var(--fs-h2);font-weight:var(--fw-head);letter-spacing:-.3px;color:var(--text)}
  .card .ko{font-size:var(--fs-sub);font-weight:var(--fw-body);color:var(--text-2)}
  .card .desc{font-size:var(--fs-sub);line-height:1.6;color:var(--text-2);margin-top:2px}
  .card.q .en{font-size:var(--fs-title);color:var(--text-2);order:2}
  .card.q .ko{font-size:var(--fs-input);font-weight:var(--fw-head);color:var(--text);order:1}
  .card .pen{position:absolute;top:9px;right:9px;width:20px;height:20px;color:var(--text-3);opacity:.5}
  .card:hover .pen{opacity:.9;color:var(--accent)}
  .card.att{border-left-color:var(--c-att)} .card.def{border-left-color:var(--c-def)}
  .card.tra{border-left-color:var(--c-tra)} .card.com{border-left-color:var(--c-com)}

  /* 빈 상태 */
  .empty{text-align:center;padding:40px 20px}
  .empty .ico{font-size:var(--fs-num-lg);margin-bottom:10px}
  .empty .h{font-size:var(--fs-input);font-weight:var(--fw-head);color:var(--text);margin-bottom:5px}
  .empty .s{font-size:var(--fs-body);color:var(--text-3);line-height:1.7;margin-bottom:18px}
  .empty .btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}

  .principles{margin-top:26px;background:var(--surface-2);border:1px solid var(--line-soft);border-radius:12px;padding:14px 16px}
  .principles h3{font-size:var(--fs-sub);font-weight:var(--fw-head);letter-spacing:.06em;color:var(--text-3);text-transform:uppercase;margin-bottom:9px}
  .principles ol{margin:0;padding-left:18px}
  .principles li{font-size:var(--fs-sub);line-height:1.75;color:var(--text-2)}
  .principles li b{color:var(--text);font-weight:var(--fw-body)}

  mark{background:var(--accent-soft);color:inherit;border-radius:4px;padding:0 1px;font-weight:var(--fw-head)}

  /* ===== 편집 모달 ===== */
  .mask{position:fixed;inset:0;background:rgba(16,20,28,.45);backdrop-filter:blur(2px);z-index:100;
    display:flex;align-items:center;justify-content:center;padding:18px;opacity:0;pointer-events:none;transition:opacity .16s}
  .mask.on{opacity:1;pointer-events:auto}
  .modal{width:100%;max-width:440px;max-height:88dvh;overflow-y:auto;background:var(--frame);border:1px solid var(--line);
    border-radius:16px;box-shadow:0 24px 70px var(--sh4,rgba(16,24,40,.4));padding:18px 18px 16px;transform:translateY(8px);transition:transform .16s}
  .mask.on .modal{transform:none}
  .modal h2{font-size:var(--fs-input);font-weight:var(--fw-head);margin-bottom:14px}
  .fld{margin-bottom:12px}
  .fld label{display:block;font-size:var(--fs-caption);font-weight:var(--fw-head);letter-spacing:.02em;color:var(--text-3);text-transform:uppercase;margin-bottom:6px}
  .fld input,.fld textarea{width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;
    padding:9px 11px;font-family:var(--f);font-size:var(--fs-title);color:var(--text);outline:none;resize:none}
  .fld input:focus,.fld textarea:focus{border-color:var(--accent);background:var(--surface)}
  .fld textarea{min-height:62px;line-height:1.55}
  .seg2{display:flex;gap:5px}
  .seg2 button{flex:1;border:1px solid var(--line);background:var(--surface-2);color:var(--text-2);font-family:var(--f);
    font-weight:var(--fw-body);font-size:var(--fs-sub);padding:8px 4px;border-radius:10px;cursor:pointer}
  .seg2 button.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .gchips{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
  .gchips button{border:1px solid var(--line);background:var(--surface);color:var(--text-2);font-family:var(--f);
    font-weight:var(--fw-body);font-size:var(--fs-caption);padding:5px 10px;border-radius:10px;cursor:pointer}
  .gchips button.on{background:var(--text);border-color:var(--text);color:#fff}
  .mrow{display:flex;gap:8px;margin-top:16px;align-items:center}
  .mrow .del{margin-right:auto;border:0;background:transparent;color:var(--c-def);font-family:var(--f);font-weight:var(--fw-body);font-size:var(--fs-body);cursor:pointer;padding:8px 4px}
  .mrow .del.hide{display:none}
  /* 프리셋 선택 카드 */
  .preset{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface-2);
    border-radius:12px;padding:12px 14px;margin-bottom:8px;cursor:pointer;font-family:var(--f);transition:.12s}
  .preset:hover{border-color:var(--accent);background:var(--surface)}
  .preset:active{transform:scale(.99)}
  .preset .pn{display:block;font-size:var(--fs-title);font-weight:var(--fw-head);color:var(--text)}
  .preset .pn b{color:var(--accent);font-weight:var(--fw-head);margin-left:4px}
  .preset .pt{display:block;font-size:var(--fs-sub);color:var(--text-3);margin-top:3px;line-height:1.5}

  /* ---------- dark ---------- */
  body.fmdark{--bg:#121417;--frame:#1B1E23;--surface:#1B1E23;--surface-2:#23272D;--line:#2E333A;--line-soft:#23272D;
    --text:#F2F3F5;--text-2:#A9AFB8;--text-3:#7C838D;--accent:#6F94F5;--accent-soft:rgba(111,148,245,.16);
    --c-att-soft:rgba(111,148,245,.14);--c-def-soft:rgba(224,110,105,.14);--c-tra-soft:rgba(224,180,90,.14);--c-com-soft:rgba(90,200,160,.14);
    background:#121417;color:#F2F3F5}
  body.fmdark .apphd-name{border-bottom-color:#2E333A!important}
body.fmdark .apphd{background:#1B1E23;border-color:#2E333A}
  body.fmdark .apphd-seg{background:transparent;border-color:transparent}
  body.fmdark .apphd-seg button{color:#A9AFB8}
  body.fmdark .apphd-seg button.on{background:transparent;color:#F2F3F5;box-shadow:none}
</style>

<script>
/* ==== PWA 안전 다이얼로그 (confirm 대체) ==== */
(function(){
  if(window.psConfirm) return;
  function build(msg,onOk,onCancel){
    var ov=document.createElement('div');
    ov.style.cssText='position:fixed;inset:0;background:rgba(16,20,28,.45);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px';
    var bx=document.createElement('div');
    bx.style.cssText='width:100%;max-width:340px;background:var(--frame,#fff);border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.4);padding:18px 18px 14px;font-family:var(--f)';
    bx.innerHTML='<div style="font-size:14px;line-height:1.6;color:var(--text,#14161A);white-space:pre-wrap;margin-bottom:16px">'+msg+'</div>';
    var row=document.createElement('div'); row.style.cssText='display:flex;gap:8px;justify-content:flex-end';
    var c=document.createElement('button'); c.textContent='취소'; c.style.cssText='border:1px solid var(--line,#E3E6EA);background:var(--surface-2,#F1F2F4);color:var(--text-2,#646A73);font-family:inherit;font-weight:600;font-size:13px;padding:9px 15px;border-radius:10px;cursor:pointer';
    var o=document.createElement('button'); o.textContent='확인'; o.style.cssText='border:0;background:#C24A46;color:#fff;font-family:inherit;font-weight:800;font-size:13px;padding:9px 15px;border-radius:10px;cursor:pointer';
    c.onclick=function(){ov.remove();onCancel&&onCancel();}; o.onclick=function(){ov.remove();onOk&&onOk();};
    row.appendChild(c);row.appendChild(o);bx.appendChild(row);ov.appendChild(bx);document.body.appendChild(ov);
  }
  window.psConfirm=function(msg,onOk,onCancel){ build(String(msg),onOk,onCancel); };
})();
</script>

  <div class="top">
    <!-- 1.915 — 게임모델·팀 홈 등에서 들어왔을 때 되돌아가는 문(사용자). 셸이 어디서 왔는지 기억해 그 화면으로 보낸다 -->

  function mergeRows(rows){
    var have={}; store.items.forEach(function(it){have[(it.ko+'|'+it.en).toLowerCase()]=1;});
    var added=0;
    rows.forEach(function(r){ var k=(r[2]+'|'+r[3]).toLowerCase(); if(!have[k]){store.items.push({id:uid(),l:r[0],g:r[1],ko:r[2],en:r[3],d:r[4]});have[k]=1;added++;} });
    save(); render();
    return added;
  }

    var ov=document.createElement('div'); ov.className='mask on';
    var box=document.createElement('div'); box.className='modal';
    var h='<h2>세트 불러오기</h2><div style="font-size:12px;color:var(--text-3);margin:-6px 0 14px;line-height:1.6">고르면 현재 목록에 추가돼요 (이미 있는 용어는 건너뜀).</div>';
    PRESETS.forEach(function(p){
      h+='<button class="preset" data-id="'+p.id+'"><span class="pn">'+esc(p.name)+'<b>'+p.rows().length+'</b></span><span class="pt">'+esc(p.tag)+'</span></button>';
    });
    h+='<div class="mrow"><button class="btn ghost" id="pkCancel" style="margin-left:auto">닫기</button></div>';
    box.innerHTML=h; ov.appendChild(box); document.body.appendChild(ov);
    ov.addEventListener('click',function(e){
      if(e.target===ov || e.target.id==='pkCancel'){ ov.remove(); return; }
      var b=e.target.closest('.preset'); if(!b)return;
      var p=PRESETS.filter(function(x){return x.id===b.dataset.id;})[0];
      ov.remove();
      if(p){ var n=mergeRows(p.rows()); toast(n>0? (p.name+' · '+n+'개 추가') : '이미 모두 있어요'); }
    });
  }

  // 가벼운 토스트
  function toast(msg){
    var t=document.createElement('div');
    t.textContent=msg;
    t.style.cssText='position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:300;background:var(--text);color:var(--bg);font-family:var(--f);font-weight:600;font-size:13px;padding:10px 16px;border-radius:20px;box-shadow:0 8px 24px rgba(0,0,0,.25);opacity:0;transition:opacity .2s';
    document.body.appendChild(t); requestAnimationFrame(function(){t.style.opacity='1';});
    setTimeout(function(){t.style.opacity='0';setTimeout(function(){t.remove();},250);},1600);
  }

  var stage=document.getElementById('stage'),
      qEl=document.getElementById('q'), qClr=document.getElementById('qClr'),
      layersEl=document.getElementById('layers');
  var curLayer='signal', curGroup='all', curQ='';

  function esc(s){return window.PSSafe&&window.PSSafe.html?window.PSSafe.html(s):String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function hi(s){ if(!curQ)return esc(s); try{var re=new RegExp('('+curQ.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig');return esc(s).replace(re,'<mark>$1</mark>');}catch(_){return esc(s);} }

  function groupsIn(layer){
    var set={},arr=[];
    store.items.forEach(function(it){ if(it.l===layer && !set[it.g]){set[it.g]=1;arr.push(it.g);} });
    var known=GORDER[layer]||[], ordered=[];
    known.forEach(function(g){ if(set[g]){ordered.push(g);set[g]=0;} });
    arr.forEach(function(g){ if(set[g]){ordered.push(g);} });
    return ordered;
  }

  var PEN='<svg class="pen" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l1-4L16 5a1.8 1.8 0 012.6 0l.4.4a1.8 1.8 0 010 2.6L8 19l-4 1z"/></svg>';

  function card(it){
    var q=it.l!=='signal'?' q':'';
    var col=GCLS[it.g]?(' '+GCLS[it.g]):'';
    return '<div class="card'+q+col+'" data-id="'+it.id+'">'
      +'<div class="hd"><span class="en">'+hi(it.en)+'</span><span class="ko">'+hi(it.ko)+'</span></div>'
      +(it.d?'<div class="desc">'+hi(it.d)+'</div>':'')
      +(canEdit()?PEN:'')+'</div>';
  }

  function chip(g,label,cls,active){
    var dot=cls?'<span class="dot" style="background:var(--c-'+cls+')"></span>':'';
    return '<button data-g="'+esc(g)+'" class="'+(active?'on ':'')+(cls||'')+'">'+dot+esc(label)+'</button>';
  }

  function render(){
    var q=curQ.toLowerCase(), searching=!!q;
    var rows=store.items.filter(function(it){
      if(searching) return (it.ko+' '+it.en+' '+it.d).toLowerCase().indexOf(q)>=0;
      if(it.l!==curLayer) return false;
      if(curGroup!=='all' && it.g!==curGroup) return false;
      return true;
    });

    var html='';
    if(searching){
      html+='<div class="grp" style="margin-top:2px"><span class="bar"></span>검색 결과<span class="cnt">'+rows.length+'개</span></div>';
      html+= rows.length? '<div class="grid">'+rows.map(card).join('')+'</div>'
        : '<div class="empty"><div class="s">검색 결과가 없어요.<br>다른 말로 찾아보세요.</div></div>';
      stage.innerHTML=html; bindCards(); stage.scrollTop=0; return;
    }

    var layerCount=store.items.filter(function(it){return it.l===curLayer;}).length;
    var ro=!canEdit();
    html+='<div class="note">'+LAYER_NOTE[curLayer]+'</div>';
    if(ro) html+='<div class="ro"><svg style="width:14px;height:14px;vertical-align:-2px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/><circle cx="12" cy="16" r="1"/></svg> <b>보기 전용</b> — 편집하려면 관리자에게 <b>공용어</b> 편집 권한을 요청하세요.</div>';

    if(layerCount===0){
      if(ro){
        html+='<div class="empty"><div class="ico"><svg style="width:30px;height:30px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/><circle cx="12" cy="16" r="1"/></svg></div><div class="h">'+LAYER_LB[curLayer]+'가 아직 비어 있어요</div>'
          +'<div class="s">보기 전용입니다.<br>관리자가 용어를 추가하면 여기에 표시돼요.</div></div>';
        stage.innerHTML=html; return;
      }
      html+='<div class="empty"><div class="ico"><svg style="width:30px;height:30px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20a8 8 0 1 0-8-8c0 1.85.63 3.55 1.69 4.9L4 21l4.29-1.35A7.94 7.94 0 0 0 12 20z"/></svg></div>'
        +'<div class="h">'+LAYER_LB[curLayer]+'가 아직 비어 있어요</div>'
        +'<div class="s">우리 팀이 쓰는 말을 직접 채우거나,<br>준비된 세트를 골라 시작할 수 있어요.</div>'
        +'<div class="btns"><button class="btn primary" id="emAdd">＋ 용어 추가</button>'
        +'<button class="btn" id="emDef">세트 불러오기</button></div></div>';
      stage.innerHTML=html;
      var ea=document.getElementById('emAdd'); if(ea)ea.onclick=function(){openEditor(null,curLayer);};
      var ed=document.getElementById('emDef'); if(ed)ed.onclick=function(){openPicker();};
      return;
    }

    // 툴바 + 그룹 필터 (편집 권한 있을 때만 툴바)
    if(!ro) html+='<div class="toolbar"><button class="btn primary" id="tbAdd">＋ 용어 추가</button>'
      +'<button class="btn ghost" id="tbDef">세트 불러오기</button>'
      +'<span class="spacer"></span>'
      +'<button class="btn warn" id="tbReset">초기화</button></div>';
    var groups=groupsIn(curLayer);
    html+='<div class="gfilter" id="gfilter">'+chip('all','전체','',curGroup==='all');
    groups.forEach(function(g){ html+=chip(g,g,GCLS[g]||'',curGroup===g); });
    html+='</div>';

    var view=rows;
    var order=[],seen={};
    view.forEach(function(it){ if(!seen[it.g]){seen[it.g]=[];order.push(it.g);} seen[it.g].push(it); });
    // 그룹 표시 순서 정렬
    var known=GORDER[curLayer]||[];
    order.sort(function(a,b){ var ia=known.indexOf(a),ib=known.indexOf(b); ia=ia<0?99:ia; ib=ib<0?99:ib; return ia-ib; });
    order.forEach(function(gname){
      html+='<div class="grp"><span class="bar" style="background:'+(GCLS[gname]?'var(--c-'+GCLS[gname]+')':'var(--text-3)')+'"></span>'+esc(gname)+'<span class="cnt">'+seen[gname].length+'</span></div>';
      html+='<div class="grid">'+seen[gname].map(card).join('')+'</div>';
    });

    if(curLayer==='concept'){
      html+='<div class="principles"><h3>운영 원칙</h3><ol>'
        +'<li>코치 전원이 <b>동일 정의</b>를 유지합니다.</li>'
        +'<li>영상 분석에서도 <b>같은 언어</b>를 씁니다.</li>'
        +'<li>훈련에서 쓰는 언어를 <b>경기에서도 그대로</b> 씁니다.</li>'
        +'<li>같은 단어가 여러 뜻으로 쓰이지 않도록 이 정의를 기준으로 삼습니다.</li>'
        +'</ol></div>';
    }

    stage.innerHTML=html; bindCards();
    var tb=document.getElementById('tbAdd'); if(tb)tb.onclick=function(){openEditor(null,curLayer);};
    var tbd=document.getElementById('tbDef'); if(tbd)tbd.onclick=function(){ openPicker(); };
    var tbr=document.getElementById('tbReset'); if(tbr)tbr.onclick=function(){
      psConfirm('모든 용어를 삭제하고 빈 상태로 되돌릴까요?\n되돌릴 수 없어요.',function(){ store.items=[]; save(); curGroup='all'; curQ=''; qEl.value=''; qClr.classList.remove('on'); render(); });
    };
    var gf=document.getElementById('gfilter');
    if(gf)gf.onclick=function(e){var b=e.target.closest('button');if(!b)return;curGroup=b.dataset.g;render();};
    stage.scrollTop=0;
  }

  function bindCards(){
    if(!canEdit()) return;
    [].forEach.call(stage.querySelectorAll('.card'),function(c){
      c.onclick=function(){ var it=store.items.filter(function(x){return x.id===c.dataset.id;})[0]; if(it)openEditor(it,it.l); };
    });
  }

  // ===== 편집 모달 =====
  var mask=document.getElementById('mask'), modal=document.getElementById('modal');
  var mTitle=document.getElementById('mTitle'), mLayerSeg=document.getElementById('mLayer'),
      mGrp=document.getElementById('mGrp'), mGrpChips=document.getElementById('mGrpChips'), mGrpLabel=document.getElementById('mGrpLabel'),
      mKo=document.getElementById('mKo'), mEn=document.getElementById('mEn'), mDesc=document.getElementById('mDesc'), mDescLabel=document.getElementById('mDescLabel'),
      mDel=document.getElementById('mDel'), mSave=document.getElementById('mSave'), mCancel=document.getElementById('mCancel');
  var editing=null, mLayer='signal';

  function setMLayer(l){
    mLayer=l;
    [].forEach.call(mLayerSeg.children,function(b){b.classList.toggle('on',b.dataset.l===l);});
    mGrpLabel.textContent = l==='signal'?'분류 (국면)':'분류';
    mDescLabel.textContent = l==='signal'?'행동 기준':(l==='action'?'동작':'의미');
    mDesc.placeholder = l==='signal'?'이 말을 들으면 무엇을 하는가':(l==='action'?'어떤 동작인가':'무엇을 가리키는가');
    // 그룹 추천 칩
    var known=GORDER[l]||[];
    var extra=[]; store.items.forEach(function(it){ if(it.l===l && known.indexOf(it.g)<0 && extra.indexOf(it.g)<0) extra.push(it.g); });
    var all=known.concat(extra);
    mGrpChips.innerHTML=all.map(function(g){return '<button type="button" data-g="'+esc(g)+'"'+(mGrp.value===g?' class="on"':'')+'>'+esc(g)+'</button>';}).join('');
  }
  mLayerSeg.onclick=function(e){var b=e.target.closest('button');if(!b)return;setMLayer(b.dataset.l);};
  mGrpChips.onclick=function(e){var b=e.target.closest('button');if(!b)return;mGrp.value=b.dataset.g;[].forEach.call(mGrpChips.children,function(x){x.classList.toggle('on',x===b);});};
  mGrp.oninput=function(){[].forEach.call(mGrpChips.children,function(x){x.classList.toggle('on',x.dataset.g===mGrp.value);});};

  function openEditor(it,presetLayer){
    if(!canEdit()) return;
    editing=it||null;
    mTitle.textContent = it?'용어 수정':'용어 추가';
    mDel.classList.toggle('hide',!it);
    mKo.value=it?it.ko:''; mEn.value=it?it.en:''; mDesc.value=it?it.d:''; mGrp.value=it?it.g:'';
    setMLayer(it?it.l:(presetLayer||curLayer));
    mask.classList.add('on');
    setTimeout(function(){ (it?mKo:mKo).focus(); },60);
  }
  function closeEditor(){ mask.classList.remove('on'); editing=null; }

  mCancel.onclick=closeEditor;
  mask.onclick=function(e){ if(e.target===mask)closeEditor(); };
  mSave.onclick=function(){
    var ko=mKo.value.trim(), en=mEn.value.trim(), d=mDesc.value.trim(), g=mGrp.value.trim();
    if(!ko && !en){ mKo.focus(); mKo.style.borderColor='var(--c-def)'; setTimeout(function(){mKo.style.borderColor='';},900); return; }
    if(editing){ editing.l=mLayer; editing.g=g; editing.ko=ko; editing.en=en; editing.d=d; }
    else { store.items.push({id:uid(),l:mLayer,g:g,ko:ko,en:en,d:d}); }
    save();
    curLayer=mLayer; curGroup='all';
    [].forEach.call(layersEl.children,function(x){x.classList.toggle('on',x.dataset.l===mLayer);});
    closeEditor(); render();
  };
  mDel.onclick=function(){
    if(!editing)return;
    psConfirm('"'+(editing.ko||editing.en)+'" 용어를 삭제할까요?',function(){
      store.items=store.items.filter(function(x){return x.id!==editing.id;});
      save(); closeEditor(); render();
    });
  };

  // 계층 탭
  layersEl.onclick=function(e){
    var b=e.target.closest('button'); if(!b)return;
    curLayer=b.dataset.l; curGroup='all';
    [].forEach.call(layersEl.children,function(x){x.classList.toggle('on',x===b);});
    render();
  };
  qEl.oninput=function(){ curQ=qEl.value.trim(); qClr.classList.toggle('on',!!curQ); render(); };
  qClr.onclick=function(){ qEl.value=''; curQ=''; qClr.classList.remove('on'); qEl.focus(); render(); };

  // 팀 네비 (scout/gamemodel과 동일 계약)
  var teamNav=document.getElementById('teamNav');
  var teamMore=document.getElementById('teamMore'),teamMoreBtn=document.getElementById('teamMoreBtn');
  function teamMoreClose(){if(teamMore)teamMore.classList.remove('open');if(teamMoreBtn)teamMoreBtn.setAttribute('aria-expanded','false');}
  window.addEventListener('message',function(e){var d=e.data||{};if(d.source==='app'&&d.type==='closeTransientUI')teamMoreClose();});
  if(teamMoreBtn)teamMoreBtn.onclick=function(e){
    e.stopPropagation();var open=!teamMore.classList.contains('open'),menu=teamMore.querySelector('.apphd-more-menu');
    if(open&&menu){var r=this.getBoundingClientRect(),mw=172,left=Math.max(10,Math.min(window.innerWidth-mw-10,r.right-mw));menu.style.left=Math.round(left)+'px';menu.style.top=Math.round(r.bottom+6)+'px';}
    teamMore.classList.toggle('open',open);this.setAttribute('aria-expanded',open?'true':'false');
  };
  document.addEventListener('click',function(e){if(teamMore&&!teamMore.contains(e.target))teamMoreClose();});
  teamNav.onclick=function(e){
    var b=e.target.closest('button[data-v]'); if(!b)return; var v=b.dataset.v;teamMoreClose();
    if(v==='terms')return;
    try{
      if(v==='schedule') parent.postMessage({source:'terms',type:'openSchedule'},'*');
      else if(v==='gamemodel') parent.postMessage({source:'terms',type:'openGameModel'},'*');
      else parent.postMessage({source:'terms',type:'openTeamView',view:v},'*');
    }catch(_){}
  };

  render();
})();
</script>

html body .btns .btn:not(#_):not(#__),html body .mrow .btn:not(#_):not(#__){height:40px!important;min-height:40px!important;padding-top:0!important;padding-bottom:0!important;line-height:1!important;box-sizing:border-box!important}

@media (max-width:600px){
html body .apphd-seg button:not(#_):not(#__),html body .apphd-more button:not(#_):not(#__),html body .seg2 button:not(#_):not(#__){height:40px!important;min-height:40px!important;box-sizing:border-box!important}
}
</style>

<style id="ps-2598-terms">/* 2.598 — 공용어: «‹ 뒤로» 는 팀 내비가 있는 셸 안에서는 숨김(단독 열기에서만), 검색 40 → 32(데스크톱)/40(폰). ps-in-shell 은 board.html 15591 과 같은 한 줄. */
