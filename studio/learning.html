<style>
/* 2.219 — 학습 독립 앱 1판: 『축구를 배우는 법』 A·B·D 21절, 절 = 일곱 단(먼저 묻기·읽기·예시·꺼내기·왜·피드백·다시), 완료 = 3번 맞힘, 카드 재학습 3일·1주·3주.
   IDP·팀과 연결 없음. 저장 cs_learn_v1_<uid|local> (ps_sync_session 의 uid). 설계: processstudio-문서/설계-학습앱-MIKL-2026-08-22.md §8~§10 */
:root{--bg:#f4f5f7;--panel:#fff;--surface:#fff;--surface-2:#F4F5F7;--ink:#14161a;--gray:#646a73;--faint:#9aa0a8;--line:#e3e6ea;--line2:#d3d7dd;   /* 2.666 — --surface 가 라이트에 없어(다크 블록에만) var(--surface) 를 쓰는 상단 바·버튼·목차 면이 투명이었다(실측: 스크롤하면 sticky 상단 바 뒤로 글이 비쳤다) */
--acc:#7C4DFF;--acc-soft:#f0eaff;--acc-ink:#5a2fd6;--ok:#1f8a4c;--ok-soft:#e7f5ec;--no:#c9372c;--no-soft:#fdecea;--due:#c77d00;--due-soft:#fff4e0;
--font:'Pretendard Variable','Pretendard',-apple-system,BlinkMacSystemFont,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
textarea,input{font:inherit}
.k{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);font-weight:600}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:14px;padding:10px 18px;background:var(--surface);border-bottom:1px solid var(--line);font-size:13px}
.top .name{font-weight:600}
.top .track{padding:3px 9px;border-radius:6px;background:var(--acc-soft);color:var(--acc-ink);font-weight:600}
.top .pos{color:var(--gray)}
.top .tabs{margin-left:2px;display:flex;gap:14px;order:1}   /* 2.657 — 오른쪽 끝(margin-left:auto)이던 탭을 제목 옆(왼쪽 묶음)으로: 오른쪽 위 구석은 셸의 동기화 메모 자리(겹쳤다, 사용자) */
.top .pos,.top .mtitle{order:2}.top .demo{order:3;margin-left:auto}
.top .tabs button{color:var(--gray);padding:4px 0}
@media (pointer:coarse){.top .tabs{gap:2px}.top .tabs button{padding:0 12px;min-height:44px}}   /* 3.039 — 손가락 기기: «오늘 · 책 · 카드»가 21×27 · 10×27px 였다(피드백 DS-2). 글자 간격은 gap 대신 padding 이 맡는다 */
.top .tabs button.on{color:var(--ink);font-weight:600;box-shadow:inset 0 -2px 0 var(--acc)}
.top .demo{font-size:11px;color:var(--faint);border:1px dashed var(--line2);border-radius:6px;padding:3px 8px}
.wrap{max-width:1100px;margin:0 auto;padding:18px 18px 90px}
.page{display:none}.page.on{display:block}
/* 2.328 — 하단 바 아이콘은 선으로(기호 글자 ▤◉▥▦ 를 걷었다 — 앱 어디에도 그런 글자는 없다) */
.bt button svg{width:20px;height:20px;display:block;margin:0 auto 3px}
.bt button.on svg{stroke-width:2.2}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:12px}
/* 2.342 — 역할 교과서 */
.rolegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin:12px 0 6px}
.rolecard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;text-align:left;display:grid;gap:4px}
.rolecard:hover{border-color:var(--acc)}
.rolecard b{font-size:14px}
.rolecard i{font-style:normal;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);font-weight:600}
.rolecard .rc-n{font-size:12px;color:var(--gray);margin-top:2px}
.rolecard .rc-bar{height:4px;border-radius:2px;background:var(--line);overflow:hidden;margin-top:6px}
.rolecard .rc-bar i{display:block;height:100%;background:var(--acc)}
.rolechips{display:flex;gap:6px;flex-wrap:wrap;margin:2px 0 12px}
.rolechips button{border:1px solid var(--line2);border-radius:999px;padding:5px 12px;font-size:12px;font-weight:600;color:var(--gray);background:var(--surface)}
.rolechips button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.tb-part{margin:20px 0 8px}
.tb-part .tp-t{font-size:16px;font-weight:600}
.tb-part .tp-std{font-size:11px;color:var(--faint);font-weight:600;margin-left:8px}
.tb-part .tp-who{font-size:12px;color:var(--gray);margin-top:2px}
.tb-chap{background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-bottom:8px;overflow:hidden}
.tb-chap>button{display:flex;align-items:center;gap:10px;width:100%;padding:11px 14px;text-align:left}
.tb-chap .tc-ic{font-size:13px;color:var(--acc-ink);width:18px;text-align:center}
.tb-chap .tc-t{flex:1;font-weight:600;font-size:13px}
.tb-chap .tc-n{font-size:11px;color:var(--faint);font-weight:600}
.tb-chap .tc-n.done{color:var(--ok)}
.tb-secs{border-top:1px solid var(--line);padding:4px 14px 8px}
.tb-secs .it .chk{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--line2);flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;font-size:10px}
.tb-secs .it .chk.ok{background:var(--ok);border-color:var(--ok);color:#fff}
/* 2.660 — 첫 화면 위계: 문 하나 → 내 책 → 접힌 목차 → 다른 책 */
.top .roleline{order:5;margin-left:auto;border:0;background:transparent;font:inherit;font-size:12px;font-weight:700;color:var(--ink);cursor:pointer;padding:4px 0;white-space:nowrap}
.top .demo{order:4}
@media(min-width:761px){.top{padding-right:150px}}   /* 2.661 — 오른쪽 끝은 셸의 동기화 메모 자리(실측: 탭·«바꾸기»가 메모와 겹쳤다) */
.top .roleline span{color:var(--acc-ink);font-weight:700}
.top .roleline[hidden]{display:none}
.door{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--acc);border-radius:14px;padding:16px 18px 14px;margin:4px 0 6px}
.door .k{display:block;font-size:11px;font-weight:800;letter-spacing:.06em;color:var(--acc-ink);margin-bottom:2px}
.door h3{margin:0 0 2px;font-size:20px;font-weight:800;letter-spacing:-.015em;line-height:1.25}
.door p{margin:0;color:var(--gray);font-size:13px}
.door .bar{height:5px;border-radius:3px;background:var(--line);margin:10px 0 6px;overflow:hidden}.door .bar i{display:block;height:100%;background:var(--acc);border-radius:3px}
.door .meta{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--faint);margin-bottom:10px}
.door .meta .lnk{border:0;background:transparent;font:inherit;font-size:11px;font-weight:700;color:var(--acc-ink);cursor:pointer;padding:0}
.sh{display:flex;align-items:baseline;gap:8px;margin:18px 0 8px}.sh b{font-size:15px;font-weight:800}.sh small{color:var(--gray);font-size:12px}
.mine{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.mb{position:relative;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font:inherit;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-height:0}
.mb .k{font-size:11px;font-weight:800;letter-spacing:.04em;color:var(--acc-ink)}
.mb b{font-size:15px;font-weight:800}
.mb small{color:var(--gray);font-size:12px}
.mb .ring{position:absolute;right:12px;top:12px;width:36px;height:36px;border-radius:50%;background:conic-gradient(var(--acc) var(--p,0%),var(--line) 0);display:grid;place-items:center}
.mb .ring i{width:28px;height:28px;border-radius:50%;background:var(--panel);display:grid;place-items:center;font-style:normal;font-size:9px;font-weight:800;color:var(--acc-ink)}
.tb-list{display:flex;flex-direction:column;gap:6px}
.tb-row{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:10px;font-size:13px}
.tb-row.part{padding:10px 2px 2px;font-weight:800;color:var(--gray);font-size:12px;letter-spacing:.02em}
.tb-row.part b{font-weight:800;flex:1}.tb-row.part em{font-style:normal;color:var(--faint);font-size:11px}
.tb-row.done{background:var(--panel);border:1px solid var(--line);color:var(--faint)}
.tb-row.done i{font-style:normal;color:var(--ok);font-weight:800}.tb-row.done b{font-weight:600;flex:1}.tb-row.done em{font-style:normal;font-size:11px}
.tb-list .tb-chap{margin:0}
.tb-list .tb-chap.open{border-color:var(--acc)}
.tb-list .tb-chap .tc-t{font-weight:600}
/* 3.079 — 서가는 옆으로 넘기지 않고 바둑판(남은 책이 몇 권 안 된다 — 한눈에) */
.shelf-row{padding-bottom:6px}
.shelf-row .toc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.shelf-row .toc-card{padding:10px 12px;border-radius:12px;min-width:0}
button.tb-row{width:100%;font:inherit;text-align:left;cursor:pointer;background:none;border:0}
button.tb-row.done{background:var(--panel);border:1px solid var(--line)}
.tb-row.part.fold{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 14px;color:var(--ink)}
.tb-row.part.fold em{color:var(--acc-ink);font-weight:700}
.door .row{gap:8px}
/* 3.080 — 나의 코칭 고리 */
.loopbox{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:10px 0 4px}
.lp-h{display:flex;align-items:baseline;gap:8px;margin-bottom:10px}.lp-h b{font-size:var(--t-5)}.lp-h small{color:var(--gray);font-size:var(--t-3)}
.lp-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.lp-c{border:1px solid var(--line);border-radius:10px;padding:9px 10px;display:grid;gap:2px;min-width:0}
.lp-c i{font-style:normal;font-size:var(--t-2);font-weight:800;color:var(--acc-ink)}.lp-c b{font-size:var(--t-4)}.lp-c span{font-size:var(--t-3);color:var(--gray)}.lp-c small{font-size:var(--t-2);color:var(--faint)}
.lp-next{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px;font-size:var(--t-4)}
@media(max-width:760px){.lp-row{grid-template-columns:1fr 1fr}}
/* 3.079 — 스튜디오에서 해보기 */
.trybox{margin-top:12px;border:1px solid var(--acc);border-radius:10px;padding:10px 14px;background:var(--acc-soft)}
.trybox .k{display:block;color:var(--acc-ink);margin-bottom:4px}
.trybox ol{margin:0 0 8px 18px;padding:0;display:grid;gap:3px}
.trybox .hint{margin:0 0 8px}
.keepbox{margin-top:10px;padding-top:10px;border-top:1px dashed var(--acc)}
.keepbox b{display:block;font-size:var(--t-4);margin-bottom:6px}
.keeprow{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.keeprow select,.keeprow input{border:1px solid var(--line2);border-radius:8px;padding:7px 9px;font:inherit;font-size:var(--t-4);background:var(--surface);color:var(--ink)}
.keeprow input{flex:1;min-width:200px}
.keepbox .pick{display:block;width:100%;text-align:left;border:1px solid var(--line2);border-radius:8px;padding:7px 10px;margin-bottom:6px;background:var(--surface);font-size:var(--t-4)}
.keepbox .pick small{display:block;color:var(--faint);font-size:var(--t-2)}
.shelf-row .toc-head{display:none}
@media(max-width:760px){.door h3{font-size:18px}.mine{grid-template-columns:1fr 1fr}.shelf-row .toc-grid{grid-template-columns:1fr 1fr}
  /* 3.079 — 역할 고르기: 폰에서 다섯 장이 한 화면을 다 채웠다 → 두 줄 바둑판 */
  .rolegrid{grid-template-columns:1fr 1fr;gap:8px}.rolecard{padding:12px}.rolecard .rc-bar{margin-top:4px}}
/* 2.664~2.665 — 앱 안 폰(body.ps-emb-phone — 아래 스크립트가 self≠top && 폭≤600 으로 켠다; 셸의 ps-phone-work 는 작전판 프레임만 받는다): 학습 제 아래 막대(.bt)가 앱 아래 막대 위에 한 겹 더 쌓였다(실측) → .bt 숨기고 상단 탭 셋을 작게 보인다 */
body.ps-emb-phone .bt{display:none!important}
body.ps-emb-phone .top .tabs{display:flex;gap:10px;font-size:12px}
body.ps-emb-phone .top .roleline{font-size:11px}
body.ps-emb-phone .wrap{padding-bottom:24px}
/* 절 한 장 */
.ls-crumb{font-size:11px;color:var(--faint);font-weight:600;letter-spacing:.04em;margin-bottom:4px}
.ls-h{font-size:21px;font-weight:600;letter-spacing:-.02em}
.ls-en{font-size:12px;color:var(--faint);font-weight:600;margin:2px 0 12px}
.ls-body{font-size:14px;line-height:1.75;color:var(--ink)}
.ls-points{margin:12px 0 0;padding:0 0 0 2px;list-style:none;display:grid;gap:6px}
.ls-points li{display:flex;gap:8px;font-size:13px;color:var(--ink)}
.ls-points li::before{content:'·';color:var(--acc-ink);font-weight:800}
.ls-opts{display:grid;gap:8px;margin-top:10px}
.ls-opts button{border:1px solid var(--line2);border-radius:10px;padding:11px 13px;text-align:left;font-size:13px;background:var(--surface)}
.ls-opts button.pick-ok{border-color:var(--ok);background:var(--ok-soft);font-weight:600}
.ls-opts button.pick-no{border-color:var(--no);background:var(--no-soft)}
.ls-why{margin-top:10px;font-size:13px;color:var(--gray);border-left:3px solid var(--ok);padding:2px 0 2px 10px}
.ls-src{font-size:11px;color:var(--faint);margin-top:14px}
.ls-nav{display:flex;gap:8px;margin:16px 0 0}
.ls-nav .sp{flex:1}
.card h4{font-size:14px;font-weight:800;margin-bottom:8px}
.btn{height:32px;padding:0 14px;border-radius:6px;border:1px solid var(--line2);background:var(--surface);font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.ghost{border:0;color:var(--gray)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.no{background:var(--surface);border-color:var(--no);color:var(--no)}
.btn[disabled]{opacity:.45;cursor:default}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tag{display:inline-block;font-size:10px;font-weight:600;padding:1px 6px;border-radius:4px}
.tag.mikl{background:var(--acc-soft);color:var(--acc-ink)}.tag.due{background:var(--due-soft);color:var(--due)}.tag.ok{background:var(--ok-soft);color:var(--ok)}
.list .it{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:13px}
.list .it:first-child{border-top:0}
.list .it .id{width:40px;font-size:11px;font-weight:600;color:var(--faint)}
.list .it .t{flex:1}
.list .it .st{font-size:11px;color:var(--faint)}.list .it .st.ok{color:var(--ok);font-weight:600}
.list .it.link{cursor:pointer}.list .it.link:hover .t{color:var(--acc-ink)}

/* 지금 */
.now{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:14px}
.due-card{border-color:var(--due);background:#fffdf7}
.due-card .k{color:var(--due)}
.hero{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
.hero .k{color:var(--acc-ink)}
.hero h3{font-size:22px;font-weight:800;letter-spacing:-.02em;margin:4px 0 6px}
.hero .why{color:var(--gray);margin-bottom:10px}
.steps{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:6px 0 12px}
.steps div{border:1px solid var(--line);border-radius:7px;padding:5px 4px;font-size:10px;color:var(--gray);text-align:center}
.steps div b{display:block;color:var(--ink);font-size:11px}
.steps div.done{background:var(--ok-soft);border-color:transparent;color:var(--ok)}.steps div.done b{color:var(--ok)}
.steps div.cur{border-color:var(--acc);background:var(--acc-soft)}.steps div.cur b{color:var(--acc-ink)}
.steps.s3{grid-template-columns:repeat(3,1fr)}.steps.s3 div{font-size:var(--t-3);padding:6px 4px}.steps.s3 div b{font-size:var(--t-3)}   /* 3.111 — 세 단 */
.lesson .src .okk{color:var(--ok)}
.figbox{margin:2px 0 14px}.figbox svg{display:block;width:100%;height:auto;max-height:420px}.figbox figcaption{font-size:var(--t-3);color:var(--gray);margin-top:6px;line-height:1.5}
.lesson .ex{margin-top:14px}.lesson .ex>.k{display:block;grid-column:1/-1;margin:0}
.why.good{border-color:var(--ok);background:var(--ok-soft)}
.fbx{margin-top:8px;font-size:var(--t-4);line-height:1.7;color:var(--ink)}.fbx .k{display:block;margin-bottom:2px}
details.more{background:var(--panel);border:1px dashed var(--line2);border-radius:12px;padding:10px 16px;margin:0 0 10px}
details.more summary{cursor:pointer;font-weight:600;font-size:var(--t-4);min-height:32px;display:flex;align-items:center;gap:8px}details.more summary small{font-weight:400;color:var(--faint);font-size:var(--t-2)}
details.more .mq{margin-top:12px}details.more .mq .k{display:block;margin-bottom:4px}
.pos-line{font-size:13px;color:var(--gray);margin-top:4px}.pos-line b{color:var(--ink)}

/* 책 */
.bookv{display:grid;grid-template-columns:240px minmax(0,1fr);gap:16px;align-items:start}
.toc{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 0;position:sticky;top:58px;max-height:calc(100vh - 80px);overflow:auto}
.toc .bh{padding:0 14px 10px;border-bottom:1px solid var(--line)}
.toc .bh h4{font-size:14px;font-weight:800}.toc .bh small{color:var(--faint);font-size:11px}
.toc .ch{padding:10px 14px 4px;font-size:11px;font-weight:600;color:var(--faint);letter-spacing:.06em;display:flex}
.toc .ch b{color:var(--acc-ink);margin-right:6px}.toc .ch span{margin-left:auto}
.toc .sx{display:flex;align-items:center;gap:8px;padding:6px 14px;font-size:12px;color:var(--gray);cursor:pointer}
.toc .sx i{width:13px;height:13px;border-radius:4px;border:1px solid var(--line2);flex:none}
.toc .sx.ok{color:var(--ink)}.toc .sx.ok i{background:var(--acc);border-color:var(--acc)}
.toc .sx.here{background:var(--acc-soft);color:var(--acc-ink);font-weight:600}
.toc .sx.quiz{color:var(--due);font-weight:600;border-top:1px dashed var(--line);margin-top:4px;padding-top:8px}
.lesson{max-width:720px}
.lesson .head{display:flex;align-items:baseline;gap:10px}
.lesson .head .id{font-size:12px;font-weight:800;color:var(--acc-ink)}
.lesson h3{font-size:22px;font-weight:800;letter-spacing:-.02em}
.lesson .src{font-size:12px;color:var(--faint);margin:2px 0 12px}
.stage{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 18px;margin-bottom:10px;position:relative}
.stage.locked{display:none}

<script>

/* ───────── 저장 ───────── */

/* ───────── 3.080 · 계정에 저장(사용자 «기록도 계정에 저장되게») ─────────
   이 기기의 기록(cs_learn_v1_<uid>)은 그대로 쓰고, 내 개인 공간의 학습 기록(셸 PSSync.learn)과 맞춘다.
   합치기는 «더 나아간 쪽»을 남긴다 — 맞힘 수는 큰 쪽, 카드는 단계가 높은 쪽, 적은 답은 비어 있지 않은 쪽(이 기기 먼저).
   그래서 두 기기에서 따로 공부해도 어느 쪽 진도도 사라지지 않는다. 로그인 전 · 셸 밖에서는 이 기기에만 남는다. */

function lmPick(a,b){ return (a!=null&&a!=='')?a:b; }
function mergeLearn(a,b){
  a=a||{}; b=b||{}; var o=Object.assign({},b,a), k;
  o.done={}; [b.done||{},a.done||{}].forEach(function(m){ for(k in m){ var x=m[k], y=o.done[k]; if(x&&(!y||(x.hits||0)>(y.hits||0)))o.done[k]=x; } });
  o.cards={}; [b.cards||{},a.cards||{}].forEach(function(m){ for(k in m){ var x=m[k], y=o.cards[k]; if(x&&(!y||(x.stage||0)>(y.stage||0)||((x.stage||0)===(y.stage||0)&&(x.due||0)>=(y.due||0))))o.cards[k]=x; } });

  return o;
}
function learnSame(raw){ try{ return !!raw&&JSON.stringify(JSON.parse(raw).s)===JSON.stringify(S); }catch(_){ return false; } }

  var api=learnApi(); if(!api){ if(then)then(false); return; }
  api.get().then(function(r){
    LSYNC.raw=r.raw; LSYNC.cupd=r.cupd; LSYNC.uid=r.uid; LSYNC.wid=r.wid;

}
function learnSchedulePush(ms){ clearTimeout(LSYNC.t); LSYNC.t=setTimeout(learnPush,ms==null?2000:ms); }

function lsDone(id,idp){ return !!(S.cur.done[id]||idp[id]); }
function roleMods(role){ return (window.LR_CUR&&LR_CUR.byTrack)?LR_CUR.byTrack(role):[]; }

function loopPrTxt(x){ return String(typeof x==='string'?x:((x&&(x.t||x.text||x.title))||'')).trim(); }
function loopVaultFetch(){
  if(loopVaultFetch._busy)return; loopVaultFetch._busy=true;
  try{ var st=(window.parent&&window.parent!==window&&window.parent.storage)||window.storage; if(!st){ loopVaultFetch._busy=false; return; }
    Promise.resolve(st.get('cs_drill_lib_v1')).then(function(r){

      var ids={}; (Array.isArray(lib)?lib:[]).forEach(function(d){ if(!d||d.deleted)return; var one={};
        (d.gmPhases||[]).forEach(function(x){ one[x]=1; }); (d.trainings||[]).forEach(function(t){ (t&&t.gmPhases||[]).forEach(function(x){ one[x]=1; }); });
        Object.keys(one).forEach(function(k){ ids[k]=(ids[k]||0)+1; }); });
      var before=JSON.stringify(window.__loopVault||null); window.__loopVault=ids; loopVaultFetch._busy=false;
      if(JSON.stringify(ids)!==before&&page==='toc')render();
    }).catch(function(){ loopVaultFetch._busy=false; });
  }catch(_){ loopVaultFetch._busy=false; }

function loopState(){
  var gm=myGameModel(), st={sd:0,sn:0,core:0,miss:[],pr:0,ph:0,phDrill:0};
  try{ (window.LR_STUDIO&&LR_STUDIO.chapters||[]).forEach(function(c){ (c.sections||[]).forEach(function(x){ st.sn++; if(isDone(x.id))st.sd++; }); }); }catch(_){}
  var V=window.__loopVault||{};
  LOOP_CORE.forEach(function(cm){
    var m=gm&&(gm.moments||[]).filter(function(x){ return x&&x.key===cm[0]; })[0], any=false;
    if(m)(m.phases||[]).forEach(function(ph,i){ var n=(ph.principles||[]).filter(function(x){ return loopPrTxt(x); }).length; if(!n)return; any=true; st.pr+=n; st.ph++;

}

var ROLE_BOOK_V={player:'2.441',coach:'2.441',physical:'2.442',analysis:'2.443',at:'2.444'};

function ensureRoleBook(track,cb){
  cb=cb||function(){};
  if(!ROLE_BOOK_V[track]){ cb(); return; }
  var st=_roleBook[track];
  if(st==='ok'||st==='fail'){ cb(); return; }
  (ensureRoleBook._q=ensureRoleBook._q||{})[track]=(ensureRoleBook._q[track]||[]).concat([cb]);
  if(st==='loading')return;
  _roleBook[track]='loading';
  var sc=document.createElement('script');
  sc.src='learn-book-'+track+'.js?v='+ROLE_BOOK_V[track];
  function done(ok){ _roleBook[track]=ok?'ok':'fail'; var q=ensureRoleBook._q[track]||[]; ensureRoleBook._q[track]=[]; q.forEach(function(f){ try{ f(); }catch(_){} }); }
  sc.onload=function(){ done(true); };
  sc.onerror=function(){ done(false); };
  document.head.appendChild(sc);
}

}

    +'</select><input id="keepT" maxlength="200" value="'+esc(k.text||'')+'" placeholder="원칙 한 줄 — 누가 · 언제 · 무엇을"></div>'
    +'<div class="row"><button type="button" class="btn pri" data-keep="1">담기 →</button><span class="hint" style="margin:0">예시 문장을 우리 팀 말로 고쳐 담으세요</span></div></div>';
}
function myGameModel(){ try{ var m=JSON.parse(localStorage.getItem('cs_gamemodel_personal_v1')||'null'); if(m&&Array.isArray(m.moments)&&m.moments.length)return m; }catch(_){} return window.__gmRemote||null; }
/* 3.080 — 이 기기에 개인 게임모델이 아직 없으면(새 기기) 계정의 것을 읽기만 해서 «내 원칙으로 훈련 만들기»에 쓴다. 쓰기는 게임모델 화면만 한다 */
function gmRemoteFetch(){
  try{ var loc=JSON.parse(localStorage.getItem('cs_gamemodel_personal_v1')||'null'); if(loc&&Array.isArray(loc.moments)&&loc.moments.length)return; }catch(_){}
  try{ var p=(window.parent&&window.parent!==window)?window.parent.PSSync:null; if(!p||!p.gmPersonal||!p.gmPersonal.owner())return;
    p.gmPersonal.get().then(function(r){ var d=r&&r.raw?JSON.parse(r.raw):null; if(d&&d.m&&Array.isArray(d.m.moments)){ window.__gmRemote=d.m; if(page==='book')render(); } }).catch(function(){}); }catch(_){}
}
function drillHtml(){
  var gm=myGameModel(), rows=[];
  if(gm)gm.moments.forEach(function(m){ (m.phases||[]).forEach(function(ph){ if(!ph||!ph.id)return;
    var pr=''; (ph.principles||[]).some(function(x){ var t=String(typeof x==='string'?x:((x&&(x.t||x.text))||'')).trim(); if(t){pr=t;return true;} return false; });
    if(pr)rows.push({id:ph.id,name:(m.name||'')+' › '+(ph.name||''),pr:pr}); }); });
  if(!rows.length)return '<div class="keepbox"><b>내 원칙으로 훈련 만들기</b><div class="hint" style="margin:4px 0 0">내 게임모델에 아직 원칙이 없어요. 1장(게임모델)의 «내 게임모델에 담기»로 먼저 한 줄 담아 보세요.</div></div>';
  return '<div class="keepbox"><b>내 원칙으로 훈련 만들기</b><div class="hint" style="margin:2px 0 6px">원칙을 고르면 훈련 설계가 열리고 제목 · 국면 · 코칭 포인트가 채워져요.</div>'
    +rows.slice(0,8).map(function(r,i){ return '<button type="button" class="pick" data-mkdrill="'+i+'"><small>'+esc(r.name)+'</small>'+esc(r.pr)+'</button>'; }).join('')+'</div>';
}
document.addEventListener('click',function(e){
  var b=e.target&&e.target.closest&&e.target.closest('[data-keep],[data-mkdrill]'); if(!b)return;
  try{
    if(b.hasAttribute('data-keep')){
      var mk=($('#keepM')||{}).value||'ao', tx=String(($('#keepT')||{}).value||'').trim();
      if(!tx){ toast('원칙 한 줄을 적어 주세요'); return; }
      parent.postMessage({source:'learning',type:'gmAdd',momentKey:mk,text:tx},'*');
    } else {
      var gm=myGameModel(), rows=[];
      if(gm)gm.moments.forEach(function(m){ (m.phases||[]).forEach(function(ph){ if(!ph||!ph.id)return; var pr=''; (ph.principles||[]).some(function(x){ var t=String(typeof x==='string'?x:((x&&(x.t||x.text))||'')).trim(); if(t){pr=t;return true;} return false; }); if(pr)rows.push({id:ph.id,name:(m.name||'')+' › '+(ph.name||''),pr:pr}); }); });
      var r=rows[+b.getAttribute('data-mkdrill')]; if(!r)return;
      parent.postMessage({source:'learning',type:'gmMakeDrill',phaseId:r.id,phaseName:r.name,principle:r.pr},'*');

});
/* ══ 3.111 · 한 절 = 세 단(사용자 «학습 페이지 제대로» → 2판) ══════════════════════════════════════
   예전 일곱 단(먼저 묻기 · 읽기 · 예시 · 꺼내기 · 왜 · 피드백 · 다시)은 읽을 글(약 1분)보다 쓸 칸(셋)이 많았고, 끝내려면
   «꺼내기»를 스스로 세 번 채점해야 했다. 이제 ① 읽기(그림 · 글 · 예시) ② 확인 한 문제(맞히면 완료 · 설명은 바로)
   ③ 해보기(스튜디오 · 다음 절). 먼저 묻기 · 꺼내기 · 왜는 «더 생각해 보기»로 접는다 — 적어 둔 답(S.ask)은 그대로.
   ⚠ 완료 표시는 예전과 같은 자리(S.done[id].hits ≥ 3)에 적는다 — 서재 진행률 · 계정 합치기(mergeLearn) · IDP 가 그대로 읽는다.
   ⚠ 모든 책(교과서 다섯 · 스튜디오 · 풋살)이 이 화면 하나를 쓴다. 그림(s.pic)은 learn-fig.js 가 그린다. */
function escB(t){ return esc(t).replace(/&lt;(\/?)b&gt;/g,'<$1b>'); }   /* 해설의 굵은 글씨(<b>)만 살린다 — 예전엔 «<b>…</b>» 글자가 그대로 보였다 */
function readMin(s){ var n=0; (s.read||[]).forEach(function(p){ n+=String(p).replace(/<[^>]+>/g,'').length; }); return Math.max(1,Math.round(n/450)); }
function renderSec(s){
  var a=S.ask, k=s.id, done=isDone(k);
  var ex=S.track==='player'?s.ex.slice().reverse():s.ex;
  var _c=chapOf(s.id), _si=((_c&&_c.sections)||[]).indexOf(s);   /* 3.103 — 머리에 절 id 대신 장 안의 자리 */
  var mc=s.mc, picked=S.mc[k], tries=+(a[k+':try']||0);
  var opts=shuffled(mc.o,k+':'+S.track+(tries?':'+tries:''));
  var pick=picked&&mc.o.filter(function(o){return o.id===picked})[0], right=!!(pick&&pick.ok);
  var okI=opts.findIndex(function(o){return o.ok});
  var h='<div class="lesson l3"><div class="head"><span class="id">'+(_si>=0?(_si+1)+' / '+_c.sections.length:'')+'</span><h3>'+esc(s.ko)+'</h3></div>'
    +'<div class="src">'+(s.src?esc(s.src)+' · ':'')+(done?'<b class="okk">완료</b> · ':'')+'<button class="btn ghost" style="height:auto;padding:0" id="tocToggle">목차</button></div>';
  h+='<div class="steps s3">'+[['읽기',true],['확인',done||right],['해보기',done||right]].map(function(x,i){ var cls=(i===1&&(done||right))?'done':(i===0?'done':((i===2&&(done||right))?'cur':'')); if(i===0&&!(done||right))cls='cur'; return '<div class="'+cls+'"><b>'+(i+1)+'</b>'+x[0]+'</div>'; }).join('')+'</div>';
  /* ① 읽기 */
  var pic=(s.pic&&window.LR_FIG)?LR_FIG.html(s.pic):'';
  var r1=(pic?'<figure class="figbox">'+pic+(s.fig?'<figcaption>'+esc(s.fig)+'</figcaption>':'')+'</figure>':'')
    +s.read.map(function(p){return '<p>'+p+'</p>'}).join('')
    +(!pic&&s.fig?'<div class="fig"><b>한 줄로</b> '+esc(s.fig)+'</div>':'')
    +'<div class="ex"><span class="k">예시</span>'+ex.map(function(e){return '<div><b class="w">'+esc(e.who)+'</b>'+e.t+'</div>'}).join('')+'</div>';
  h+=stageHtml(1,'읽기 · 약 '+readMin(s)+'분',r1,false);
  /* ② 확인 — 한 문제. 맞히면 완료, 틀리면 설명을 보고 다시 */
  var r2='<div class="q">'+esc(mc.q)+'</div><div class="opts">'+opts.map(function(o,i){var cls='';if(picked){if(o.ok)cls=' right';else if(picked===o.id)cls=' wrong'}return '<button class="opt'+cls+'" data-opt="'+o.id+'"'+(picked?' disabled':'')+'><b>'+String.fromCharCode(65+i)+'</b><span>'+esc(o.t)+'</span></button>'}).join('')+'</div>';
  if(picked){
    r2+='<div class="why'+(right?' good':'')+'"><b>'+(right?'맞았어요.':'정답은 '+String.fromCharCode(65+okI)+'.')+'</b> '+escB(mc.why||'')+'</div>'
      +(s.fb?'<div class="fbx"><span class="k">설명</span>'+s.fb+'</div>':'')
      +(right?'':'<div class="row" style="margin-top:8px"><button class="btn" id="retryQ">다시 풀기</button><span class="hint" style="margin:0">이 절은 내일 카드로 한 번 더 물어요</span></div>');
  } else if(done){
    r2+='<div class="hint" style="margin-top:6px">이미 마친 절이에요 — 다시 풀어 봐도 기록은 그대로예요.</div>';
  }
  h+=stageHtml(2,'확인 — 한 문제',r2,false);
  /* ③ 해보기 */
  var cardsN=(s.cards||[]).length;
  var r3=tryHtml(s)
    +((done||right)&&cardsN?'<div class="hint" style="margin:8px 0 0">이 절의 카드 '+cardsN+'장 — '+(S.cards[s.cards[0].id]?fmtDays(S.cards[s.cards[0].id].due):'3일 뒤')+' 다시 물어요(«카드» 탭).</div>':'')
    +'<div class="row" style="margin-top:10px"><button class="btn'+((done||right)?' pri':'')+'" id="nextSec">다음 절 →</button></div>';
  h+=stageHtml(3,'해보기',r3,false);
  /* 더 생각해 보기 — 예전 일곱 단의 쓰는 칸. 적어 둔 답은 그대로 */
  var rv=a[k+':rshow'];
  h+='<details class="more"'+((a[k+':pre']||a[k+':recall']||a[k+':why'])?' open':'')+'><summary>더 생각해 보기 <small>먼저 묻기 · 꺼내기 · 왜 — 쓰고 싶을 때만</small></summary>'
    +'<div class="mq"><span class="k">먼저 묻기</span><div class="q">'+esc(s.pre)+'</div><textarea id="pre" placeholder="틀려도 됩니다.">'+esc(a[k+':pre']||'')+'</textarea></div>'
    +'<div class="mq"><span class="k">꺼내기 — '+esc(s.recall.type)+'</span><div class="q">'+esc(s.recall.q)+'</div><textarea id="recall" placeholder="보지 않고 써 보세요.">'+esc(a[k+':recall']||'')+'</textarea>'
      +(rv?'<div class="ans">답: '+esc(s.recall.a)+'</div>':'<div class="row" style="margin-top:6px"><button class="btn" id="showAns">답 보기</button></div>')+'</div>'
    +'<div class="mq"><span class="k">왜 — 내 말로</span><div class="q">'+esc(s.why)+'</div><textarea id="why" placeholder="내 말로. 저장만 돼요.">'+esc(a[k+':why']||'')+'</textarea></div>'
    +'</details>';
  if(s.links)h+='<div class="linkbox">이어짐 → <b>'+esc(s.links)+'</b></div>';
  h+='</div>';
  return h;
}

  if(!item){var ok=res.filter(function(r){return r===1}).length;return h+'<div class="card"><h4>'+chLabel(c)+' 섞어 묻기 끝 — '+ok+' / '+c.mix.length+'</h4><p style="color:var(--gray)">틀린 것은 내일 "오늘 다시 꺼낼 것"에 들어갑니다(목업: 표시만). 장 머리 질문을 다시:</p><ol style="padding-left:18px;margin-top:8px">'+c.head.map(function(q){return '<li>'+esc(q)+'</li>'}).join('')+'</ol><div class="row" style="margin-top:10px"><button class="btn pri" id="mixDone">책으로</button><button class="btn ghost" id="mixRedo">다시</button></div></div></div>'}

  } else {
    body='<div class="q">('+esc(item.note)+') '+esc(item.q)+'</div><textarea id="mixAns" placeholder="'+(item.kind==='빈칸'?'빈칸을 채웁니다.':'내 말로.')+'"></textarea>'+(item.q.indexOf('3분 설명')>-1?'<div class="hint">저장만 — 원전 없이 설명되는지 스스로 확인하는 과제.</div><div class="row" style="margin-top:8px"><button class="btn pri" data-mgrade="1">저장하고 끝내기</button></div>':'<div class="row" style="margin-top:8px"><span class="hint" style="margin:0">본문을 떠올려 스스로 채점:</span><button class="btn ok" data-mgrade="1">맞았다</button><button class="btn no" data-mgrade="0">틀렸다</button></div>');

function renderBook(){
  var v=bookState.view, main='';

  $('#p-book').innerHTML='<div class="bookv"><aside class="toc'+((v==='toc'||bookState.tocOpen)?' show':'')+'">'+renderToc()+'</aside><div>'+main+'</div></div>';

  $$('#p-book [data-mix]').forEach(function(e){e.onclick=function(){bookState.view='mix';bookState.mixCh=e.dataset.mix;bookState.mixI=0;bookState.mixPick=null;S.mix[e.dataset.mix]=[];save();render()}});

/* 3.111 — 맞힌 절: 완료 표시(hits 3 — 예전 규칙과 같은 자리) · 카드 시작. 틀린 절: 카드를 내일로 */
function secCards(s,days){ (s.cards||[]).forEach(function(c){ if(!S.cards[c.id])S.cards[c.id]={ko:c.ko,from:s.id,stage:0,hits:0,due:now()+days*DAY,at:now()}; }); }
function secDone(s){
  var k=s.id, was=isDone(k);
  S.done[k]=S.done[k]||{hits:0,at:0}; if((S.done[k].hits||0)<3)S.done[k].hits=3; S.done[k].at=now();
  secCards(s,GAP[0]); mirrorCurDone(k);
  if(!was)lev('done',k,{via:1});
}
/* 다음 절 — 이 책의 다음 절. 교과서는 한 장(모듈)씩 책이 되므로, 장의 끝이면 그 역할 교과서의 다음 장 첫 절로 */
function goNextSec(s){
  var all=secs(), nx=all[all.indexOf(s)+1];
  if(nx){ S.now=nx.id; openSec(nx.id); return; }
  try{ var L=window.LR_CUR&&LR_CUR.lesson&&LR_CUR.lesson(s.id);
    if(L){ var flat=[]; roleMods(L.m.track).forEach(function(m){ m.lessons.forEach(function(l){ flat.push([m.id,l.id]); }); });
      var i=flat.findIndex(function(x){ return x[1]===s.id; }); if(i>=0&&flat[i+1]){ openLesson(flat[i+1][0],flat[i+1][1]); return; } } }catch(_){}
  bookState.view='toc'; go('book');
}
function bindSec(s){
  var k=s.id;
  ['pre','recall','why'].forEach(function(f){var el=$('#'+f);if(el)el.oninput=function(){S.ask[k+':'+f]=el.value;save()}});
  var sa=$('#showAns');if(sa)sa.onclick=function(){S.ask[k+':rshow']=1;save();render()};
  var mo=$('#p-book details.more');if(mo)mo.addEventListener('toggle',function(){ if(mo.open)lev('more',k); });
  $$('#p-book [data-opt]').forEach(function(b){b.onclick=function(){
    var o=s.mc.o.filter(function(x){return x.id===b.dataset.opt})[0], ok=!!(o&&o.ok);
    S.mc[k]=b.dataset.opt; lev('quiz',k,{ok:ok,tries:+(S.ask[k+':try']||0)});
    if(ok)secDone(s); else secCards(s,1);
    save(); toast(ok?'맞았어요 — 이 절을 마쳤어요':'아쉬워요 — 설명을 읽고 다시 풀어 보세요'); render();
    var st=$('#p-book [data-st="'+(ok?3:2)+'"]'); if(st&&ok)st.scrollIntoView({behavior:'smooth',block:'start'});
  }});
  var rq=$('#retryQ');if(rq)rq.onclick=function(){ S.ask[k+':try']=(+(S.ask[k+':try']||0))+1; delete S.mc[k]; save(); lev('retry',k); render(); var st=$('#p-book [data-st="2"]'); if(st)st.scrollIntoView({behavior:'smooth',block:'start'}); };
  var nb=$('#nextSec');if(nb)nb.onclick=function(){ lev('next',k,{closed:isDone(k)}); save(); goNextSec(s); };
}
function bindMix(){
  var ch=bookState.mixCh;
  $$('#p-book [data-mopt]').forEach(function(b){b.onclick=function(){bookState.mixPick=b.dataset.mopt;S.mix[ch]=S.mix[ch]||[];S.mix[ch][bookState.mixI]=b.dataset.ok==='1'?1:0;save();render()}});
  var nx=$('#mixNext');if(nx)nx.onclick=function(){bookState.mixI++;bookState.mixPick=null;render();window.scrollTo(0,0)};
  $$('#p-book [data-mgrade]').forEach(function(b){b.onclick=function(){S.mix[ch]=S.mix[ch]||[];S.mix[ch][bookState.mixI]=+b.dataset.mgrade;bookState.mixI++;save();render();window.scrollTo(0,0)}});
  var d=$('#mixDone');if(d)d.onclick=function(){bookState.view='toc';render()};
  var r=$('#mixRedo');if(r)r.onclick=function(){bookState.mixI=0;S.mix[ch]=[];save();render()};
}
function bindDue(){
  var sh=$('#dueShow');if(sh)sh.onclick=function(){bookState.dueShown=true;render()};
  $$('#p-book [data-dgrade]').forEach(function(b){b.onclick=function(){var c=dueCards()[0],cc=S.cards[c.key];if(b.dataset.dgrade==='1'){cc.stage++;cc.hits++;cc.due=now()+(GAP[cc.stage]||21)*DAY;toast(cc.stage>=3?'내 것이 됐습니다':'다음은 '+GAP[cc.stage]+'일 뒤')}else{cc.due=now()+DAY;toast('내일 다시')}bookState.dueShown=false;save();render()}});
  $$('#p-book [data-open]').forEach(function(b){b.onclick=function(){openAny(b.dataset.open)}});
}
/* ───────── 카드 ───────── */
var cardFilter='all';
function renderCards(){
  var keys=Object.keys(S.cards), f=cardFilter;
  var list=keys.filter(function(k){var c=S.cards[k];return f==='all'||(f==='mine'&&c.stage>=3)||(f==='due'&&c.stage<3&&c.due<=now())||(f==='wait'&&c.stage<3&&c.due>now())});
  var h='<div class="card"><h4>카드 · '+keys.length+'장</h4><div>'+[['all','전체'],['due','기한 옴'],['wait','기다리는 중'],['mine','내 것']].map(function(x){return '<button class="chip'+(f===x[0]?' on':'')+'" data-cf="'+x[0]+'">'+x[1]+'</button>'}).join('')+'</div>';
  h+=list.length?'<div class="cards" style="margin-top:8px">'+list.map(function(k){var c=S.cards[k];return '<div class="gl"><div class="id"><span class="tag '+(c.stage>=3?'ok':c.due<=now()?'due':'mikl')+'">'+(c.stage>=3?'내 것':c.due<=now()?'기한':'대기')+'</span></div>'+esc(c.ko)+'<div class="life">'+esc(secKo(c.from)||c.from)+'에서 · '+(c.stage>=3?'재학습 3회 완료':'재학습 '+(c.stage+1)+'번째 · '+fmtDays(c.due))+'</div></div>'}).join('')+'</div>':'<p style="color:var(--faint);margin-top:8px">아직 없음 — 절을 마치면 생깁니다.</p>';
  h+='</div><div class="row" style="margin-top:28px;justify-content:center"><button type="button" class="lnk-quiet" id="resetAll">학습 기록 지우기…</button></div>';
  $('#p-cards').innerHTML=h;
  $$('#p-cards [data-cf]').forEach(function(b){b.onclick=function(){cardFilter=b.dataset.cf;render()}});
  $('#resetAll').onclick=function(){if(confirm('학습 기록을 모두 지울까요? 로그인했다면 계정에 저장된 기록도 지워집니다.')){localStorage.removeItem(KEY);S=load();bookState={view:'toc',sec:null,step:0,mixI:0};render();learnSchedulePush(0);toast('지웠습니다')}};   /* 3.080 — 계정 기록도 빈 기록으로 덮는다(합치지 않고) */
}
/* ───────── 공통 ───────── */
function render(){
  // A cancelled prewarm or failed content request must leave a recoverable page.
  if(!BOOK||!Array.isArray(BOOK.chapters)||!BOOK.chapters.length){
    $('#posLine').textContent='학습 자료를 불러오지 못했어요';
    var panel=$('#p-'+page);
    if(panel){
      panel.innerHTML='<div class="card" role="status"><p>학습 자료를 다시 불러와 주세요. 저장된 학습 기록은 유지됩니다.</p><button class="btn pri" id="retryLearning">다시 불러오기</button></div>';
      $('#retryLearning').onclick=function(){location.reload()};
    }
    return;
  }
  $('#trackBtn').textContent=S.track==='coach'?'코치':'선수';
  var s=nextSec(),c=chapOf(s.id),d=c.sections.filter(function(x){return isDone(x.id)}).length;
  $('#posLine').textContent='『'+BOOK.ko+'』 '+c.id+' · '+d+'/'+c.sections.length;
  $('#mtitle').textContent=page==='book'&&bookState.view==='sec'?secKo(bookState.sec):(page==='lesson'&&lessonState.l?lessonState.l.ko:'');
  try{ var _rl=$('#roleLine'); if(_rl){ var _ro=ROLES.filter(function(r){return r.id===S.role})[0]; _rl.hidden=!(page==='toc'&&_ro); if(_ro)_rl.innerHTML=esc(_ro.ko)+'의 교과서 <span>· '+(roleOpen?'닫기':'바꾸기')+'</span>'; _rl.onclick=function(){ roleOpen=!roleOpen; render(); }; } }catch(_){}   /* 2.660 */
  if(page==='toc')renderShelf();
  else if(page==='now')renderNow();else if(page==='book')renderBook();
  else if(page==='lesson')renderLesson();else renderCards();
}
/* 2.323 — 셸에서 오는 두 가지: 학습을 그냥 열면 **목차부터**, 목차에서 이 앱의 갈래를 고르면 그 갈래로.
   ⚠ 순서가 곧 규칙이다 — 셸은 `learnHome` 을 먼저, `openLearnArea` 를 나중에 보낸다(나중 것이 이긴다). */
window.addEventListener('message',function(e){
  var d=e.data||{};
  if(d.type==='learnHome'){ if(page!=='toc')go('toc'); else render(); learnPull(); }   /* 3.080 — 학습 탭을 열 때마다 계정 기록과 맞춘다 */
  /* ⚠ 2.411 — 예전엔 `mikl` 하나만 받았다. 학습이 두 권이 됐으니 **받은 갈래의 책**을 연다. */
  else if(d.type==='openLearnArea'&&(BOOKS[d.area]||d.area==='gmhow')){ BOOK=BOOKS[d.area]||BOOKS.studio; bookState.view='toc'; go('book'); }   /* 3.079 — gmhow(게임모델 «학습에서 보기») 는 새 책 1장으로 */
});
render();
setTimeout(function(){ learnPull(); gmRemoteFetch(); },300);   /* 3.080 — 계정의 학습 기록을 받아 합친다 · 새 기기면 개인 게임모델도 읽어 둔다 */
/* 3.079 — 고른 역할의 교재는 첫 화면이 뜬 뒤에 미리 받아 둔다(절을 누를 때 기다리지 않게) */
if(S.role)setTimeout(function(){ ensureRoleBook(S.role); },600);
</script>
</body>
</html>
