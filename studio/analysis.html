<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>팀 · 선수 등록</title>
<link rel="stylesheet" href="/vendor/fonts.css?v=2.552b"><link rel="stylesheet" href="/vendor/tokens.css?v=2.552b"><script src="storage.js"></script><script src="team-library.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f5f7;color:#182235;font:14px system-ui,sans-serif}button,input{font:inherit}button{cursor:pointer;border:1px solid #dde2e9;background:white;color:inherit;border-radius:9px;padding:9px 13px}button.primary{background:#3a6df0;border-color:#3a6df0;color:white}button:focus-visible,input:focus-visible{outline:2px solid #3a6df0;outline-offset:2px}nav{display:flex;gap:6px;padding:14px 20px;border-bottom:1px solid #e1e5ec;background:white}nav button[aria-current]{background:#eef2ff;color:#315dca;border-color:#cbd6fc}main{max-width:1100px;margin:auto;padding:24px}header{display:flex;align-items:center;gap:12px;margin-bottom:22px}h1{font-size:22px;margin:0 0 6px}p{line-height:1.6;color:#667085;margin:0}header>div{flex:1}.layout{display:grid;grid-template-columns:280px minmax(0,1fr);gap:18px}.panel{background:white;border:1px solid #e1e5ec;border-radius:14px;padding:18px}.teams{display:grid;gap:8px;align-content:start}.team{text-align:left;padding:14px;width:100%}.team.on{border-color:#3a6df0;background:#f1f5ff}.team strong,.team small{display:block;overflow-wrap:anywhere}.team small{margin-top:5px;color:#667085}.empty{padding:30px 12px;text-align:center;color:#667085}.field{display:grid;gap:7px;font-weight:600;margin-bottom:18px}input{width:100%;min-width:0;border:1px solid #d8dee8;border-radius:8px;padding:10px;background:white;color:inherit}.row,.labels{display:grid;grid-template-columns:60px minmax(80px,1fr) 76px 36px;gap:7px;align-items:center;margin-bottom:8px}.labels{font-size:12px;color:#667085}.row button{padding:8px}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}.status{min-height:24px;padding-top:8px;color:#b42318}.help{font-size:13px;margin-top:18px}.heading{font-size:17px;margin:0 0 20px}[hidden]{display:none!important}@media(max-width:650px){main{padding:14px}nav{padding:10px;overflow:auto;white-space:nowrap}.layout{grid-template-columns:1fr}.teams{grid-template-columns:repeat(2,minmax(0,1fr))}.panel{padding:14px}.row,.labels{grid-template-columns:46px minmax(70px,1fr) 60px 32px;gap:5px}.row input{padding:9px 6px}header{align-items:flex-start}h1{font-size:20px}}

.vault-head{height:52px;display:flex;align-items:center;gap:9px;padding:0 20px;background:var(--panel,#fff);border-bottom:1px solid var(--line,#e1e5ec);position:sticky;top:0;z-index:20}.vault-title{font-size:var(--fs-h2,20px);font-weight:800;white-space:nowrap}.vault-sub{font-size:var(--fs-sub,12px);color:#88909d;white-space:nowrap}.vault-head nav{margin-left:10px;display:inline-flex;max-width:430px;padding:2px;gap:2px;border:1px solid var(--line,#e1e5ec);border-radius:11px;background:var(--panel2,#f1f2f4);overflow-x:auto;scrollbar-width:none}.vault-head nav button{height:32px;padding:0 12px;border:0;border-radius:6px;background:transparent;color:#646a73;font-size:12px;font-weight:600;white-space:nowrap}.vault-head nav button[aria-current]{background:var(--panel,#fff);color:var(--txt,#14161a);box-shadow:0 1px 2px #1018281a}.roster-import{margin:18px 0;padding:14px;border:1px solid #dde2e9;border-radius:10px}.roster-import summary{cursor:pointer;font-weight:600}.roster-import p{margin:10px 0;font-size:12px}.roster-import textarea{width:100%;font:inherit;padding:10px;border:1px solid #d8dee8;border-radius:8px;resize:vertical}.import-preview{white-space:pre-wrap;max-height:180px;overflow:auto;font-size:12px;line-height:1.6;margin:10px 0}.import-actions{display:flex;gap:8px;flex-wrap:wrap}@media(max-width:650px){.vault-head{height:auto;min-height:52px;padding:9px 11px;flex-wrap:wrap;gap:7px}.vault-sub{display:none}.vault-head nav{margin-left:0;max-width:100%}.vault-head nav button{padding:0 10px}}
</style></head><body>
<div class="vault-head"><strong class="vault-title">보관함</strong><span class="vault-sub">저장한 작전판·훈련</span><nav aria-label="보관함 보기" role="tablist"><button role="tab" aria-selected="false" data-section="files">자료</button><button role="tab" aria-selected="true" aria-current="page">팀 등록</button><button role="tab" aria-selected="false" data-section="gamemodel">게임모델</button><button role="tab" aria-selected="false" data-section="notes">개인 노트</button></nav></div>
<main><header><div><h1>팀 · 선수 등록</h1><p>팀의 선수 명단·등번호·유니폼을 저장해 작전판에서 반복해서 불러오세요.</p></div><button class="primary" id="addTeam">＋ 팀 등록</button></header>
<div class="layout"><aside class="panel teams" id="teamList" aria-label="저장한 팀"></aside><section class="panel" id="editorPanel"><div id="emptyEditor" class="empty">팀을 선택하거나 새 팀을 등록하세요.</div><form id="teamForm" hidden><h2 class="heading" id="editorTitle">팀 등록</h2><label class="field">팀 이름<input id="teamName" maxlength="80" required placeholder="예: 아스널"></label><fieldset style="border:1px solid #dde2e9;border-radius:10px;margin:0 0 18px;padding:14px"><legend>엠블럼 · 유니폼</legend><div style="display:flex;gap:12px;align-items:center;margin-bottom:14px"><img id="emblemPreview" alt="팀 엠블럼" width="64" height="64" style="object-fit:contain" hidden><label>엠블럼 이미지<input id="emblemFile" type="file" accept="image/png,image/jpeg,image/webp"></label><button type="button" id="emblemRemove">제거</button></div><p style="font-size:12px;margin-bottom:12px">PNG·JPG·WebP, 최대 5MB</p><div id="kitFields" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px"></div></fieldset><details class="roster-import" id="rosterImport"><summary>명단 한 번에 붙여넣기</summary><p>엑셀의 등번호 · 이름 · 포지션 3개 열을 복사하세요. 쉼표로 구분해도 됩니다. 기존 선수 뒤에 추가되며, 마지막에 저장을 눌러 적용합니다.</p><textarea id="rosterText" rows="5" aria-label="붙여넣을 선수 명단" placeholder="7, 손흥민, LW&#10;10, Harry Kane, ST"></textarea><div id="rosterPreview" class="import-preview" role="status"></div><div class="import-actions"><button type="button" id="previewRoster">명단 확인</button><button type="button" id="appendRoster" disabled>확인한 선수 추가</button></div></details><div class="labels"><span>등번호</span><span>선수 이름</span><span>포지션</span><span></span></div><div id="playerRows"></div><button type="button" id="addPlayer">＋ 선수 추가</button><div id="status" class="status" role="status"></div><div class="actions"><button type="button" id="cancelEdit">취소</button><button type="submit" class="primary">저장</button></div></form><p class="help">보드 → 보드 설정 → 선수 → 저장 팀 불러오기에서 저장한 팀을 선택할 수 있습니다.</p></section></div></main>
<script>
(function(){
'use strict';
var KEY='cs_analysis_team_library_v1',draft=null,dirty=false,base='',saving=null,ready=false,editOwner=null;
var library=PSTeamLibrary.create(window);
function readTeams(){return PSTeamLibrary.parse(localStorage.getItem(KEY));}
function copyTeam(team){return JSON.parse(JSON.stringify(team));}
function saveTeam(team){return library.save(team,base,editOwner);}
function id(){return 'tm_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,9);}
var list=document.getElementById('teamList'),form=document.getElementById('teamForm'),name=document.getElementById('teamName'),rows=document.getElementById('playerRows'),status=document.getElementById('status');
function leave(){if(saving){status.textContent='저장 확인 중입니다. 완료 후 이동해 주세요.';return false;}if(!dirty)return true;if(!confirm('저장하지 않은 변경을 취소할까요?'))return false;draft=null;dirty=false;form.hidden=true;document.getElementById('emptyEditor').hidden=false;render();return true;}
function render(){list.textContent='';var teams;try{teams=readTeams();}catch(e){list.textContent='저장 명단을 읽지 못했습니다. 새로고침 후 다시 확인해 주세요.';return;}if(!teams.length){var empty=document.createElement('p');empty.className='empty';empty.textContent='등록한 팀이 없습니다.';list.appendChild(empty);}teams.forEach(function(t){var b=document.createElement('button');b.className='team'+(draft&&draft.id===t.id?' on':'');var title=document.createElement('strong');title.textContent=t.name||'이름 없는 팀';var count=document.createElement('small');count.textContent='선수 '+(t.players||[]).length+'명';if(validEmblem(t.emblem)){var logo=document.createElement('img');logo.src=t.emblem;logo.alt='';logo.width=36;logo.height=36;logo.style.cssText='object-fit:contain;float:left;margin-right:10px';b.appendChild(logo);}b.append(title,count);b.onclick=function(){if(leave())edit(t);};list.appendChild(b);});}
function edit(team){if(!ready)return;editOwner=library.owner();if(editOwner===null){status.textContent='계정·팀 전환이 끝난 뒤 다시 열어 주세요.';return;}draft=copyTeam(team||{id:id(),name:'',players:[],formations:{}});base=JSON.stringify(team||null);dirty=false;form.hidden=false;document.getElementById('emptyEditor').hidden=true;document.getElementById('editorTitle').textContent=team?'팀 · 선수 수정':'팀 등록';name.value=draft.name||'';status.textContent='';resetImport();renderKit();renderRows();render();name.focus();}
function validEmblem(v){return typeof v==='string'&&v.length<250000&&/^data:image\/(png|jpeg|webp);base64,[A-Za-z0-9+/=]+$/.test(v);}
var kitColors={main:['필드 주색','#1a2f5c'],accent:['필드 보조색','#ffffff'],stroke:['필드 테두리','#ffffff'],text:['필드 글자','#ffffff'],gkMain:['GK 주색','#e8b730'],gkAccent:['GK 보조색','#ffffff'],gkStroke:['GK 테두리','#ffffff'],gkText:['GK 글자','#ffffff']};
function renderKit(){var box=document.getElementById('kitFields');box.textContent='';draft.kit=draft.kit||{};Object.keys(kitColors).forEach(function(key){var label=document.createElement('label');label.textContent=kitColors[key][0];var input=document.createElement('input');input.type='color';input.setAttribute('aria-label',kitColors[key][0]);input.value=/^#[0-9a-f]{6}$/i.test(draft.kit[key]||'')?draft.kit[key]:kitColors[key][1];input.style.height='38px';input.oninput=function(){draft.kit[key]=input.value;dirty=true;};label.appendChild(input);box.appendChild(label);});['pattern','gkPattern'].forEach(function(key){var label=document.createElement('label');label.textContent=key==='pattern'?'필드 무늬':'GK 무늬';var input=document.createElement('select');input.setAttribute('aria-label',label.textContent);input.style.cssText='display:block;width:100%;padding:9px;border:1px solid #d8dee8;border-radius:8px';[['solid','단색'],['v','세로 줄무늬'],['thinv','가는 세로 줄무늬'],['h','가로 줄무늬'],['half','반반'],['quarters','체크'],['band','세로 띠'],['hoop','가로 띠'],['sash','사선 띠'],['diag','사선 줄무늬']].forEach(function(x){var o=document.createElement('option');o.value=x[0];o.textContent=x[1];input.appendChild(o);});input.value=draft.kit[key]||'solid';input.onchange=function(){draft.kit[key]=input.value;dirty=true;};label.appendChild(input);box.appendChild(label);});var img=document.getElementById('emblemPreview');img.hidden=!validEmblem(draft.emblem);if(!img.hidden)img.src=draft.emblem;else img.removeAttribute('src');}
var uploadId=0;document.getElementById('emblemFile').onchange=function(){var file=this.files[0],target=draft,request=++uploadId;if(!file)return;if(!['image/png','image/jpeg','image/webp'].includes(file.type)||file.size>5*1024*1024){status.textContent='5MB 이하의 PNG·JPG·WebP 이미지를 선택하세요.';this.value='';return;}var url=URL.createObjectURL(file),img=new Image();img.onload=function(){try{if(draft!==target||request!==uploadId)return;var scale=Math.min(1,160/Math.max(img.width,img.height)),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);draft.emblem=canvas.toDataURL('image/png');dirty=true;renderKit();status.textContent='엠블럼을 선택했습니다. 저장을 눌러 적용하세요.';}finally{URL.revokeObjectURL(url);}};img.onerror=function(){URL.revokeObjectURL(url);if(draft===target)status.textContent='이미지를 읽지 못했습니다.';};img.src=url;this.value='';};document.getElementById('emblemRemove').onclick=function(){uploadId++;draft.emblem='';dirty=true;renderKit();};
function renderRows(){rows.textContent='';(draft.players||[]).forEach(function(p,i){var row=document.createElement('div');row.className='row';['no','name','pos'].forEach(function(key){var input=document.createElement('input');input.value=p[key]||'';input.maxLength=key==='name'?60:8;input.setAttribute('aria-label',({no:'등번호',name:'선수 이름',pos:'포지션'})[key]+' '+(i+1));if(key==='name')input.required=true;if(key==='no')input.inputMode='numeric';input.oninput=function(){p[key]=input.value;dirty=true;};row.appendChild(input);});var del=document.createElement('button');del.type='button';del.textContent='−';del.setAttribute('aria-label','선수 '+(i+1)+' 제거');del.onclick=function(){draft.players.splice(i,1);dirty=true;renderRows();};row.appendChild(del);rows.appendChild(row);});}

function parseRoster(text){
 var players=[],errors=[];
 String(text||'').split(/\r?\n/).forEach(function(line,index){
  if(!line.trim())return;
  var cells=line.split(line.indexOf('\t')>=0?'\t':',').map(function(v){return v.trim();});
  if(cells.length===3&&/^(등번호|번호|no\.?|number)$/i.test(cells[0])&&/^(이름|선수 이름|name)$/i.test(cells[1]))return;
  if(cells.length!==3||!/^\d{0,3}$/.test(cells[0])||!cells[1]||cells[1].length>60||cells[2].length>8){errors.push((index+1)+'행: 등번호, 이름, 포지션 순서로 확인하세요.');return;}
  players.push({no:cells[0],name:cells[1],pos:cells[2].toUpperCase()});
 });
 if(players.length>100)errors.push('한 번에 100명까지 추가할 수 있습니다.');
 return {players:players,errors:errors};
}
var pendingRoster=null,rosterText=document.getElementById('rosterText'),rosterPreview=document.getElementById('rosterPreview'),appendRoster=document.getElementById('appendRoster');
function resetImport(){pendingRoster=null;rosterText.value='';rosterPreview.textContent='';appendRoster.disabled=true;document.getElementById('rosterImport').open=false;}
rosterText.oninput=function(){pendingRoster=null;appendRoster.disabled=true;rosterPreview.textContent='내용을 변경했습니다. 명단 확인을 눌러 주세요.';};
document.getElementById('previewRoster').onclick=function(){var result=parseRoster(rosterText.value);pendingRoster=null;appendRoster.disabled=true;if(result.errors.length){rosterPreview.textContent=result.errors.join('\n');return;}if(!result.players.length){rosterPreview.textContent='추가할 선수 명단을 입력하세요.';return;}pendingRoster=result.players;rosterPreview.textContent=result.players.length+'명 추가 예정\n'+result.players.map(function(p){return (p.no?'#'+p.no+' · ':'')+p.name+(p.pos?' · '+p.pos:'');}).join('\n');appendRoster.disabled=false;};
appendRoster.onclick=function(){if(!draft||!pendingRoster)return;var count=pendingRoster.length;draft.players=draft.players||[];pendingRoster.forEach(function(p){draft.players.push({id:id(),no:p.no,name:p.name,pos:p.pos});});dirty=true;renderRows();resetImport();status.textContent=count+'명을 추가했습니다. 저장을 눌러 적용하세요.';};
name.oninput=function(){dirty=true;};document.getElementById('addTeam').onclick=function(){if(leave())edit();};document.getElementById('addPlayer').onclick=function(){draft.players=draft.players||[];draft.players.push({id:id(),no:'',name:'',pos:''});dirty=true;renderRows();rows.lastElementChild.querySelectorAll('input')[1].focus();};
document.getElementById('cancelEdit').onclick=function(){if(!leave())return;draft=null;dirty=false;form.hidden=true;document.getElementById('emptyEditor').hidden=false;render();};
form.onsubmit=async function(e){e.preventDefault();if(!draft||saving||!ready)return;draft.name=name.value.trim();if(!draft.name){status.textContent='팀 이름을 입력하세요.';return;}if(draft.players.some(function(p){return !String(p.name||'').trim();})){status.textContent='선수 이름을 입력하거나 빈 행을 제거해 주세요.';return;}try{Object.keys(kitColors).forEach(function(k){if(!/^#[0-9a-f]{6}$/i.test(draft.kit[k]||''))draft.kit[k]=kitColors[k][1];});draft.kit.pattern=draft.kit.pattern||'solid';draft.kit.gkPattern=draft.kit.gkPattern||'solid';draft.updatedAt=Date.now();form.inert=true;status.textContent='기기에 저장하고 확인하는 중…';saving=saveTeam(draft);await saving;base=JSON.stringify(draft);dirty=false;render();status.textContent='기기에 저장했습니다. 다른 기기에서도 쓰려면 개인 공간의 동기화 상태를 확인하세요.';}catch(err){dirty=true;status.textContent=(err&&err.message?err.message+' ':'')+'입력 내용은 유지됩니다. 저장을 다시 시도해 주세요.';}finally{saving=null;form.inert=false;}};
document.querySelectorAll('[data-section]').forEach(function(b){b.onclick=function(){if(leave())parent.postMessage({source:'analysis',type:'vaultSection',section:b.dataset.section},location.origin);};});window.addEventListener('storage',function(e){if(e.key===KEY)render();});window.addEventListener('beforeunload',function(e){if(dirty){e.preventDefault();e.returnValue='';}});
window.psHasPending=function(){return dirty||!!saving;};
window.psFlushPendingReady=async function(){if(saving)await saving;if(dirty)throw Error('팀 등록의 저장하지 않은 변경이 있습니다.');if(window.PSStorage)await PSStorage.sharedReady(KEY);return true;};
(async function(){var main=document.querySelector('main'),seal=library.owner();main.inert=true;try{await library.read(seal);ready=true;render();main.inert=false;}catch(e){document.getElementById('emptyEditor').textContent='저장 명단을 불러오지 못했습니다. 기존 자료는 유지됩니다. 계정·팀 상태를 확인한 뒤 다시 열어 주세요.';}})();
})();
</script></body></html>
