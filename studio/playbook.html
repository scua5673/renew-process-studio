<!DOCTYPE html>

<head>

<title>플레이북 · PROCESS STUDIO</title>

<style>
/* ══ 2.576 · 플레이북 — 팀 운영 줄에서 «훈련 분석» 자리에(사용자 "훈련 분석은 일단 지워주고 플레이북을 그 자리에 만들고 싶어") ══
   무엇인가: 게임모델(국면 › 세부 국면 › 원칙 · 장면)을 **읽는 화면**. 여기에 «이번 주 이 국면에 몇 분 썼나»(일정)와
   «이 국면에 붙은 드릴»(보관함)을 나란히 붙인다 — 설계도(게임모델)가 훈련량(일정)과 자료(보관함)로 검증되는 자리.
   원본은 redesign-mock/process-timeline.html 의 «플레이북». 이 판은 **읽기 전용** — 쓰는 곳은 그대로(게임모델·일정·보관함)이고
   여기서는 그리로 가는 문만 연다. 새 저장 키 없음.
   데이터: cs_gamemodel_v1(팀) · process_coach_v1(PSSchedule.readFor(조)) · cs_drill_lib_v1(IDB, window.storage.get) · cs_terms_v1(공용어).
   ══ 2.577 · 여기서 바로 고친다(사용자 "공용어 신호도 연결해주고 바로 편집이 가능하게 · 다른곳으로 이동안해도 여기서 바로 편집") ══
   쓰는 것: 원칙(추가·고침·삭제) · 세부 국면 이름 · 팀 정체성 → cs_gamemodel_v1(게임모델 save() 와 같은 길: psSaveShared 있으면 그것, 없으면 localStorage).
           신호어(새로 만들기 · 기존 용어 연결 · 떼기) → cs_terms_v1. 연결은 용어 쪽 `it.ph=[세부 국면 id…]` 한 칸 — 새 키 없음.
   권한: PSPerms.canEdit('gamemodel') / ('terms'). 없으면 보기만.
   ⚠ 게임모델·공용어 iframe 은 늘 떠 있어 낡은 사본으로 덮어쓸 수 있다 — 2.577 에서 둘 다 storage 이벤트로 다시 읽는다.
   ══ 2.580 · 드릴도 여기서 바로(사용자 "여기서 바로 추가할 수 있게 해줘") ══
   «보관함에서 붙이기»(있는 드릴에 이 세부 국면을 묶는다) · «떼기» · «＋ 새 드릴 그리기»(작전판 편집기를 국면 프리셀렉트로 열고, 저장·취소 뒤 플레이북으로 돌아온다).
   쓰는 곳: cs_drill_lib_v1(IDB, 작전판 store.set 과 같은 모양 = JSON 문자열) 의 항목 gmPhases / gmPhaseNames(«국면 › 세부») — 새 키 없음.
   저장 뒤 cs_lib_rev 를 찍어 작전판이 보관함 목록을 다시 읽게 한다(작전판 2.580 storage 훅).
   권한: PSPerms.canEdit('board') + 부모 셸의 PSSync.dataUnlocked() (작전판 보관함 잠금과 같은 조건). */
:root{--bg:#F1F2F4;--panel:#fff;--panel2:#F6F7F9;--line:#E3E6EA;--line2:#D3D7DD;--ink:#14161A;--ink2:#646A73;--ink3:#8A9099;
  --teamc:var(--team-c,#15305a);--teams:color-mix(in srgb,var(--team-c,#15305a) 10%,#fff);
  --c-ao:#1F8A4C;--c-do:#D4403A;--c-dt:#C77D00;--c-at:#C77D00;--c-set:#7C5CC4;--c-ic:#3A6DF0;
  --font:'Pretendard Variable','Pretendard',-apple-system,BlinkMacSystemFont,system-ui,sans-serif}
body.fmdark{--bg:#121417;--panel:#161C25;--panel2:#1B2230;--line:#26313D;--line2:#33404E;--ink:#F2F3F5;--ink2:#A7B1BE;--ink3:#7C8696;--teams:rgba(90,130,220,.16)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:var(--t-5,14px);line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible{outline:2px solid var(--c-act,#3A6DF0);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding:14px 18px 40px}
/* 머리 */
.hd{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.hd h1{margin:0;font-size:var(--t-6,16px);font-weight:800;letter-spacing:-.01em}
.hd .idn{color:var(--ink2);font-size:var(--t-4,13px);min-width:0;flex:1 1 240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hd .idn.empty{color:var(--ink3)}
.hd .acts{display:flex;gap:6px;margin-left:auto}
.lnk{font-size:var(--t-3,12px);font-weight:600;color:var(--teamc);padding:5px 10px;border:1px solid var(--line);border-radius:var(--r-pill,999px);background:var(--panel);white-space:nowrap}
.lnk:hover{border-color:var(--line2)}
/* 두 기둥 */
.cols{display:grid;grid-template-columns:minmax(300px,.9fr) minmax(0,1.1fr);gap:12px;align-items:start}
.pn{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-2,10px);box-shadow:var(--sh-1);min-width:0}
.pn .ph{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);font-size:var(--t-4,13px);font-weight:800}
.pn .ph small{font-weight:500;color:var(--ink3)}
.pn .bd{padding:12px 14px}
/* 국면 목록 */
.mo{margin-bottom:8px}
.mo-h{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;background:var(--panel2);font-weight:600;font-size:var(--t-4,13px)}
.mo-h .sw{width:9px;height:9px;border-radius:3px;flex:0 0 auto}
.mo-h .m{margin-left:auto;font-size:var(--t-3,12px);color:var(--ink2);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.mo-main{font-size:var(--t-3,12px);color:var(--ink2);padding:6px 10px 2px;line-height:1.5}
.pr{display:grid;grid-template-columns:minmax(0,1fr) 84px 40px;gap:8px;align-items:center;width:100%;padding:8px 10px;border-radius:8px;text-align:left}
.pr:hover{background:var(--panel2)}
.pr[aria-pressed="true"]{background:var(--teams)}
.pr .t{font-weight:600;font-size:var(--t-4,13px);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pr .t small{display:block;font-size:var(--t-2,11px);color:var(--ink3);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pr .bar{height:7px;border-radius:99px;background:var(--panel2);overflow:hidden;border:1px solid var(--line)}
.pr .bar u{display:block;height:100%;border-radius:99px}
.pr .v{font-size:var(--t-3,12px);font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.pr .v.z{color:var(--ink3);font-weight:600}
.empty{padding:22px 12px;text-align:center;color:var(--ink3);font-size:var(--t-4,13px);line-height:1.6}
.empty b{display:block;color:var(--ink2);margin-bottom:4px}
/* 상세 */
.dt .eyebrow{font-size:var(--t-1,10px);letter-spacing:.08em;text-transform:uppercase;font-weight:800}
.dt h2{margin:2px 0 10px;font-size:var(--t-7,20px);font-weight:800;letter-spacing:-.02em;line-height:1.25}
.sec{margin-top:16px}
.sec-h{display:flex;align-items:baseline;gap:8px;font-size:var(--t-2,11px);letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);font-weight:800;margin-bottom:8px}
.sec-h small{letter-spacing:0;text-transform:none;font-weight:600;font-variant-numeric:tabular-nums}
.sec-h .r{margin-left:auto;font-size:var(--t-3,12px);letter-spacing:0;text-transform:none;font-weight:600;color:var(--teamc)}
.prin{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.prin li{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:8px;align-items:start;padding:9px 10px;border:1px solid var(--line);border-radius:8px;font-size:var(--t-5,14px);line-height:1.55}
.prin li i{font-style:normal;font-size:var(--t-2,11px);font-weight:800;color:var(--ink3);padding-top:3px;font-variant-numeric:tabular-nums}
.prin li .d{font-size:var(--t-3,12px);color:var(--ink2);margin-top:3px}
.snap{border-radius:8px;overflow:hidden;background:#1b8044;border:1px solid var(--line);max-width:520px}
.snap svg{display:block;width:100%;height:auto}
.dr{display:flex;flex-direction:column;gap:6px}
.dr button{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:9px 10px;border:1px solid var(--line);border-radius:6px;text-align:left;background:var(--panel)}
.dr button:hover{border-color:var(--line2);background:var(--panel2)}
.dr .n{font-weight:600;font-size:var(--t-4,13px);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dr .m{font-size:var(--t-3,12px);color:var(--ink2);font-variant-numeric:tabular-nums;white-space:nowrap}
.dr .go{font-size:var(--t-3,12px);color:var(--ink3)}
.uses{display:flex;flex-direction:column;gap:5px;font-size:var(--t-4,13px)}
.uses div{display:grid;grid-template-columns:56px minmax(0,1fr) 44px;gap:8px;align-items:baseline}
.uses .d{font-size:var(--t-3,12px);color:var(--ink3);font-variant-numeric:tabular-nums}
.uses .n{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.uses .m{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;font-size:var(--t-3,12px)}
.note{font-size:var(--t-3,12px);color:var(--ink3);line-height:1.5}
.back{display:none;font-size:var(--t-4,13px);font-weight:600;color:var(--teamc);padding:6px 0;margin-bottom:6px}
/* 편집 */
.ed{cursor:text}
.ed:hover{background:var(--panel2)}
.prin li.ed-on{border-color:var(--c-act,#3A6DF0);box-shadow:0 0 0 2px rgba(58,109,240,.12)}
.prin li textarea{width:100%;min-height:44px;border:0;background:transparent;font:inherit;color:inherit;line-height:1.55;resize:vertical;padding:0;outline:none}
.prin li .x{font-size:var(--t-2,11px);color:var(--ink3);padding:2px 4px;margin-top:3px;white-space:nowrap}
.prin li .x:hover{color:var(--c-do)}
.add{display:inline-flex;align-items:center;gap:4px;font-size:var(--t-3,12px);font-weight:600;color:var(--ink2);padding:7px 10px;border:1px dashed var(--line2);border-radius:6px;background:transparent;margin-top:8px}
.add:hover{color:var(--ink);border-color:var(--ink3)}
.dt h2.ed[contenteditable]{outline:none;border-radius:6px;padding:0 4px;margin-left:-4px}
.dt h2.ed:focus{background:var(--panel2);box-shadow:0 0 0 2px rgba(58,109,240,.18)}
.hd .idn.ed{cursor:text;border-radius:6px;padding:0 4px;margin-left:-4px}
.hd .idn.ed:focus{background:var(--panel);box-shadow:0 0 0 2px rgba(58,109,240,.18);outline:none;white-space:normal}
.sig{display:flex;flex-wrap:wrap;gap:6px}
.sig .tm{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border:1px solid var(--line);border-radius:999px;background:var(--panel);font-size:var(--t-4,13px)}
.sig .tm b{font-weight:800;color:var(--teamc)}
.sig .tm i{font-style:normal;color:var(--ink2)}
.sig .tm .x{font-size:var(--t-2,11px);color:var(--ink3);padding:0 2px;margin-left:2px}
.sig .tm .x:hover{color:var(--c-do)}
.sigform{display:grid;grid-template-columns:110px minmax(0,1fr) auto;gap:6px;margin-top:8px;align-items:center}
.sigform input{border:1px solid var(--line);border-radius:6px;padding:8px 10px;font:inherit;background:var(--panel);color:var(--ink);min-width:0;width:100%}
.sigform input:focus{outline:none;border-color:var(--c-act,#3A6DF0);box-shadow:0 0 0 2px rgba(58,109,240,.15)}
.sigform .ok{font-size:var(--t-3,12px);font-weight:800;color:#fff;background:var(--c-act,#3A6DF0);border-radius:8px;padding:8px 12px;white-space:nowrap}
.pick{margin-top:6px;border:1px solid var(--line);border-radius:8px;background:var(--panel);max-height:200px;overflow:auto}
.pick button{display:grid;grid-template-columns:110px minmax(0,1fr);gap:8px;width:100%;text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);font-size:var(--t-3,12px)}
.pick button:last-child{border-bottom:0}
.pick button:hover{background:var(--panel2)}
.pick button b{font-weight:800;color:var(--teamc);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pick button span{color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pick .none{padding:8px 10px;font-size:var(--t-3,12px);color:var(--ink3)}
/* 2.580 · 드릴 줄 = 열기 + 떼기 · 보관함 고르기 */
.dri{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;align-items:center}
.dri .x{font-size:var(--t-2,11px);color:var(--ink3);padding:6px 6px;white-space:nowrap}
.dri .x:hover{color:var(--c-do)}
.dr-acts{display:flex;gap:6px;flex-wrap:wrap}
.pick.lp button{grid-template-columns:minmax(0,1fr) auto}
.pick.lp button b{color:var(--ink)}
.pick.lp button span{text-align:right}
.ro-note{font-size:var(--t-2,11px);color:var(--ink3);margin-left:6px;font-weight:500;text-transform:none;letter-spacing:0}
@media (max-width:700px){ .sigform{grid-template-columns:1fr 1fr} .sigform .ok{grid-column:1/-1} }
/* 폰: 목록 → 상세 두 장 */
@media (max-width:700px){
  .wrap{padding:10px 10px 32px}
  .cols{grid-template-columns:1fr}
  body.detail .pn.list{display:none}
  body:not(.detail) .pn.dt{display:none}
  .back{display:inline-flex;align-items:center;gap:4px}
  .hd .acts{width:100%;margin-left:0}
  .pr{grid-template-columns:minmax(0,1fr) 70px 40px}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="hd"><h1>플레이북</h1><span class="idn" id="idn"></span>
    <span class="acts"><button class="lnk" data-go="settings">게임모델 편집 →</button><button class="lnk" data-go="training">일정 →</button></span></div>
  <div class="cols">
    <div class="pn list"><div class="ph">국면 · 세부 국면<small id="wkLabel"></small></div><div class="bd" id="list"></div></div>
    <div class="pn dt"><div class="bd" id="detail"></div></div>
  </div>
</div>
<script>
(function(){
  "use strict";
  var $=function(id){return document.getElementById(id);};
  var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});};
  var pTxt=function(p){ return (typeof p==='string')?p:((p&&(p.t||p.text||p.title))||''); };
  var pDetail=function(p){ if(!p||typeof p!=='object')return ''; var ks=['why','how','trig','trigger','cue','when','detail','note']; for(var i=0;i<ks.length;i++){ var v=p[ks[i]]; if(v&&String(v).trim())return String(v).trim(); } return ''; };
  var COL={ao:'var(--c-ao)',do:'var(--c-do)',dt:'var(--c-dt)',at:'var(--c-at)',set:'var(--c-set)',ic:'var(--c-ic)'};
  var colOf=function(m){ var k=m.key||''; if(COL[k])return COL[k]; var n=m.name||''; return /공격/.test(n)?COL.ao:/수비/.test(n)?COL.do:/전환/.test(n)?COL.dt:/세트/.test(n)?COL.set:COL.ic; };
  var readJSON=function(k){ try{ return JSON.parse(localStorage.getItem(k)||'null'); }catch(_){ return null; } };
  var minsOf=function(bl){ return (bl||[]).reduce(function(a,x){ var m=parseInt(x&&(x.minutes||x.min||x.duration||x.dur),10); return a+(isNaN(m)?0:m); },0); };

  var model=null, week=null, lib=[], sel=null;   /* sel = phase id */
  var terms=null;   /* cs_terms_v1 {v,items:[{id,l,g,ko,en,d,ph?}]} */
  /* ── 권한 · 저장 ── */
  function canGm(){ try{ return !window.PSPerms||PSPerms.canEdit('gamemodel'); }catch(_){ return true; } }
  function canTm(){ try{ return !window.PSPerms||PSPerms.canEdit('terms'); }catch(_){ return true; } }
  function writeKey(k,obj){ try{ var raw=JSON.stringify(obj); if(window.psSaveShared)window.psSaveShared(k,raw); else localStorage.setItem(k,raw); }catch(e){ try{ localStorage.setItem(k,JSON.stringify(obj)); }catch(_){} } }
  function saveModel(){ if(!model)return; writeKey('cs_gamemodel_v1',model); }
  function saveTerms(){ if(!terms)return; writeKey('cs_terms_v1',terms); }
  function readTerms(){ var o=readJSON('cs_terms_v1'); return (o&&Array.isArray(o.items))?o:{v:1,items:[]}; }
  function tuid(){ return 't'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
  function termsOf(id){ return (terms&&terms.items||[]).filter(function(it){ return it&&Array.isArray(it.ph)&&it.ph.indexOf(id)>=0; }); }
  function groupOf(m){ var n=(m&&m.name)||'', k=(m&&m.key)||''; if(k==='ao'||/공격/.test(n))return '공격'; if(k==='do'||/수비/.test(n))return '수비'; if(k==='dt'||k==='at'||/전환/.test(n))return '전환'; return '상황'; }
  function toast(msg){ var t=document.getElementById('pbToast'); if(!t){ t=document.createElement('div'); t.id='pbToast'; t.style.cssText='position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:999px;font-size:12px;font-weight:600;z-index:50;opacity:0;transition:opacity .15s;pointer-events:none'; document.body.appendChild(t); } t.textContent=msg; t.style.opacity='1'; clearTimeout(t.__h); t.__h=setTimeout(function(){ t.style.opacity='0'; },1500); }

  /* ── 이번 주(월~일) 세션 → 국면·세부 국면별 분 · 배정 목록 ── */
  function readWeek(){
    var out={mo:{},ph:{},uses:{},total:0,label:''};
    try{
      var PS=window.PSSchedule; if(!PS||!PS.readFor)return out;
      var grp=''; try{ grp=localStorage.getItem('ps_sched_grp')||''; }catch(_){}
      var data=PS.readFor(grp)||PS.read()||{}, weeks=data.weeks||{};
      var today=new Date(); today.setHours(0,0,0,0);
      var mon=new Date(today); mon.setDate(mon.getDate()-((mon.getDay()+6)%7));
      var DOW=['일','월','화','수','목','금','토'];
      var f=function(d){ return (d.getMonth()+1)+'/'+d.getDate(); };
      var sun=new Date(mon); sun.setDate(sun.getDate()+6); out.label=f(mon)+' – '+f(sun);
      for(var o=0;o<7;o++){
        var d=new Date(mon); d.setDate(d.getDate()+o);
        var c=PS.cellOf(d)||{wk:0,di:0}, day=(weeks[c.wk]||[])[c.di]||{}, b=day.board||{};
        if(PS.hasMatch(day)||day.off||b.sched==='OFF')continue;
        var trs=(day.trainings&&day.trainings.length)?day.trainings:[];
        trs.forEach(function(tr){
          if(!tr)return; var mins=minsOf(tr.blocks); if(!mins)return;
          var keys=[]; (Array.isArray(tr.topics)?tr.topics:[]).forEach(function(v){ v=String(v); if(v.indexOf('m:')===0&&keys.indexOf(v.slice(2))<0)keys.push(v.slice(2)); });
          if(!keys.length&&tr.gmMoment)keys.push(tr.gmMoment);
          var phs=[]; (Array.isArray(tr.gmPhases)?tr.gmPhases:[]).forEach(function(id){ if(phs.indexOf(id)<0)phs.push(id); });
          (Array.isArray(b.trainData)?b.trainData:[]).forEach(function(td){ (td&&Array.isArray(td.gmPhases)?td.gmPhases:[]).forEach(function(id){ if(phs.indexOf(id)<0)phs.push(id); }); });
          out.total+=mins;

    if(t.id==='sigEn'||t.id==='sigKo'){ if(e.key==='Enter'){ e.preventDefault(); addTerm(); } return; }
    if(t.hasAttribute&&t.hasAttribute('data-phname')){ if(e.key==='Enter'){ e.preventDefault(); t.blur(); } if(e.key==='Escape'){ render(); } return; }
    if(t.id==='idn'){ if(e.key==='Enter'){ e.preventDefault(); t.blur(); } if(e.key==='Escape'){ render(); } return; } });
  document.addEventListener('focusout',function(e){ var t=e.target; if(!t)return; if(t.hasAttribute&&t.hasAttribute('data-phname'))renamePhase(t); else if(t.id==='idn')saveIdentity(t); });
  document.addEventListener('click',function(e){
    var li=e.target.closest('li.ed'); if(li&&!e.target.closest('.x')&&!e.target.closest('textarea')){ editPrinciple(li); return; }
    var pd=e.target.closest('[data-pdel]'); if(pd){ delPrinciple(+pd.getAttribute('data-pdel')); return; }
    if(e.target.closest('[data-padd]')){ addPrinciple(); return; }
    if(e.target.closest('[data-tadd]')){ addTerm(); return; }
    var td=e.target.closest('[data-tdel]'); if(td){ unlinkTerm(td.getAttribute('data-tdel')); return; }
    var tl=e.target.closest('[data-tlink]'); if(tl){ linkTerm(tl.getAttribute('data-tlink')); return; }
    if(e.target.closest('[data-tpick]')){ openPick(); return; }
    var ld=e.target.closest('[data-ldel]'); if(ld){ detachLib(ld.getAttribute('data-ldel')); return; }
    var ll=e.target.closest('[data-llink]'); if(ll){ attachLib(ll.getAttribute('data-llink')); return; }
    if(e.target.closest('[data-lpick]')){ openLibPick(); return; }
    if(e.target.closest('[data-lnew]')){ newDrill(); return; }
    var b=e.target.closest('[data-ph]'); if(b){ sel=b.getAttribute('data-ph'); document.body.classList.add('detail'); render(); return; }
    var bk=e.target.closest('[data-back]'); if(bk){ document.body.classList.remove('detail'); return; }
    var g=e.target.closest('[data-go]'); if(g){ var k=g.getAttribute('data-go'); if(k==='design'){ try{ parent.postMessage({source:'playbook',type:'openApp',app:'design'},'*'); }catch(_){} } else go(k); return; }
    var dl=e.target.closest('[data-lib]'); if(dl){ try{ parent.postMessage({source:'playbook',type:'openDrillEditor',edit:true,libId:dl.getAttribute('data-lib')},'*'); }catch(_){} return; }
  });
  /* 게임모델·일정이 바뀌면(다른 프레임에서) 다시 그린다 */
  window.addEventListener('storage',function(e){ if(!e||!e.key||/cs_gamemodel_v1|cs_terms_v1|process_coach_v1|ps_sched_grp|cs_lib_rev/.test(e.key)){ if(document.activeElement&&(document.activeElement.tagName==='TEXTAREA'||document.activeElement.isContentEditable))return; readLib(function(l){ lib=l; render(); }); } });
  window.addEventListener('message',function(e){ var d=e&&e.data||{}; if(d.type==='refresh'||d.type==='setView'){ readLib(function(l){ lib=l; render(); }); }
    /* 2.580 · 작전판 편집기에서 돌아옴(저장·취소) — IDB 쓰기가 끝난 뒤 읽도록 한 박자 늦춘다(cs_lib_rev storage 이벤트도 따로 온다) */
    if(d.type==='boardResult'||d.type==='boardCancel'){ setTimeout(function(){ readLib(function(l){ lib=l; render(); }); },350); } });
  document.addEventListener('visibilitychange',function(){ if(!document.hidden){ readLib(function(l){ lib=l; render(); }); } });
  render(); readLib(function(l){ lib=l; render(); });
})();
</script>
<style id="ps-2595-empty">/* 2.595 — 디자인 5단계 · 빈 상태는 문 하나(플레이북): 오른쪽 빈 판은 모델이 없을 때도 «세부 국면을 고르세요» 한 줄(아이콘 · 제목 · 설명). 머리줄의 «게임모델 편집 →» 은 바로 옆 서브탭 «게임모델» 과 같은 문이라 숨김(목록 안의 «게임모델 열기 →» 는 그대로). */
.hd .acts [data-go="settings"]{display:none!important}
@media (max-width:700px){ .hd .acts{width:auto!important;margin-left:auto!important} }
#detail .empty,#list .empty{padding:28px 12px}
#detail .empty::before,#list .empty::before{content:"";display:block;width:32px;height:32px;margin:0 auto 10px;border-radius:10px;background:var(--panel2,#F4F5F7);border:1px solid var(--line)}
#detail .empty b,#list .empty b{font-size:var(--t-6,16px);font-weight:800;color:var(--ink,#14161A);margin-bottom:6px}
</style>
<script>
/* 2.595 — 모델이 없을 때 오른쪽 판이 비는 것을 채운다(렌더 함수는 손대지 않고, 비워지면 문장을 넣는다) */
(function(){
  var box=document.getElementById('detail'); if(!box)return;
  var H='<div class="empty ps-empty-nomodel"><b>세부 국면을 고르세요</b>게임모델에서 국면을 세우면 왼쪽 목록에 뜨고, 하나를 누르면 원칙·장면·드릴·이번 주 배정이 여기 옵니다.</div>';
  function fill(){ if(!box.innerHTML.trim())box.innerHTML=H; }
  new MutationObserver(function(){ clearTimeout(box.__t); box.__t=setTimeout(fill,0); }).observe(box,{childList:true});
  fill();
})();
</script>
