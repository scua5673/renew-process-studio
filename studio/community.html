<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>커뮤니티 · 훈련 공유</title>
<link rel="stylesheet" href="/vendor/fonts.css?v=2.552b"><link rel="stylesheet" href="/vendor/tokens.css?v=2.552b">
<script src="storage.js"></script>
<style>
  b,strong{font-weight:var(--fw-head)}   /* 브라우저 기본 bold=700 차단 — 무게는 600·800만 */
  :focus-visible{outline:2px solid #3a6df0 !important;outline-offset:2px;border-radius:6px;}
  :root{
    --bg:#ECEDF0;--surface:#FFFFFF;--surface-2:#F1F2F4;--line:#E3E6EA;--line-soft:#ECEDF0;
    --text:#14161A;--text-2:#3E434B;--text-3:#8A9099;--accent:#3a6df0;--accent-soft:rgba(58,109,240,.09);
    --red:#C24A46;--blue:#3a6df0;
  }
  body.fmdark{
    --bg:#0F141B;--surface:#1A212B;--surface-2:#232C38;--line:#2C3744;--line-soft:#232C38;
    --text:#E8EAED;--text-2:#C3C9D1;--text-3:#78818D;--accent:#4D7DFF;--accent-soft:rgba(77,125,255,.14);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--text);font-family:Pretendard,-apple-system,BlinkMacSystemFont,system-ui,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:var(--fs-title);line-height:1.5}
  #wrap{max-width:none;margin:0;padding:12px 20px 80px}
  /* 제목 띠 — 6개 탭 공통 규격(흰 배경·좌우 20·상하 12·아래 1px 테두리). #wrap 패딩을 음수 마진으로 뚫고 전체 폭 */
  .top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:9px;
    height:52px;box-sizing:border-box;flex:0 0 auto;
    background:var(--surface);border-bottom:1px solid var(--line);
    margin:-12px -20px 12px;padding:0 20px}
  .top h1{font-size:var(--fs-h2);font-weight:var(--fw-head);letter-spacing:-.3px;margin:0}
  .top .sub{font-size:var(--fs-sub);color:var(--text-3);font-weight:var(--fw-body)}
  .top .sp{flex:1}
  .btn{border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--text);
    font-family:inherit;font-size:var(--fs-body);font-weight:var(--fw-body);padding:9px 14px;cursor:pointer}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.ghost{background:transparent;color:var(--text-3)}
  .btn:disabled{opacity:.5;cursor:default}
  /* 필터 바 */
  .bar{display:flex;gap:8px;align-items:center;margin:12px 0 14px;flex-wrap:wrap}
  .chips{display:flex;gap:6px;flex-wrap:nowrap;flex:1 1 100%;min-width:0;order:2;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none;scroll-snap-type:x proximity;padding-bottom:2px;-webkit-overflow-scrolling:touch}   /* 가로 스크롤 한 줄 — 세로 공간 절약(콘텐츠가 먼저 보이게) */
  .chips::-webkit-scrollbar{display:none}
  .chip{scroll-snap-align:start}
  .chip{flex:0 0 auto;border:1.5px solid var(--line);background:var(--surface);color:var(--text-2);
    font-family:inherit;font-size:var(--fs-sub);font-weight:var(--fw-body);padding:7px 12px;border-radius:999px;cursor:pointer;white-space:nowrap}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .filters{order:1;margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  select.sort,select.filt{border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--text);
    font-family:inherit;font-size:var(--fs-sub);font-weight:var(--fw-body);padding:8px 10px;outline:none;cursor:pointer}
  /* 카드 그리드 */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
  .card{background:var(--surface);border:1px solid var(--line-soft);border-radius:14px;overflow:hidden;cursor:pointer;
    transition:transform .12s ease, box-shadow .12s ease}
  .card:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(0,0,0,.08)}
  .card .th{aspect-ratio:16/10;background:#1e8c4c;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .card .th .noimg{font-size:var(--fs-micro)}
  .card .th img{width:100%;height:100%;object-fit:cover;display:block}
  .card .th .noimg{color:rgba(255,255,255,.55);font-size:var(--fs-caption);font-weight:var(--fw-body)}
  .card .bd{padding:10px 12px 12px}
  .card .tt{font-size:var(--fs-body);font-weight:var(--fw-head);line-height:1.38;margin:0 0 6px;word-break:keep-all;overflow-wrap:anywhere}   /* 잘림 없이 여러 줄 — 행이 늘어나도 제목은 다 보여준다 */
  .card .desc{font-size:var(--fs-caption);line-height:1.45;color:var(--text-2);margin:-1px 0 7px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .meta{display:flex;align-items:center;gap:4px 6px;font-size:var(--fs-micro);color:var(--text-3);font-weight:var(--fw-body);flex-wrap:wrap}
  .card .meta{min-height:17px;margin-bottom:5px}
  .card .foot{display:flex;align-items:center;gap:6px;font-size:var(--fs-micro);color:var(--text-3);font-weight:var(--fw-body);flex-wrap:wrap}
  .card .foot .who{flex:1 1 auto;min-width:0;white-space:normal;word-break:break-all}   /* 아이디도 잘리지 않게 — 길면 줄바꿈 */
  .card .foot .n{margin-left:auto;display:inline-flex;align-items:center;gap:9px;flex:0 0 auto}
  .card .open-cue{display:flex;width:100%;align-items:center;justify-content:space-between;gap:8px;margin-top:9px;padding:9px 0 0;border:0;border-top:1px solid var(--line-soft);background:none;font-family:inherit;font-size:var(--fs-caption);font-weight:var(--fw-head);color:var(--accent);cursor:pointer;text-align:left}
  .card .open-cue small{font-size:var(--fs-micro);font-weight:var(--fw-body);color:var(--text-3)}
  .cat{display:inline-block;font-size:var(--fs-micro);font-weight:var(--fw-head);padding:2px 7px;border-radius:6px;color:#fff}
  .meta .n{margin-left:auto;display:inline-flex;align-items:center;gap:9px}
  .stat{display:inline-flex;align-items:center;gap:3px;color:var(--text-3);font-weight:var(--fw-body);font-size:var(--fs-caption);font-variant-numeric:tabular-nums}
  .stat svg,.likebtn svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
  .likebtn{border:0;background:none;font-family:inherit;font-size:var(--fs-caption);font-weight:var(--fw-body);color:var(--text-3);cursor:pointer;padding:1px 2px;border-radius:6px;display:inline-flex;align-items:center;gap:3px;line-height:1}
  .likebtn.on{color:var(--red)}
  .likebtn.on svg{fill:var(--red);stroke:var(--red)}
  .likebtn:active svg{transform:scale(1.25);transition:transform .12s}
  .likebtn:disabled{opacity:.5;cursor:default}
  /* 빈 상태 */
  .empty{grid-column:1/-1;text-align:center;padding:70px 20px;color:var(--text-3)}
  .empty b{display:block;font-size:var(--fs-title);color:var(--text-2);margin-bottom:6px}
  .empty-act{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:14px;flex-wrap:wrap}
  .empty-act button{min-height:32px;padding:0 16px;border:1px solid var(--line-soft,#E5E8EE);background:var(--surface);border-radius:10px;font:800 13px var(--f);color:var(--text-2);cursor:pointer}
  .empty-act button:hover{border-color:var(--accent);color:var(--accent)}
  .empty-act small{font-size:11px;color:var(--text-3);opacity:.8}
  .empty.loading b{color:var(--text-3)}
  /* 시트(상세·올리기) */
  .mask{position:fixed;inset:0;background:rgba(8,12,18,.5);display:none;align-items:flex-end;justify-content:center;z-index:600}
  .mask.on{display:flex}
  @media(min-width:640px){.mask.on{align-items:center}}
  .modal{width:100%;max-width:560px;max-height:88vh;overflow-y:auto;background:var(--surface);
    border-radius:16px 16px 0 0;padding:18px;box-sizing:border-box}
  @media(min-width:640px){.modal{border-radius:16px}}
  .modal h2{font-size:var(--fs-title);font-weight:var(--fw-head);margin:0 0 4px}
  .modal .dth{border-radius:12px;overflow:hidden;background:#1e8c4c;margin:12px 0}
  .modal .dth img{width:100%;display:block}
  .drow{display:flex;gap:8px;margin-top:14px}
  .drow .btn{flex:1}
  .fld{margin-top:12px}
  .fld label{display:block;font-size:var(--fs-caption);font-weight:var(--fw-head);color:var(--text-3);margin-bottom:5px}
  .fld input[type=text],.fld input[type=number]{width:100%;border:1.5px solid var(--line);border-radius:10px;background:var(--surface-2);
    color:var(--text);font-family:inherit;font-size:var(--fs-body);font-weight:var(--fw-body);padding:10px 12px;outline:none}
  .fld input[type=number]{max-width:130px}
  .fld input:focus{border-color:var(--accent)}
  .agechips{display:flex;gap:6px;flex-wrap:wrap}
  .agechips button{border:1.5px solid var(--line);background:var(--surface-2);color:var(--text-2);
    font-family:inherit;font-size:var(--fs-sub);font-weight:var(--fw-body);padding:7px 12px;border-radius:999px;cursor:pointer}
  .agechips button.on{background:var(--accent);border-color:var(--accent);color:#fff}
  /* 올리기 — 내 보관함 목록 */
  .pick{max-height:300px;overflow-y:auto;border:1px solid var(--line);border-radius:12px;margin-top:6px}
  .pk{display:flex;align-items:center;gap:10px;padding:9px 11px;border-bottom:1px solid var(--line-soft);cursor:pointer}
  .pk:last-child{border-bottom:0}
  .pk:hover{background:var(--surface-2)}
  .pk.on{background:var(--accent-soft)}
  .pk .pth{width:52px;height:34px;border-radius:6px;background:#1e8c4c;overflow:hidden;flex:0 0 auto}
  .pk .pth img{width:100%;height:100%;object-fit:cover;display:block}
  .pk .pn{font-size:var(--fs-body);font-weight:var(--fw-body);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pk .pm{font-size:var(--fs-caption);color:var(--text-3);font-weight:var(--fw-body);flex:0 0 auto}
  .hint{font-size:var(--fs-caption);color:var(--text-3);margin-top:8px;line-height:1.6}
  #toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,10px);background:#1A212B;color:#fff;
    font-size:var(--fs-sub);font-weight:var(--fw-body);border-radius:20px;padding:10px 17px;opacity:0;pointer-events:none;transition:.22s;z-index:9000;white-space:nowrap}
  #toast.on{opacity:1;transform:translate(-50%,0)}
  .own{color:var(--red);font-weight:var(--fw-body);font-size:var(--fs-caption);background:none;border:0;cursor:pointer;font-family:inherit;padding:0}
  /* 올리기 — 우측 하단 플로팅(스크롤해도 항상 접근) */
  .fab{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom));z-index:500;
    display:inline-flex;align-items:center;gap:7px;border:0;border-radius:999px;
    background:var(--accent);color:#fff;font-family:inherit;font-weight:var(--fw-head);font-size:var(--fs-title);
    padding:14px 20px;cursor:pointer;box-shadow:0 6px 16px var(--sh18,rgba(16,24,40,.18));
    transition:transform .12s, box-shadow .12s}
  .fab svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round}
  .fab:hover{box-shadow:0 8px 20px var(--sh22,rgba(16,24,40,.22))}
  .fab:active{transform:translateY(1px) scale(.98)}
  /* 데스크톱: 한 줄 최대 3개 수준으로 크게 보여 작전판 안 선수·선이 카드에서도 읽히게 */
  @media (min-width:900px){ .grid{grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px} #wrap{padding:12px 20px 100px} .card .tt{font-size:var(--fs-input)} .meta{font-size:var(--fs-caption)} }   /* 좌우 20px — 6개 탭 제목 왼쪽 정렬 통일 */
  @media (max-width:560px){.grid{grid-template-columns:1fr}.card .th{aspect-ratio:16/9}.card .tt{font-size:var(--fs-input)}.card .bd{padding:11px 13px 13px}}
  @media (hover:hover){ .card:hover{transform:translateY(-3px);box-shadow:0 12px 28px rgba(0,0,0,.10)} }
  @media (hover:none){ .card:hover{transform:none;box-shadow:none} }
  /* v361 — 보관함과 같은 3단 위계: 탐색 · 자료 목록 · 선택 미리보기 */
  .comm-shell{display:grid;grid-template-columns:150px minmax(340px,.9fr) minmax(360px,1.15fr);   /* 1.889 — 탐색 열 190→150 (사용자: 최대한 작게) */
    min-height:calc(100vh - 76px);background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:visible}   /* 1.889 — overflow:hidden 이 sticky 를 무력화해 미리보기가 같이 스크롤됐다(사용자). 모서리는 자식 라운드로 */
  @media (min-width:821px){
    .comm-nav{position:sticky;top:0;align-self:start;max-height:calc(100vh - 76px);overflow-y:auto;scrollbar-width:none;border-radius:16px 0 0 16px}
    .comm-nav::-webkit-scrollbar{display:none}
    .comm-preview{border-radius:0 16px 16px 0}
    .comm-preview{max-height:calc(100vh - 76px)}
  }
  .comm-nav,.comm-list{border-right:1px solid var(--line)}
  .comm-nav,.comm-list,.comm-preview{min-width:0;padding:14px}
  .comm-nav{padding:12px 8px}
  .comm-nav button{padding:6px 8px;font-size:var(--fs-sub,13px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .comm-nav .nav-lb{padding-left:2px}
  .comm-nav .nav-sec{margin-bottom:14px}
  .comm-nav h2,.comm-preview h2{font-size:var(--fs-body);font-weight:var(--fw-head);margin:0 0 9px}
  .comm-nav .nav-sec{margin-bottom:19px}
  .comm-nav .nav-lb{font-size:var(--fs-caption);font-weight:var(--fw-head);color:var(--text-3);margin:0 0 7px}
  .comm-nav button{display:flex;align-items:center;width:100%;border:0;border-radius:10px;background:transparent;color:var(--text-2);
    font-family:inherit;font-size:var(--fs-body);font-weight:var(--fw-body);padding:8px 10px;text-align:left;cursor:pointer}
  .comm-nav button:hover{background:var(--surface-2)}
  .comm-nav button.on{background:var(--accent-soft);color:var(--accent);font-weight:var(--fw-head)}
  .comm-nav button span{margin-left:auto;color:var(--text-3);font-size:var(--fs-caption);font-variant-numeric:tabular-nums}
  .comm-list .bar{margin:0 0 10px;display:grid;grid-template-columns:minmax(150px,340px) auto;justify-content:space-between;gap:8px}   /* 1.965 — 검색창은 폭 340 까지만(사용자: 좀만 더 작게), 필터는 오른쪽 끝 */
  .comm-search{width:100%;min-width:0;border:1.5px solid var(--line);border-radius:10px;background:var(--surface-2);color:var(--text);
    font-family:inherit;font-size:var(--fs-sub);padding:7px 10px;height:36px;min-height:36px;outline:none}
  .comm-search:focus{border-color:var(--accent)}
  .comm-list .chips{display:none}
  .comm-list .filters{order:0;margin:0;flex-wrap:nowrap}
  .comm-list .filters #sortSel{display:none}
  .comm-count{font-size:var(--fs-caption);color:var(--text-3);margin:0 0 4px;padding:0 2px}
  .comm-list .grid{display:block}
  .comm-list .card{display:grid;grid-template-columns:112px minmax(0,1fr);border:0;border-bottom:1px solid var(--line-soft);
    border-radius:0;padding:11px 6px;background:transparent;overflow:visible;transition:none}
  .comm-list .card:hover{transform:none;box-shadow:none;background:var(--surface-2)}
  .comm-list .card.on{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
  .comm-list .card .th{width:112px;height:76px;aspect-ratio:auto;border-radius:8px}
  .comm-list .card .bd{padding:0 0 0 12px;min-width:0}
  .comm-list .card .tt{font-size:var(--fs-body);margin:0 0 4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .comm-list .card .desc{display:none}
  .comm-list .card .meta{margin:0 0 5px;min-height:0}
  .comm-list .card .foot{margin:0}
  /* 1.947 — 보기 방식 세그 + 카드/크게 보기 */
  .viewseg{display:inline-flex;gap:2px;padding:3px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;flex:0 0 auto}
  .viewseg button{width:34px;height:28px;border:0;border-radius:6px;background:transparent;color:var(--text-3);display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
  .viewseg button svg{width:16px;height:16px}
  .viewseg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 3px var(--sh12,rgba(16,24,40,.12))}
  .comm-list.view-cards .grid,.comm-list.view-large .grid{display:grid;gap:14px}
  .comm-list.view-cards .grid{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}

  .comm-list.view-large .card .th{aspect-ratio:16/9}
  .comm-list.view-cards .card .bd,.comm-list.view-large .card .bd{padding:10px 12px 12px}
  .comm-list.view-large .card .bd{padding:12px 14px 14px}
  .comm-list.view-large .card .desc{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .comm-list.view-large .card .tt{font-size:var(--fs-input)}
  .comm-list.view-cards .card .meta,.comm-list.view-large .card .meta{margin:0 0 6px}
  .comm-list .card .open-cue{display:none}
  .comm-preview{position:sticky;top:0;align-self:start;display:flex;flex-direction:column;gap:12px;
    height:calc(100vh - 76px);overflow:hidden;background:var(--surface)}
  .cp-empty{margin:auto;text-align:center;color:var(--text-3);font-size:var(--fs-body);padding:30px}
  .cp-empty b{display:block;color:var(--text-2);font-size:var(--fs-input);margin-bottom:5px}
  .cp-head{display:flex;align-items:flex-start;gap:8px}
  .cp-head-copy{flex:1;min-width:0}
  .cp-title{font-size:var(--fs-h2);font-weight:var(--fw-head);line-height:1.35;margin:0 0 5px;word-break:keep-all;overflow-wrap:anywhere}
  .cp-meta{font-size:var(--fs-caption);color:var(--text-3);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .cp-thumb{position:relative;background:#1e8c4c;border-radius:12px;overflow:hidden;aspect-ratio:16/10}

  .cp-play:active{transform:translate(-50%,-50%) scale(.93)}
  .cpa{position:absolute;inset:0;background:repeating-linear-gradient(90deg,#1f7b48 0 10%,#257f4c 10% 20%)}
  .cpa-real{position:absolute;inset:0}
  .cpa-real svg{width:100%;height:100%;display:block}
  .cpa:before{content:"";position:absolute;inset:6px;border:1.5px solid rgba(255,255,255,.7);border-radius:3px}
  .cpt{position:absolute;transform:translate(-50%,-50%);width:23px;height:23px;border-radius:50%;border:1.5px solid #fff;font-style:normal;font-weight:800;font-size:10px;line-height:20px;text-align:center;transition:left .85s ease,top .85s ease;box-shadow:0 2px 5px rgba(0,0,0,.3)}

/* ── 안전 렌더 — 썸네일 SVG는 사용자 생성물: img data-URI로만(스크립트 실행 불가) + 새니타이즈 ── */
function sanSvg(s){
  s=String(s||''); if(!/^\s*<svg[\s>]/i.test(s))return '';
  if(s.length>200000)return '';
  s=s.replace(/<script[\s\S]*?(<\/script>|$)/gi,'')
     .replace(/<foreignObject[\s\S]*?(<\/foreignObject>|$)/gi,'')
     .replace(/\son\w+\s*=\s*("[^"]*"|'[^']*'|[^\s>]+)/gi,'')
     .replace(/javascript:/gi,'');
  /* 예전 썸네일 복구 — outerHTML 로 만들어져 xlink: 를 쓰면서 xmlns:xlink 선언이 빠진 것들.
     <img src="data:image/svg+xml,…"> 는 엄격한 XML 파서라 선언이 없으면 SVG 전체가 깨진다('실제 잔디' 텍스처 보드만 해당). */
  if(s.indexOf('xlink:')>=0 && s.indexOf('xmlns:xlink')<0)
    s=s.replace(/<svg\b/i,'<svg xmlns:xlink="http://www.w3.org/1999/xlink"');
  return s;
}
function thumbImg(svg,cls){
  var s=sanSvg(svg);
  if(!s)return '<span class="noimg">그림 없음</span>';
  return '<img '+(cls||'')+' alt="" src="data:image/svg+xml;charset=utf-8,'+encodeURIComponent(s)+'">';
}

function fetchMyLikes(){

/* 피드 단기 캐시 — 같은 탭에서 60초 안 재방문은 서버를 다시 부르지 않는다(동시 사용자 확장 대비).
   발행·삭제 등 변경 후엔 fetchPosts(true)로 캐시를 깨고 새로 받는다. */
var FEED_TTL=60000,FEED_CK='ps_comm_feed_cache_v1';
function fetchPosts(force){
  var b=base();
  var grid=$('grid');
  if(!b){grid.innerHTML='<div class="empty"><b>커뮤니티에 연결할 수 없어요</b>네트워크 연결을 확인해 주세요.</div>';return;}
  if(force){try{sessionStorage.removeItem(FEED_CK)}catch(_){}}
  else{
    try{var c=JSON.parse(sessionStorage.getItem(FEED_CK)||'null');
      if(c&&c.sort===sort&&Array.isArray(c.posts)&&Date.now()-c.at<FEED_TTL){posts=c.posts;ready=true;fetchMyLikes().then(render);return;}
    }catch(_){}
  }
  var withLikes = sort==='likes';
  var order = withLikes?'likes.desc,created_at.desc' : sort==='views'?'views.desc,created_at.desc' : sort==='copies'?'copies.desc,created_at.desc' : 'created_at.desc';
  function run(cols,ord){ return fetch(b+'/rest/v1/ps_community?select='+cols+'&deleted=eq.false&order='+ord+'&limit=100',{headers:hd()}); }
  var full='id,owner,owner_name,title,summary,cat,age,players,thumb,views,copies,likes,created_at';
  var lean='id,owner,owner_name,title,summary,cat,age,thumb,views,copies,created_at';
  function done(j){ if(j){ posts=j; ready=true;
    try{sessionStorage.setItem(FEED_CK,JSON.stringify({at:Date.now(),sort:sort,posts:j}))}catch(_){}
    fetchMyLikes().then(render); } }
  /* 2.068 — 응답이 늦을 때 20초 가까이 빈칸이던 것을 없앤다(빈 화면 없음) */
  grid.innerHTML='<div class="empty loading"><b>커뮤니티를 불러오는 중…</b></div>';
  run(full,order).then(function(r){
    if(r.status===404){tableMissing=true;render();return null;}
    if(r.status===400){ /* likes 컬럼 미마이그레이션 — likes 없이 재시도 */
      return run(lean,'created_at.desc').then(function(r2){ if(!r2.ok)throw r2.status; return r2.json(); });
    }
    if(!r.ok)throw r.status; return r.json();
  }).then(done)
  .catch(function(code){
    /* 2.068 — "불러오지 못했어요" 한 줄로는 사용자도 우리도 원인을 알 수 없었다(2026-08-20 백엔드 무응답 사고).
       원인을 이름으로 부르고, 다시 시도를 준다. 브라우저는 CORS 헤더 없는 오류 페이지(예: Cloudflare 522)를
       거절로 돌려줘 상태 코드를 못 읽는다 — 그때는 navigator.onLine 으로 내 인터넷과 서버를 가른다. */
    var n=(typeof code==='number')?code:0, t;
    if(n===401)t=['로그인이 만료됐어요','다시 로그인하면 커뮤니티가 보여요.'];
    else if(n===403)t=['볼 권한이 없어요','관리자에게 문의해 주세요.'];
    else if(n>=500||n===0&&navigator.onLine)t=['서버가 응답하지 않아요','커뮤니티 서버가 잠시 멈춰 있어요. 잠시 뒤 다시 시도해 주세요.'];
    else if(n===0)t=['인터넷이 끊겼어요','연결을 확인하고 다시 시도해 주세요.'];
    else t=['불러오지 못했어요','잠시 후 다시 시도해 주세요.'];
    grid.innerHTML='<div class="empty"><b>'+t[0]+'</b>'+t[1]
      +'<div class="empty-act"><button type="button" id="commRetry">다시 시도</button>'
      +(n?'<small>오류 '+n+'</small>':'')+'</div></div>';
    var rb=document.getElementById('commRetry');
    if(rb)rb.onclick=function(){ fetchPosts(true); };   /* 누르면 곧바로 위 로딩 상자로 바뀐다 */
  });
}
function paintLike(btn,liked,count){ if(!btn)return; btn.classList.toggle('on',!!liked); btn.innerHTML=IC_HEART+'<span class="lc">'+(count||0)+'</span>'; }
function toggleLike(p,btn){
  var me=sess();
  if(!me||!me.at){ toast('좋아요는 로그인 후 가능해요'); return; }
  if(btn&&btn._busy)return; if(btn)btn._busy=true;
  var was=myLikes.has(p.id);
  if(was){ myLikes.delete(p.id); p.likes=Math.max(0,(p.likes||0)-1); } else { myLikes.add(p.id); p.likes=(p.likes||0)+1; }
  paintLike(btn, myLikes.has(p.id), p.likes);   /* 낙관적 반영 */
  fetch(base()+'/rest/v1/rpc/ps_comm_like',{method:'POST',headers:hd(me.at),body:JSON.stringify({pid:p.id})})
    .then(function(r){ if(!r.ok)throw 0; return r.json(); })
    .then(function(j){ var row=Array.isArray(j)?j[0]:j; if(row){ if(row.liked)myLikes.add(p.id); else myLikes.delete(p.id); p.likes=row.likes; paintLike(btn,row.liked,row.likes); } if(btn)btn._busy=false; })
    .catch(function(){ if(was){ myLikes.add(p.id); p.likes=(p.likes||0)+1; } else { myLikes.delete(p.id); p.likes=Math.max(0,(p.likes||0)-1); } paintLike(btn,myLikes.has(p.id),p.likes); if(btn)btn._busy=false; toast('좋아요 처리 실패 — 다시 시도해 주세요'); });
}

$('upBtn').onclick=openUpload;
/* 2.668 — 커뮤니티는 공개다. 선수 **이름**은 사진과 같은 개인정보(유소년이면 더). 실측: 발행 코드가 사진만 떼고 이름은 그대로 실었다
   (서버 21건 중 실명 0 — 아직 사고는 없었지만 «9월 4일 훈련»처럼 명단 19명이 붙은 판을 올리면 그대로 공개된다). 번호·포지션은 남기고 이름만 비운다.
   썸네일(SVG)에도 이름이 <text> 로 박혀 있어 같은 이름을 지운다(stripThumbNames). */
var __pubNames=[];   /* 이번 발행에서 지운 이름들 — 썸네일에서도 지우려고 모아 둔다 */
function stripSnap(sn){ /* 사진·이름 제거 — 용량·개인정보 (링크 공유와 동일 정책) */
  try{var c=JSON.parse(JSON.stringify(sn||null));if(!c)return c;
    c.customImages=[];
    if(c.players)c.players=c.players.map(function(pl){if(!pl)return pl;pl=JSON.parse(JSON.stringify(pl));if(pl.team==='img'){pl.team='blue';delete pl.src;}
      if(pl.name&&String(pl.name).trim()){var nm=String(pl.name).trim();if(__pubNames.indexOf(nm)<0)__pubNames.push(nm);pl.name='';}return pl;});
    return c;}catch(_){return null;}
}
function stripThumbNames(svg){ /* 2.668 — 썸네일 SVG 의 <text>이름</text> 제거(스냅에서 모은 이름만) */
  try{ var t=String(svg||''); if(!t)return t;
    __pubNames.forEach(function(nm){ var re=new RegExp('<text[^>]*>\\s*'+nm.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\s*<\\/text>','g'); t=t.replace(re,''); });
    return t; }catch(_){ return String(svg||''); }
}
function stripFrames(fr){ /* 애니메이션 프레임 — 사진만 제거하고 유지 (#13) */
  if(!Array.isArray(fr)||fr.length<2)return null;
  return fr.map(function(f){
    /* v192 프레임에는 이동 곡선·깜박임·자막과 릴스 제목 정보도 들어간다.
       전체 프레임을 복사하고 개인정보 가능성이 있는 스냅/썸네일만 정리해야
       커뮤니티에서도 원본과 같은 애니메이션으로 재생된다. */
    var out={}; try{out=JSON.parse(JSON.stringify(f||{}));}catch(_){out={};}
    out.snap=stripSnap(f&&f.snap); out.thumb=''; out.dur=(f&&f.dur)||1;
    return out;
  });
}
function stripTrainings(src){ /* 다중 훈련·텍스트 섹션 보존 — 각 훈련의 스냅에서 사진만 제거 */
  if(!src||!Array.isArray(src.trainings)||!src.trainings.length)return null;
  return src.trainings.map(function(t){
    var tt={}; try{tt=JSON.parse(JSON.stringify(t||{}));}catch(_){tt={};}
    tt.snap=stripSnap(tt.snap);
    if(tt.scenes)tt.scenes=tt.scenes.map(function(sc){return {snap:stripSnap(sc&&sc.snap),thumb:stripThumbNames((sc&&sc.thumb)||'')};});
    if(tt.thumb)tt.thumb=stripThumbNames(tt.thumb);   /* 2.668 */
    return tt;
  });
}
function openUpload(){
  var me=sess();
  if(!communityLibraryRequireUnlocked(true)||!me||!me.uid)return;
  var flowEpoch=communityLibraryBeginFlow();
  modal.innerHTML='<h2>보관함 확인 중…</h2><div class="hint">올릴 훈련을 안전하게 불러오고 있어요.</div>';

  handleGet(me,ctl?ctl.signal:undefined).then(function(h){
    communityLibraryContinuation(flowEpoch,me.uid);
    if(__communityLibraryAbort===ctl)__communityLibraryAbort=null;
    if(!h){openHandleSheet(me,flowEpoch);return;}buildUpload(me,h,flowEpoch);
  }).catch(function(e){
    if(__communityLibraryAbort===ctl)__communityLibraryAbort=null;
    if((e&&e.name==='AbortError')||(e&&e.psLibraryLocked)||flowEpoch!==__communityLibraryEpoch)return;
    if(e==='auth'){communityLibraryAuthChanged(false);toast('로그인이 만료됐어요 — 다시 로그인해 주세요');return;}

  });

function buildUpload(me,handle,flowEpoch){

  store.get(LIB_KEY).then(function(lib){

    lib=(Array.isArray(lib)?lib:[]).filter(function(d){var t=d.type||'train';return t==='train'||t==='setpiece'||t==='board';});
    var h='<h2>커뮤니티에 올리기</h2><div class="hint" style="margin-top:2px">내 보관함에서 훈련을 골라 모든 코치에게 공유합니다. 사진은 자동으로 빠져요. 아이디 <b>@'+esc(handle)+'</b> 로 올라갑니다.</div>';
    if(!lib.length){
      h+='<div class="empty" style="padding:40px 10px"><b>보관함이 비어 있어요</b>작전판에서 훈련을 만들어 보관함에 저장한 뒤 올릴 수 있어요.</div>'
        +'<div class="drow"><button class="btn" id="upClose">닫기</button></div>';
      modal.innerHTML=h;mask.classList.add('on');$('upClose').onclick=function(){communityLibraryCloseFlow();};return;
    }
    h+='<div class="fld"><label>훈련 선택</label><div class="pick" id="upPick"></div></div>'
      +'<div class="fld"><label>분류 (여러 개 선택 가능)</label><div class="agechips" id="upCats"></div></div>'
      +'<div class="fld"><label>제목</label><input type="text" id="upTitle" maxlength="60" placeholder="예: 4v2 론도 — 탈압박 기본"></div>'
      +'<div class="fld"><label>연령대 (여러 개 선택 가능)</label><div class="agechips" id="upAges"></div></div>'
      +'<div class="fld"><label>훈련 인원 (명)</label><input type="number" id="upPlayers" min="1" max="40" inputmode="numeric" placeholder="예: 8"></div>'
      +'<div class="drow"><button class="btn" id="upCancel">취소</button><button class="btn primary" id="upGo">올리기</button></div>';
    modal.innerHTML=h;mask.classList.add('on');
    var sel=null, ages=[], selCats=[];
    function markCat(){[].forEach.call($('upCats').children,function(x){x.classList.toggle('on',selCats.indexOf(x.dataset.k)>=0);});}
    CATS.forEach(function(cd){
      var b=document.createElement('button');b.type='button';b.textContent=cd[1];b.dataset.k=cd[0];
      b.onclick=function(){var i=selCats.indexOf(cd[0]);if(i>=0)selCats.splice(i,1);else selCats.push(cd[0]);markCat();};
      $('upCats').appendChild(b);
    });
    var pick=$('upPick');
    lib.slice(0,50).forEach(function(d){
      var f=focusOf(d.focus);
      var row=document.createElement('div');row.className='pk';row.dataset.lib=d.libId||'';
      row.innerHTML='<span class="pth">'+thumbImg(d.thumb)+'</span><span class="pn">'+esc(d.name||'훈련')+'</span>'
        +'<span class="pm">'+esc(f[1])+(d.minutes?(' · '+d.minutes+"'"):'')+'</span>';
      row.onclick=function(){
        try{communityLibraryContinuation(flowEpoch,me.uid);}catch(_){return;}
        sel=d;[].forEach.call(pick.children,function(x){x.classList.remove('on');});row.classList.add('on');
        var t=$('upTitle');if(t&&!t.value)t.value=d.name||'';
        if(!selCats.length&&CATGUESS[d.focus]){selCats.push(CATGUESS[d.focus]);markCat();}   /* 명백한 것만 자동 제안 */
      };
      pick.appendChild(row);
    });
    /* 보관함 미리보기에서 넘어온 항목 자동 선택 */
    try{ var _pre=window.__upPreselect;
      if(_pre){ var _pr=pick.querySelector('[data-lib="'+_pre+'"]');
        if(_pr){ _pr.click(); _pr.scrollIntoView({block:'nearest'}); } window.__upPreselect=null; } }catch(_){}
    function markAge(){[].forEach.call($('upAges').children,function(x){x.classList.toggle('on',ages.indexOf(x.textContent)>=0);});}
    AGES.forEach(function(a){
      var b=document.createElement('button');b.type='button';b.textContent=a;
      b.onclick=function(){var i=ages.indexOf(a);if(i>=0)ages.splice(i,1);else ages.push(a);markAge();};

    $('upGo').onclick=function(){
      try{communityLibraryContinuation(flowEpoch,me.uid);}catch(_){return;}
      var title=($('upTitle').value||'').trim();

      if(!title){toast('제목을 적어주세요');$('upTitle').focus();return;}
      var item={}; __pubNames=[];   /* 2.668 */
      COPY_FIELDS.forEach(function(k){if(sel[k]!=null)item[k]=sel[k];});
      item.snap=stripSnap(item.snap);
      if(item.scenes)item.scenes=item.scenes.map(function(sc){return {snap:stripSnap(sc&&sc.snap),thumb:''};});
      var _trsUp=stripTrainings(sel); if(_trsUp)item.trainings=_trsUp;
      var _frUp=stripFrames(item.frames); if(_frUp)item.frames=_frUp; else delete item.frames;
      var body={id:'C'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),
        owner:me.uid,owner_name:handle,
        title:title,summary:'',

        .then(function(r){
          if(r.status===401){throw 'auth';}
          if(!r.ok)throw 0;
          communityLibraryContinuation(flowEpoch,me.uid);
          if(__communityLibraryAbort===ctl)__communityLibraryAbort=null;
          communityLibraryCloseFlow();toast('커뮤니티에 올라갔어요 ✓');sort='new';$('sortSel').value='new';fetchPosts(true);

        .catch(function(e){

          if((e&&e.name==='AbortError')||(e&&e.psLibraryLocked)||flowEpoch!==__communityLibraryEpoch)return;
          if(e==='auth'){communityLibraryCloseFlow();toast('로그인이 만료됐어요 — 다시 로그인해 주세요');return;}
          var go=$('upGo');if(go){go.disabled=false;go.textContent='올리기';}

        });
    };
  }).catch(function(e){
    if((e&&e.psLibraryLocked)||flowEpoch!==__communityLibraryEpoch)return;
    communityLibraryCloseFlow();toast('보관함을 열지 못했어요 — 잠시 후 다시');
  });
}

.ps-fsheet .ps-fsheet-row button{height:28px;padding:0 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface,#fff);color:var(--text);font:inherit;font-size:12px;font-weight:600;cursor:pointer;box-sizing:border-box}
.ps-fsheet .ps-fsheet-row button.on{background:var(--act-soft,#EEF3FF);border-color:transparent;color:var(--c-act,#3A6DF0)}
.ps-fsheet .ps-fsheet-row.sel{display:grid;grid-template-columns:1fr 1fr}
.ps-fsheet .ps-fsheet-row.sel select{height:40px;min-height:40px;width:100%;padding:0 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface,#fff);font:inherit;font-size:13px;box-sizing:border-box}
.ps-fsheet .ps-fsheet-reset{width:100%;height:40px;margin-top:10px;border:1px solid var(--line);border-radius:10px;background:var(--surface,#fff);color:var(--text-2,#646A73);font:inherit;font-size:13px;font-weight:600;cursor:pointer}
</style>
<script>
/* 2.594 — 커뮤니티 폰 머리줄 한 줄 */
(function(){
  var mq=window.matchMedia('(max-width:560px)');
  var top=document.querySelector('.top'), bar=document.querySelector('.comm-list .bar'), q=document.getElementById('commSearch'), filters=document.querySelector('.comm-list .filters');
  var age=document.getElementById('ageSel'), pl=document.getElementById('plSel');
  if(!top||!bar||!q||!filters)return;
  [].forEach.call(document.querySelectorAll('.comm-nav .nav-sec'),function(s,i){ if(i<2)s.classList.add('ps-ph-hide'); });
  var btn=document.createElement('button'); btn.type='button'; btn.id='commFiltBtn'; btn.setAttribute('aria-label','필터'); btn.innerHTML='필터<span class="n" hidden></span>';
  var sheet=document.createElement('div'); sheet.className='ps-fsheet'; sheet.id='commFiltSheet'; sheet.hidden=true;
  sheet.innerHTML='<div class="ps-fsheet-bd" data-close="1"></div><div class="ps-fsheet-pn" role="dialog" aria-label="필터">'+
    '<div class="ps-fsheet-h"><b>필터</b><button type="button" class="ps-fsheet-x" data-close="1">닫기</button></div>'+
    '<div class="ps-fsheet-sec"><div class="ps-fsheet-lb">탐색</div><div class="ps-fsheet-row" id="cfsSort"></div></div>'+
    '<div class="ps-fsheet-sec"><div class="ps-fsheet-lb">콘텐츠 유형</div><div class="ps-fsheet-row" id="cfsType"></div></div>'+
    '<div class="ps-fsheet-sec"><div class="ps-fsheet-lb">연령 · 인원</div><div class="ps-fsheet-row sel" id="cfsSel"></div></div>'+
    '<button type="button" class="ps-fsheet-reset" id="cfsReset">필터 지우기</button></div>';
  document.body.appendChild(sheet);
  var cfsSort=sheet.querySelector('#cfsSort'), cfsType=sheet.querySelector('#cfsType'), cfsSel=sheet.querySelector('#cfsSel');
  function mirror(box,attr){
    box.innerHTML='';
    [].forEach.call(document.querySelectorAll('.comm-nav ['+attr+']'),function(o){
      var b=document.createElement('button'); b.type='button'; b.textContent=o.textContent; b.className=o.classList.contains('on')?'on':'';
      b.onclick=function(){ o.click(); sync(); };
      box.appendChild(b);
    });
  }
  function sync(){ mirror(cfsSort,'data-sort-nav'); mirror(cfsType,'data-type-nav'); badge(); }
  function count(){ var n=0; try{ if(typeof sort!=='undefined'&&sort!=='new')n++; if(typeof typeF!=='undefined'&&typeF!=='all')n++; }catch(_){} if(age&&age.value)n++; if(pl&&pl.value)n++; return n; }
  function badge(){ var n=count(), s=btn.querySelector('.n'); s.textContent=String(n); s.hidden=!n; }
  function open(){ sync(); sheet.hidden=false; }
  function close(){ sheet.hidden=true; badge(); }
  btn.onclick=open;
  sheet.addEventListener('click',function(e){ if(e.target.getAttribute('data-close'))close(); });
  sheet.querySelector('#cfsReset').onclick=function(){
    var s0=document.querySelector('.comm-nav [data-sort-nav="new"]'), t0=document.querySelector('.comm-nav [data-type-nav="all"]');
    if(age){ age.value=''; if(age.onchange)age.onchange.call(age); } if(pl){ pl.value=''; if(pl.onchange)pl.onchange.call(pl); }
    if(t0)t0.click(); if(s0)s0.click(); sync();
  };
  if(age)age.addEventListener('change',badge); if(pl)pl.addEventListener('change',badge);
  document.addEventListener('click',function(e){ if(e.target.closest&&e.target.closest('[data-sort-nav],[data-type-nav]'))setTimeout(badge,0); },true);
  function place(){
    if(mq.matches){
      if(q.parentNode!==top){ top.appendChild(q); top.appendChild(btn); }
      if(age&&age.parentNode!==cfsSel){ cfsSel.appendChild(age); if(pl)cfsSel.appendChild(pl); }
    }else{
      if(q.parentNode===top){ bar.insertBefore(q,bar.firstChild); btn.remove(); }
      if(age&&age.parentNode===cfsSel){ filters.insertBefore(age,filters.firstChild); if(pl)filters.insertBefore(pl,age.nextSibling); }
      close();
    }
    badge();
  }
  place();
  if(mq.addEventListener)mq.addEventListener('change',place); else if(mq.addListener)mq.addListener(place);
})();
</script>
<style id="ps-2598-desk">/* 2.598 — 커뮤니티 데스크톱: 탐색·콘텐츠 유형 칩 줄 둘은 검색줄의 고르개 둘(«추천·최신 ▾» «전체 자료 ▾»)로, 위 띠에는 «훈련 주제» 줄만. 칩의 알약 테두리는 걷고(채움만), 카드 통계 아이콘 13 → 14 · 좋아요 숫자도 tabular. 원래 버튼을 대리 클릭. */
@media (min-width:561px){
html body .comm-nav .nav-sec.ps-ph-hide:not(#_):not(#__){display:none!important}
html body .comm-nav:not(#_):not(#__){padding:10px 16px!important;border-radius:16px 16px 0 0!important}
html body .comm-nav .nav-items button:not(#_):not(#__),html body .comm-nav .nav-items .chip:not(#_):not(#__){border-color:transparent!important;background:var(--panel2,#F4F5F7)!important;color:var(--text-2,#646A73)!important}
html body .comm-nav .nav-items button.on:not(#_):not(#__),html body .comm-nav .nav-items .chip.on:not(#_):not(#__){background:var(--act-soft,#EEF3FF)!important;color:var(--c-act,#3A6DF0)!important}
html body .filters .filt.ps-cf:not(#_):not(#__){max-width:150px}
}
html body .stat svg:not(#_):not(#__),html body .likebtn svg:not(#_):not(#__){width:14px!important;height:14px!important;stroke-width:1.8}
html body .likebtn:not(#_):not(#__){font-variant-numeric:tabular-nums}
</style>
<script>
/* 2.598 — 데스크톱 고르개 둘: 탐색(정렬)·콘텐츠 유형 */
(function(){
  var filters=document.querySelector('.comm-list .filters'), seg=document.getElementById('commViewSeg'); if(!filters)return;
  function mk(id,attr,label){
    var s=document.createElement('select'); s.className='filt ps-cf'; s.id=id; s.setAttribute('aria-label',label);
    function opts(){ var h='',cur=''; [].forEach.call(document.querySelectorAll('.comm-nav ['+attr+']'),function(o){ var v=o.getAttribute(attr); h+='<option value="'+v+'">'+o.textContent.trim()+'</option>'; if(o.classList.contains('on'))cur=v; }); if(h!==s.__h){s.innerHTML=h;s.__h=h;} if(cur)s.value=cur; }
    s.onchange=function(){ var o=document.querySelector('.comm-nav ['+attr+'="'+s.value+'"]'); if(o)o.click(); setTimeout(opts,0); };
    s.__sync=opts; opts(); return s; }
  var a=mk('cfSortSel','data-sort-nav','탐색'), b=mk('cfTypeSel','data-type-nav','콘텐츠 유형');
  filters.insertBefore(a, seg||null); filters.insertBefore(b, seg||null);
  document.addEventListener('click',function(e){ if(e.target.closest&&e.target.closest('[data-sort-nav],[data-type-nav]'))setTimeout(function(){a.__sync();b.__sync();},0); },true);
})();
</script>
</body>
