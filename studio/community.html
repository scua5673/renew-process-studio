function sanSvg(s){

/* 3.039 — 재생(▶)은 썸네일 SVG 를 실제 화면 DOM 에 올린다. 문자열을 innerHTML 로 넣지 않고(정규식 정화만으로는 브라우저 파서와 어긋날 수 있다 —

/* 피드 단기 캐시 — 같은 탭에서 60초 안 재방문은 서버를 다시 부르지 않는다(동시 사용자 확장 대비).
   발행·삭제 등 변경 후엔 fetchPosts(true)로 캐시를 깨고 새로 받는다. */
var FEED_TTL=60000,FEED_CK='ps_comm_feed_cache_v1';
function fetchPosts(force){ cmStage('cmFF');
  var b=base();
  var grid=$('grid');
  if(!b){if(tabF==='coach')grid.innerHTML='<div class="empty"><b>커뮤니티에 연결할 수 없어요</b>네트워크 연결을 확인해 주세요.</div>';return;}   /* 3.071 — 다른 칸을 보는 중이면 덮지 않는다(아래 catch 와 같은 규칙) */
  if(force){try{sessionStorage.removeItem(FEED_CK)}catch(_){}
    elmStale();}   /* 3.018 — 올리기·고치기·지우기 뒤에는 엘미하 칸도 새로 받는다 */
  else{
    try{var c=JSON.parse(sessionStorage.getItem(FEED_CK)||'null');
      if(c&&c.sort===sort&&Array.isArray(c.posts)&&Date.now()-c.at<FEED_TTL){posts=c.posts;ready=true;fetchMyLikes().then(render);return;}
    }catch(_){}
  }
  var withLikes = sort==='likes';
  var order = withLikes?'likes.desc,created_at.desc' : sort==='views'?'views.desc,created_at.desc' : sort==='copies'?'copies.desc,created_at.desc' : 'created_at.desc';
  function run(cols,ord){ return fetch(b+'/rest/v1/ps_community?select='+cols+'&deleted=eq.false&order='+ord+'&limit=100',{headers:hd()}); }
  function done(j){ if(j){ posts=j; ready=true;
    try{sessionStorage.setItem(FEED_CK,JSON.stringify({at:Date.now(),sort:sort,posts:j}))}catch(_){}
    fetchMyLikes().then(render); } }
  /* 2.068 — 응답이 늦을 때 20초 가까이 빈칸이던 것을 없앤다(빈 화면 없음) */
  if(tabF==='coach')grid.innerHTML='<div class="empty loading"><b>커뮤니티를 불러오는 중…</b></div>';
  run(COMM_FULL,order).then(function(r){
    if(r.status===404){tableMissing=true;render();return null;}
    if(r.status===400){ /* likes 컬럼 미마이그레이션 — likes 없이 재시도 */
      return run(COMM_LEAN,'created_at.desc').then(function(r2){ if(!r2.ok)throw r2.status; return r2.json(); });
    }
    if(!r.ok)throw r.status; return r.json();
  }).then(done)
  .catch(function(code){
    if(tabF!=='coach')return;   /* 2.999 — 프로세스(3.018 · 엘미하) 칸을 보는 중이면 그 위에 그리지 않는다(코치 자료로 돌아오면 다시 받는다) */
    /* 2.068 — "불러오지 못했어요" 한 줄로는 사용자도 우리도 원인을 알 수 없었다(2026-08-20 백엔드 무응답 사고).
       원인을 이름으로 부르고, 다시 시도를 준다. 브라우저는 CORS 헤더 없는 오류 페이지(예: Cloudflare 522)를
       거절로 돌려줘 상태 코드를 못 읽는다 — 그때는 navigator.onLine 으로 내 인터넷과 서버를 가른다. */
    var n=(typeof code==='number')?code:0, t;
    if(n===401)t=['로그인이 만료됐어요','다시 로그인하면 커뮤니티가 보여요.'];
    else if(n===403)t=['볼 권한이 없어요','관리자에게 문의해 주세요.'];
    else if(n>=500||n===0&&navigator.onLine)t=['서버가 응답하지 않아요','커뮤니티 서버가 잠시 멈춰 있어요. 잠시 뒤 다시 시도해 주세요.'];
    else if(n===0)t=['인터넷이 끊겼어요','연결을 확인하고 다시 시도해 주세요.'];
    else t=['불러오지 못했어요','잠시 후 다시 시도해 주세요.'];
    grid.innerHTML='<div class="empty"><b>'+t[0]+'</b>'+t[1]
      +'<div class="empty-act"><button type="button" id="commRetry">다시 시도</button>'
      +(n?'<small>오류 '+n+'</small>':'')+'</div></div>';
    var rb=document.getElementById('commRetry');
    if(rb)rb.onclick=function(){ fetchPosts(true); };   /* 누르면 곧바로 위 로딩 상자로 바뀐다 */
  });
}
function paintLike(btn,liked,count){ if(!btn)return; btn.classList.toggle('on',!!liked); btn.innerHTML=IC_HEART+'<span class="lc">'+(+count||0)+'</span>'; }
function toggleLike(p,btn){
  var me=sess();
  if(!me||!me.at){ toast('좋아요는 로그인 후 가능해요'); return; }
  if(btn&&btn._busy)return; if(btn)btn._busy=true;
  var was=myLikes.has(p.id);
  if(was){ myLikes.delete(p.id); p.likes=Math.max(0,(p.likes||0)-1); } else { myLikes.add(p.id); p.likes=(p.likes||0)+1; }
  paintLike(btn, myLikes.has(p.id), p.likes);   /* 낙관적 반영 */
  fetch(base()+'/rest/v1/rpc/ps_comm_like',{method:'POST',headers:hd(me.at),body:JSON.stringify({pid:p.id})})
    .then(function(r){ if(!r.ok)throw 0; return r.json(); })
    .then(function(j){ var row=Array.isArray(j)?j[0]:j; if(row){ if(row.liked)myLikes.add(p.id); else myLikes.delete(p.id); p.likes=row.likes; paintLike(btn,row.liked,row.likes); } if(btn)btn._busy=false; })
    .catch(function(){ if(was){ myLikes.add(p.id); p.likes=(p.likes||0)+1; } else { myLikes.delete(p.id); p.likes=Math.max(0,(p.likes||0)-1); } paintLike(btn,myLikes.has(p.id),p.likes); if(btn)btn._busy=false; toast('좋아요 처리 실패 — 다시 시도해 주세요'); });

function cpDescOf(p){
  var it=p.item||{},parts=[];
  if(p.summary&&String(p.summary).trim())parts.push(esc(String(p.summary).trim()));
  [['overview','개요'],['setup','준비'],['func','진행'],['coaching','코칭 포인트'],['prog','발전'],['memo','메모']].forEach(function(f){
    var v=it[f[0]];if(v&&String(v).trim())parts.push('<b>'+f[1]+'</b>'+esc(String(v).trim()));
  });
  /* 작전판 게시물 — 설명은 담긴 훈련들(trainings[]) 안에 있다 */
  if(Array.isArray(it.trainings)&&it.trainings.length){
    it.trainings.slice(0,4).forEach(function(tr){
      if(!tr)return;
      var line=[tr.overview,tr.func,tr.coaching,tr.setup].map(function(v){return v&&String(v).trim()}).filter(Boolean)[0]||'';
      if(tr.name||line)parts.push('<b>'+esc(tr.name||'훈련')+'</b>'+esc(line));
    });
    if(it.trainings.length>4)parts.push('<i style="color:var(--text-3);font-style:normal">＋ 훈련 '+(it.trainings.length-4)+'개 — 큰 화면에서 전체 확인</i>');
  }
  if(it.note&&String(it.note).trim())parts.push(esc(String(it.note).trim()));
  var _pgN=boardPagesOf(it).length;   /* 3.039 — 여러 페이지 작전판 */
  if(_pgN>1||(it.type==='meeting'&&_pgN))parts.push('<b>'+(it.type==='meeting'?'미팅 자료':it.book?'패턴북':'작전판')+'</b>'+boardUnit(it)+_pgN+(it.type==='meeting'?'장':'개')+' — 큰 화면에서 '+boardUnit(it).trim()+'를 골라 볼 수 있어요');
  return parts.join('<br>');
}

var mask=$('mask'),modal=$('modal');
var __communityLibraryEpoch=0,__communityLibraryFlow=false,__communityLibraryAbort=null,__communityLibraryUnlockedLast=null,__communityLibraryForcedLock=false;
function communityLibraryCloseFlow(){
  __communityLibraryEpoch++;
  try{if(__communityLibraryAbort)__communityLibraryAbort.abort();}catch(_){}__communityLibraryAbort=null;
  window.__upPreselect=null;
  if(__communityLibraryFlow){try{mask.classList.remove('on');modal.innerHTML='';}catch(_){}}
  __communityLibraryFlow=false;
}
function communityLibraryBeginFlow(){
  communityLibraryCloseFlow();
  __communityLibraryFlow=true;
  return __communityLibraryEpoch;
}
function communityLibraryRequireUnlocked(showGuide){
  if(communityLibraryDataUnlocked())return true;
  communityLibraryCloseFlow();
  if(showGuide)toast('보관함은 로그인하고 데이터 준비가 끝난 뒤 사용해 주세요');
  return false;
}
function communityLibraryContinuation(flowEpoch,uid){
  var me=sess();
  if(flowEpoch!==__communityLibraryEpoch||!communityLibraryDataUnlocked()||!me||!me.uid||me.uid!==uid){
    if(!communityLibraryDataUnlocked())communityLibraryCloseFlow();
    throw communityLibraryLockedError();
  }
  return true;
}
function communityLibraryAuthChanged(forced){
  var raw=communityLibraryRawDataUnlocked();
  if(forced===false||!raw)__communityLibraryForcedLock=true;
  else if(forced===true&&raw)__communityLibraryForcedLock=false;
  var unlocked=!__communityLibraryForcedLock&&raw;
  if(!unlocked)communityLibraryCloseFlow();
  __communityLibraryUnlockedLast=unlocked;
}
mask.addEventListener('click',function(e){if(e.target===mask){if(__communityLibraryFlow)communityLibraryCloseFlow();else mask.classList.remove('on');if(window.mvStop)mvStop();}});

function mvMarks(marks){return (marks||[]).map(function(m){
  if(m.t==='pen')return '<polyline stroke="'+esc(m.c)+'" points="'+esc(m.pts)+'"/>';
  if(m.t==='arrow'||m.t==='dash')return '<path stroke="'+esc(m.c)+'"'+(m.t==='dash'?' stroke-dasharray="2.2 1.6"':'')+' d="'+esc(m.d)+'"/>';
  if(m.t==='circle')return '<ellipse stroke="'+esc(m.c)+'" cx="'+(+m.cx||0)+'" cy="'+(+m.cy||0)+'" rx="'+(+m.rx||0)+'" ry="'+(+m.ry||0)+'"/>';

function mvColor(colors,side){
  var c=colors&&colors[side];

}
/* v310 — 발행된 유니폼(단색·세로줄·가로줄)을 그대로 재현 */
function mvKitCss(mi,side){
  var k=(mi&&mi.kits&&mi.kits[side])||{};
  var c1=/^#[0-9a-fA-F]{3,8}$/.test(String(k.c1||''))?k.c1:mvColor(mi&&mi.colors,side);
  var c2=/^#[0-9a-fA-F]{3,8}$/.test(String(k.c2||''))?k.c2:'#FFFFFF';
  if(k.pat==='vstripe')return 'repeating-linear-gradient(90deg,'+c1+' 0 20%,'+c2+' 20% 40%)';
  if(k.pat==='hstripe')return 'repeating-linear-gradient(0deg,'+c1+' 0 20%,'+c2+' 20% 40%)';
  return c1;
}
function mvKitNum(mi,side){

function mvPct(v){ v=+v; return isFinite(v)?v:50; }
function mvPitchHtml(sc,idx,mi){
  var f0=(sc.tvFrames&&sc.tvFrames[0])||{p:{}};
  return '<div class="mv-pitch" data-mv="'+idx+'">'+MV_LINES
    +(sc.tvPlayers||[]).map(function(pl){
      var q=(f0.p||{})[pl.side+':'+pl.pid]||{x:50,y:50};
      return '<div class="mv-token '+(pl.side==='home'?'home':'away')+'" data-k="'+esc(pl.side+':'+pl.pid)+'" style="left:'+(+q.x||50)+'%;top:'+(+q.y||50)+'%;background:'+mvKitCss(mi,pl.side)+';color:'+mvKitNum(mi,pl.side)+'">'+esc(pl.num||'')+(pl.name?'<label>'+esc(pl.name)+'</label>':'')+'</div>';}).join('')
    +(f0.ball?'<div class="mv-ball" style="left:'+mvPct(f0.ball.x)+'%;top:'+mvPct(f0.ball.y)+'%"></div>':'')
    +'<svg class="mv-marks" viewBox="0 0 100 100" preserveAspectRatio="none">'+mvMarks(f0.marks)+'</svg>'
    +((sc.tvFrames||[]).length>1?'<button class="mv-play" type="button" aria-label="장면 재생">▶</button>':'')
    +'</div>';}
function mvApply(host,f){
  [].forEach.call(host.querySelectorAll('.mv-token'),function(t){var q=(f.p||{})[t.dataset.k];if(q){t.style.left=q.x+'%';t.style.top=q.y+'%';}});
  var b=host.querySelector('.mv-ball');if(b){if(f.ball){b.style.display='';b.style.left=f.ball.x+'%';b.style.top=f.ball.y+'%';}else b.style.display='none';}
  var mk=host.querySelector('.mv-marks');if(mk)mk.innerHTML=mvMarks(f.marks);}
function mvRun(host,frames){
  mvStop();host.classList.remove('anim');mvApply(host,frames[0]);
  if(frames.length<2)return;
  var i=0;
  _mvTimers.push(setTimeout(function step(){host.classList.add('anim');i++;
    if(i>=frames.length){_mvTimers.push(setTimeout(function(){host.classList.remove('anim');mvApply(host,frames[0]);},900));return;}
    mvApply(host,frames[i]);_mvTimers.push(setTimeout(step,980));},450));}

/* ── 담기 → 내 보관함(cs_drill_lib_v1, 로컬) — 로그인·데이터 해제 후만 ── */
var LIB_KEY='cs_drill_lib_v1';
var libStore={
  get:function(k){if(!communityLibraryDataUnlocked())return Promise.reject(communityLibraryLockedError());return window.storage?window.storage.get(k).then(function(r){if(!communityLibraryDataUnlocked())throw communityLibraryLockedError();return r?JSON.parse(r.value):null;}):Promise.resolve(null);},
  set:function(k,v){if(!communityLibraryDataUnlocked())return Promise.reject(communityLibraryLockedError());return window.storage?window.storage.set(k,JSON.stringify(v)):Promise.resolve();}
};
var COPY_FIELDS=['name','focus','minutes','sets','rpe','tags','type','snap','scenes','frames','overview','setup','func','coaching','prog','memo','memoQuick','success','fourDs','playerTask','sessionCheck','playerReflection','evidence','summaryLine','coachReflection','nextSession','warmFor',
  'pages','book','slides','ages','gmPhases','gmPhaseNames'];   /* 3.042 — 미팅 자료의 슬라이드(올릴 때는 stripSlides) */   /* 3.039 — 작전판의 페이지 묶음 · 패턴북 표식. 올릴 때는 stripPages 를 거친 것으로 바꾼다 */
function copyToLib(p,btn){
  if(p&&p.proc){procSave(p);return;}
  if(!communityLibraryRequireUnlocked(true))return;
  var me=sess(),flowEpoch=__communityLibraryEpoch,uid=me&&me.uid;
  if(btn){btn.disabled=true;btn.textContent='담는 중…';}
  libStore.get(LIB_KEY).then(function(lib){
    communityLibraryContinuation(flowEpoch,uid);
    lib=Array.isArray(lib)?lib:[];
    var src=p.item||{}, d={};
    COPY_FIELDS.forEach(function(k){if(src[k]!=null)d[k]=src[k];});
    if(src.trainings)d.trainings=src.trainings;   /* 다중 훈련·텍스트 보존 */
    sanThumbsDeep(d);   /* 3.105 — 장면·훈련마다의 그림도 담기 전에 정리 */
    d.name=d.name||p.title; d.focus=d.focus||(TX?TX.focusOfPost(p):'tech');if(!d.ages&&p.age)d.ages=catKeys(p.age);if(TX&&!(d.gmPhases||[]).length){var g=TX.subsOfPost(p);if(g.ids.length){d.gmPhases=g.ids;d.gmPhaseNames=g.names;}} d.type=d.type||'train';
    d.thumb=sanSvg(p.thumb)||'';

/* ══ 3.018 · 커뮤니티 안의 «엘미하» 칸 ══
   사용자 «프로세스 스튜디오 앱 커뮤니티에 엘미하의 전술노트(유튜브 @ELMIHA_TacticalNote) 넣으려고 해 · 지금 프로세스 스튜디오로 콘텐츠를 만들고 있어»

   · 엘미하 글은 코치 자료 칸에도 그대로 보인다(코치 자료 = 모든 코치의 글). «올리기»는 엘미하 계정으로 볼 때만 이 칸에 있다. ══ */
/* ── 3.018 · 엘미하 칸 순수 구간 시작(단위 테스트가 잘라 쓴다) ── */
var ELM_UID='33a9d4e2-1868-40f4-8f82-3ebb4ecf011e',ELM_MAX=200;
function elmPath(cols){ return '/rest/v1/ps_community?select='+cols+'&owner=eq.'+ELM_UID+'&deleted=eq.false&order=created_at.desc&limit='+ELM_MAX; }
/* 서버 답 → 엘미하 계정의 글만. 서버가 owner 로 걸러 주지만 받는 쪽에서도 한 번 더 본다(다른 계정 글 · 모양이 다른 줄 · 같은 글 두 번은 버린다). */
function elmRead(j){
  if(!Array.isArray(j))return null;
  var out=[],seen={};
  for(var i=0;i<j.length&&out.length<ELM_MAX;i++){ var p=j[i];
    if(!p||typeof p!=='object'||typeof p.id!=='string'||!p.id||p.owner!==ELM_UID||p.deleted===true||Object.prototype.hasOwnProperty.call(seen,p.id))continue;
    seen[p.id]=1; out.push(p); }
  return out;
}
/* 정렬 — 서버는 최신순으로 준다. 조회 · 좋아요 · 담김 순은 여기서(같은 수면 최신이 앞) */
function elmSort(list,k){
  var a=(list||[]).map(function(p,i){ return {p:p,i:i}; });
  if(k==='views'||k==='likes'||k==='copies')a.sort(function(x,y){ return ((+y.p[k]||0)-(+x.p[k]||0))||(x.i-y.i); });
  return a.map(function(o){ return o.p; });
}

function elmFetch(force){ cmStage('cmEF');
  var b=base();

      if(c&&Date.now()>=c.at&&Date.now()-c.at<ELM_TTL){ var l0=elmRead(c.posts); if(l0){ elmSet(l0,c.at); return; } } }catch(_){}
  }
  var seq=++elmSeq; elm.loading=true; elm.err='';
  if(tabF==='elmiha'&&!elm.ready)render();
  var run=function(cols){ return fetch(b+elmPath(cols),{headers:hd()}); };
  run(COMM_FULL).then(function(r){
    if(r.status===400)return run(COMM_LEAN).then(function(r2){ if(!r2.ok)throw r2.status; return r2.json(); });   /* likes 컬럼 미마이그레이션 — 코치 자료와 같은 재시도 */
    if(!r.ok)throw r.status; return r.json();
  }).then(function(j){
    if(seq!==elmSeq)return;   /* 그사이 새로 받기 시작했다 — 늦게 온 옛 답은 버린다 */
    var l=elmRead(j); if(!l)throw 'shape';

    try{ sessionStorage.setItem(ELM_CK,JSON.stringify({at:Date.now(),posts:l})); }catch(_){}
    elmSet(l,Date.now());
  }).catch(function(){
    if(seq!==elmSeq)return;
    elm.loading=false; if(elm.ready)return;   /* 이미 그린 목록이 있으면 그대로 둔다 */

/* ══ 2.999 · 커뮤니티 안의 «프로세스» 칸 ══
   사용자 «프로세스 스튜디오 커뮤니티에 훈련레터에 있는 훈련들 자동으로 올라가게» → «만든 훈련들 전부 커뮤니티에 따로 프로세스 페이지 만들어서 올려줘» → 목업 A안
   (세션 한 장에 훈련 셋). 머리의 두 칸 «코치 자료 | 프로세스». 프로세스 칸은 보는 곳이다 — 올리기·좋아요·조회·담김 숫자는 코치 자료에만 있다.

function procEnsure(p){
  if(p.item)return Promise.resolve(p.item);
  if(p.__load)return p.__load;
  /* 3.003 — 목록을 읽은 곳에서 받고, 그 사이트가 그사이 닫혔으면 사본에서 받는다. 어디서 받았는지(p.src)는 «보관함에 담기»가 같은 곳을 읽게 적어 둔다. */
  var get=function(src){ var ab=procAbort(15000);
    return fetch(procUrl('pack',p.s,null,src),{credentials:'omit',redirect:'error',referrerPolicy:'no-referrer',signal:ab.signal})
      .then(function(r){ if(!r.ok)throw new Error('http '+r.status); return r.text(); })
      .then(function(txt){ ab.done(); if(txt.length>PROC_PACK_MAX)throw new Error('big');
        var it=procItem(JSON.parse(txt),p.s,{fields:COPY_FIELDS,snap:stripSnap,trainings:stripTrainings,frames:stripFrames}); if(!it)throw new Error('shape');
        return {it:it,src:src}; },function(e){ ab.done(); throw e; }); };
  var first=procSrcOf(p.s,proc.src);   /* 3.019 — 앱이 보강한 세션은 사본에서 */
  p.__load=get(first).catch(function(e){ if(first===PROC_LOCAL_SRC)throw e; return get(PROC_LOCAL_SRC); })
    .then(function(o){ p.__load=null; p.item=o.it; p.src=o.src; return o.it; },function(e){ p.__load=null; throw e; });

/* 상세 — 세션(3.002 부터 훈련이 둘 이상인 코치 글도)의 훈련을 하나씩 읽기 전용 뷰어에 싣는다. 뷰어(작전판)는 커뮤니티에서 훈련 탭 줄을 감추므로(body.comm-viewing #trainingStrip)
   고르는 줄은 뷰어 머리 바로 아래 여기에 둔다. 훈련을 바꾸면 뷰어를 새로 연다 — 글마다 프레임을 새로 만드는 것과 같은 이유(앞 훈련의 애니메이션·판 상태가 남지 않게). */
var procCv=null;

function procViewPost(k){

/* 3.039 — 여러 페이지 작전판 글(사용자 «엘미하 페이지 작전판으로 업로드 할 수 있게»): 훈련 고르기 줄과 같은 자리 · 같은 방식으로 페이지를 고른다.
