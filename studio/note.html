<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<script src="storage.js"></script>

<title>개인 노트</title>
<link rel="stylesheet" href="/vendor/fonts.css?v=2.552b"><link rel="stylesheet" href="/vendor/tokens.css?v=2.552b">
<style>
  b,strong{font-weight:var(--fw-head)}   /* 브라우저 기본 bold=700 차단 — 무게는 600·800만 */
:focus-visible{outline:2px solid #3a6df0 !important;outline-offset:2px;border-radius:6px;}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea{-webkit-user-select:text;user-select:text}
  /* UI 규칙: 레포 UI-가이드.md — 색은 의미로만(보라=목표·초록=완료·빨강=경고·파랑=코치), 이모지 금지(라인 SVG), 무게 600/800 */
/* --bar2 는 노트 자체는 안 쓰지만 storage.js 의 저장 위험 배너가 바탕색으로 쓴다.
   여기 없으면 폴백(#F1F2F4)으로 굳어서 다크모드에서 배너만 밝은 회색으로 남는다(팀·IDP엔 원래 있다). */
:root{--bg:#ECEDF0;--bar:#fff;--bar2:#F1F2F4;--line:#E3E6EA;--txt:#14161A;--dim:#646A73;--blue:#3a6df0;--blue-soft:#edf2fe}
html,body{height:100%;overflow:hidden;overscroll-behavior:none;background:var(--bg);font-family:'Pretendard Variable','Pretendard',-apple-system,BlinkMacSystemFont,system-ui,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:var(--txt);line-height:1.5}
body{display:flex;flex-direction:column}
/* 독립 개인 도구 헤더 — 필기·메모는 팀 보관함과 공유 범위가 다르다. */
.nhead{flex:0 0 auto;display:flex;align-items:center;gap:9px;height:52px;box-sizing:border-box;padding:0 20px;background:var(--bar);border-bottom:1px solid var(--line)}
.nhead .nh-t{font-size:var(--fs-h2);font-weight:var(--fw-head);letter-spacing:-.3px;color:var(--txt)}
.nhead .nh-s{font-size:var(--fs-sub);font-weight:var(--fw-body);color:var(--faint)}
.nhead .nh-seg{margin-left:10px;display:inline-flex;align-items:center;padding:2px;gap:2px;border:1px solid var(--line);border-radius:11px;background:var(--panel2,#F1F2F4);overflow-x:auto;scrollbar-width:none;max-width:min(100%,430px)}/* 2.247 — 자료 탭 세그와 같은 테두리 */
.nhead .nh-seg::-webkit-scrollbar{display:none}
.nhead .nh-seg button{height:32px;padding:0 12px;border:0;border-radius:6px;background:transparent;color:var(--txt-dim,#646A73);font-family:inherit;font-size:12px;font-weight:600;white-space:nowrap;cursor:pointer}
.nhead .nh-seg button.on{background:var(--panel,#fff);color:var(--txt);box-shadow:0 1px 2px var(--sh10,rgba(16,24,40,.10))}
@media (max-width:640px){.nhead .nh-s{display:none}}
.vault-personal-scope{margin-left:auto;display:inline-flex;align-items:center;gap:5px;color:var(--dim);font-size:var(--fs-caption);font-weight:var(--fw-body);white-space:nowrap}
.vault-personal-scope svg{width:13px;height:13px;flex:0 0 auto}
.vault-personal-scope .scope-short{display:none}
body.fmdark .nhead{background:#1B1E23}
body.fmdark .nhead .nh-s{color:#78818D}
.bar{position:relative;flex:0 0 auto;display:flex;align-items:center;gap:7px;padding:8px 20px;background:var(--bar);border-bottom:1px solid var(--line);flex-wrap:wrap;overflow:visible}
.bar input[type=text]{border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:var(--fs-body);font-weight:var(--fw-body);font-family:inherit;flex:1 1 130px;min-width:110px;background:var(--bar2)}
.bar select{border:1px solid var(--line);border-radius:10px;padding:6px 8px;font-size:var(--fs-body);font-family:inherit;background:var(--surface)}
.seg{display:flex;background:var(--bar2);border:1px solid var(--line);border-radius:10px;padding:2px;gap:2px}
.seg button{border:0;background:transparent;color:var(--dim);font-weight:var(--fw-body);font-size:var(--fs-body);padding:6px 11px;border-radius:10px;cursor:pointer;font-family:inherit}
.seg button.on{background:var(--surface);color:var(--txt);box-shadow:0 1px 2px var(--sh1,rgba(16,24,40,.1))}
.cols{display:flex;gap:5px;align-items:center}
.cols button{width:24px;height:24px;border-radius:50%;border:2px solid transparent;cursor:pointer}
.cols button.on{border-color:var(--txt);box-shadow:0 0 0 2px #fff inset}
.cols input.custcol{width:24px;height:24px;border-radius:50%;border:2px dashed #c2c8d2;padding:0;cursor:pointer;background:var(--surface);-webkit-appearance:none;appearance:none;overflow:hidden}
.cols input.custcol::-webkit-color-swatch-wrapper{padding:2px}
.cols input.custcol::-webkit-color-swatch{border:none;border-radius:50%}
.cols input.custcol.on{border:2px solid var(--txt)}
.icb{border:1px solid var(--line);background:var(--surface);border-radius:8px;width:32px;height:32px;cursor:pointer;font-size:var(--fs-body);font-weight:var(--fw-body);color:var(--txt);display:inline-flex;align-items:center;justify-content:center;font-family:inherit}
.icb:disabled{opacity:.45}
.icb.on{background:var(--blue);border-color:var(--blue);color:#fff}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 11px;cursor:pointer;font-size:var(--fs-body);font-weight:var(--fw-body);color:var(--txt);font-family:inherit;white-space:nowrap}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.filewrap{position:relative;display:inline-flex}
.filemenu{display:none;position:absolute;right:0;top:calc(100% + 6px);z-index:120;flex-direction:column;gap:4px;padding:6px;background:var(--bar);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 30px var(--sh16,rgba(16,24,40,.16))}
.filewrap.open .filemenu{display:flex}
.filemenu .btn{border:0;text-align:left;padding:8px 12px;white-space:nowrap}
.filemenu .btn:hover{background:rgba(58,109,240,.10)}
body.fmdark .filemenu{box-shadow:0 12px 30px rgba(0,0,0,.5)}
body.fmdark .filemenu .btn:hover{background:rgba(111,148,245,.16)!important}
.sp{flex:1 1 auto}
.szwrap{display:flex;align-items:center;gap:5px}
.szwrap input{width:74px}
.pg{display:flex;align-items:center;gap:4px;font-size:var(--fs-sub);font-weight:var(--fw-body);color:var(--dim)}
.note-core,.note-ink,.note-advanced{display:flex;align-items:center;gap:7px;min-width:0}
.note-core{flex:0 1 auto}.note-ink{flex:0 1 auto}.note-advanced{flex:1 1 auto;justify-content:flex-end;flex-wrap:wrap}
/* 1.707 — 배경 양식: 버튼 하나 + 팝오버 그리드. */
.nTplWrap{position:relative;flex:0 0 auto}
.nTplBtn{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;max-width:190px}
.nTplBtn #nTplBtnCur{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nTplCaret{color:var(--dim);font-size:11px;flex:0 0 auto}
.tplp{position:absolute;top:calc(100% + 6px);right:0;z-index:60;background:var(--bar);border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 36px var(--sh20,rgba(16,24,40,.20));padding:8px;width:min(324px,88vw)}
.tplp[hidden]{display:none}
.tplp-note{font-size:11px;line-height:1.4;color:var(--dim);background:var(--bar2);border-radius:8px;padding:7px 9px;margin:0 0 8px}
.tplp-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tplp-cell{display:flex;flex-direction:column;align-items:center;gap:4px;border:1px solid var(--line);border-radius:9px;background:var(--bar2);padding:6px 4px;cursor:pointer;font:inherit}
.tplp-cell:hover{border-color:#c3c9d2}
.tplp-cell.on{border-color:var(--blue,#3a6df0);box-shadow:0 0 0 2px color-mix(in srgb,var(--blue,#3a6df0) 20%,transparent)}
.tplp-ic{width:100%;aspect-ratio:4/3;border-radius:5px;overflow:hidden;background:var(--surface);display:block}
.tplp-ic svg{width:100%;height:100%;display:block}
.tplp-lb{font-size:11px;font-weight:600;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;text-align:center}
.tplp-acts{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
.tplp-act{border:1px solid var(--line);background:var(--bar2);border-radius:8px;padding:5px 9px;font-size:11px;font-weight:600;color:var(--dim);cursor:pointer;font-family:inherit}
.tplp-act:hover{color:var(--txt)}
body.fmdark .tplp{background:#141A22;border-color:#2E333A}
body.fmdark .tplp-cell,body.fmdark .tplp-act{background:#1B1E23;border-color:#2E333A}
body.fmdark .tplp-lb{color:#F2F3F5}
#noteToolsToggle{display:none}
#stage{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;padding:10px;touch-action:none;position:relative;overflow:hidden}
#ecur{display:none;position:fixed;border:1.5px solid rgba(60,64,72,.75);background:rgba(255,255,255,.25);border-radius:50%;pointer-events:none;z-index:50;transform:translate(-50%,-50%)}
#cv{background:var(--surface);border-radius:10px;box-shadow:0 4px 18px var(--sh12,rgba(16,24,40,.12));touch-action:none;max-width:100%;max-height:100%;cursor:crosshair}
#zoomR{display:none;position:absolute;right:14px;bottom:14px;z-index:40;box-shadow:0 4px 14px var(--sh18,rgba(16,24,40,.18))}
.ovl{display:none;position:fixed;inset:0;z-index:100;background:rgba(16,24,40,.45);align-items:center;justify-content:center;padding:16px}
.ovl.on{display:flex}
.ovl .card{background:var(--surface);border-radius:16px;max-width:480px;width:100%;max-height:80vh;overflow:auto;padding:18px}
.ovl h3{font-size:var(--fs-title);font-weight:var(--fw-head);letter-spacing:-.3px;margin-bottom:10px}
/* 양식 피커 */
.ovl .card.fmcard{max-width:640px}
.fmsub{font-size:var(--fs-sub);font-weight:var(--fw-body);color:var(--dim);margin:-6px 0 12px}
.fmgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(182px,1fr));gap:8px}
.fmcat{grid-column:1/-1;font-size:var(--fs-caption);font-weight:var(--fw-head);letter-spacing:.02em;margin:8px 0 1px}
.fmcat:first-child{margin-top:0}
.fmit{display:flex;align-items:flex-start;gap:9px;text-align:left;border:1px solid var(--line);background:var(--bar);border-radius:12px;padding:10px 11px;cursor:pointer;font-family:inherit;transition:.12s}
.fmit:hover{border-color:var(--blue)}
.fmit:active{transform:scale(.98)}
.fmit .fi{flex:0 0 auto;color:var(--blue);display:inline-flex;margin-top:1px}
.fmit .fi svg{width:18px;height:18px}
.fmit .ft{min-width:0}
.fmit b{display:block;font-size:var(--fs-body);font-weight:var(--fw-head);color:var(--txt);letter-spacing:-.2px}
.fmit .ft span{display:block;font-size:var(--fs-caption);font-weight:var(--fw-body);color:var(--dim);margin-top:2px;line-height:1.4}
body.fmdark .fmit{background:#23272D;border-color:#2E333A}
/* ===== 양식 빌더 — 데스크톱·아이패드 전용(폰에선 만들기 대신 안내) ===== */
#bldOvl{display:none;position:fixed;inset:0;z-index:120;background:rgba(16,24,40,.5);padding:20px}
#bldOvl.on{display:flex;align-items:center;justify-content:center}
.bld{background:var(--bar);border-radius:16px;width:100%;max-width:1180px;height:100%;max-height:92vh;display:flex;flex-direction:column;overflow:hidden}
.bld-hd{flex:0 0 auto;display:flex;align-items:center;gap:9px;height:52px;padding:0 16px;border-bottom:1px solid var(--line)}
.bld-hd .t{font-size:var(--fs-title);font-weight:var(--fw-head);color:var(--txt)}
.bld-hd .sp{flex:1}
.bld-hd input.nm{border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--txt);font-family:inherit;font-size:var(--fs-body);font-weight:var(--fw-body);padding:7px 10px;width:190px;outline:none}
.bld-hd input.nm:focus{border-color:var(--blue)}
.bld-bd{flex:1 1 auto;min-height:0;display:flex}
.bld-l{flex:0 0 400px;display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line)}
.bld-r{flex:1 1 auto;min-width:0;display:flex;align-items:center;justify-content:center;background:var(--bg);padding:14px;overflow:auto}
.bld-pv{background:var(--surface);box-shadow:0 4px 20px var(--sh14,rgba(16,24,40,.14));border-radius:4px}
.bld-pv iframe{border:0;display:block;transform-origin:top left}
.pal{flex:0 0 auto;display:flex;flex-wrap:wrap;gap:6px;padding:12px 14px;border-bottom:1px solid var(--line)}
.pal button{border:1px solid var(--line);background:var(--bg);color:var(--txt);border-radius:10px;font-family:inherit;font-size:var(--fs-sub);font-weight:var(--fw-body);padding:7px 10px;cursor:pointer}
.pal button:hover{border-color:var(--blue);color:var(--blue)}
.blist{flex:1 1 auto;min-height:0;overflow-y:auto;padding:10px 14px 14px}
.bitem{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:7px 8px;margin-bottom:6px}
.bitem.drag{opacity:.4}
.bitem.over{border-color:var(--blue);border-style:dashed}
.bitem .gr{cursor:grab;color:var(--dim);font-size:var(--fs-body);flex:0 0 auto;padding:0 2px;user-select:none}
.bitem .bn{font-size:var(--fs-sub);font-weight:var(--fw-head);color:var(--txt);flex:0 0 52px}
.bitem input.lb{flex:1 1 auto;min-width:0;border:1px solid var(--line);border-radius:6px;background:var(--bar);color:var(--txt);font-family:inherit;font-size:var(--fs-sub);font-weight:var(--fw-body);padding:5px 7px;outline:none}
.bitem input.lb:focus{border-color:var(--blue)}
.bitem select{border:1px solid var(--line);border-radius:6px;background:var(--bar);color:var(--txt);font-family:inherit;font-size:var(--fs-caption);font-weight:var(--fw-body);padding:5px 3px;outline:none;cursor:pointer;flex:0 0 auto}
.bitem .x{border:0;background:none;color:var(--dim);font-size:var(--fs-title);font-weight:var(--fw-body);cursor:pointer;flex:0 0 auto;padding:2px 5px;border-radius:6px;font-family:inherit}
.bitem .x:hover{color:#C24A46}
.bempty{color:var(--dim);font-size:var(--fs-sub);font-weight:var(--fw-body);text-align:center;padding:34px 10px;line-height:1.7}
.bfull{margin-top:8px;font-size:var(--fs-caption);font-weight:var(--fw-body);color:var(--dim)}
.bfull.over{color:#C24A46}
body.fmdark .bitem,body.fmdark .pal button{background:#23272D}
#bldPhone{display:none;padding:30px 22px;text-align:center;color:var(--dim);font-size:var(--fs-body);font-weight:var(--fw-body);line-height:1.8}
@media (max-width:760px){                    /* 폰: 만들기는 막고 안내만 — 만들어 둔 양식 쓰기는 폰에서도 됨 */
  .bld-bd{display:none}
  #bldPhone{display:block}
  .bld{max-height:auto;height:auto}
  .bld-hd input.nm,.bld-hd #bldSave{display:none}
}
.nrow{display:flex;align-items:center;gap:10px;padding:10px 4px;border-top:1px solid var(--line)}
.nrow .nm{flex:1;min-width:0}
.nrow .nm b{font-size:var(--fs-body);display:block}
.nrow .nm span{font-size:var(--fs-caption);color:var(--dim)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:rgba(22,24,28,.92);color:#fff;font-size:var(--fs-sub);font-weight:var(--fw-body);padding:9px 16px;border-radius:999px;opacity:0;transition:.25s;pointer-events:none;z-index:200}
.toast.on{opacity:1}
@media(max-width:640px){
  .bar{padding:6px 8px;gap:5px}
  .bar input[type=text]{flex-basis:100%}
  .szwrap input{width:56px}
}





/*FMDARK*/
body.fmdark{--bg:#121417!important;--bar:#1B1E23!important;--bar2:#23272D!important;--line:#2E333A!important;--txt:#F2F3F5!important;--dim:#A9AFB8!important;--blue:#6F94F5!important;--blue-soft:rgba(111,148,245,.16)!important;background:#121417!important;color:#F2F3F5!important}
body.fmdark .btn,body.fmdark .icb{background:#1B1E23!important;border-color:#2E333A!important;color:#F2F3F5!important}
body.fmdark .icb.on{background:var(--blue)!important;border-color:var(--blue)!important;color:#fff!important}
body.fmdark .bar input[type=text]{background:#141A22!important;color:#F2F3F5!important;border-color:#2E333A!important}
body.fmdark .bar select{background:#1B1E23!important;color:#F2F3F5!important;border-color:#2E333A!important}
body.fmdark .seg{background:#141A22!important}
body.fmdark .seg button.on{background:#2E333A!important;color:#fff!important}
body.fmdark .cols button.on{box-shadow:0 0 0 2px #2E333A inset!important}
body.fmdark .btn:disabled,body.fmdark .icb:disabled{opacity:.5!important;color:#7C838D!important}
/*ENDFMDARK*/

#memoPane{display:none;flex:1 1 auto;min-height:0}
body.memo-mode #stage{display:none}
body.memo-mode #memoPane{display:flex}
body.memo-mode #nTitle,body.memo-mode #nTpl,body.memo-mode #tools,body.memo-mode #penOnly,body.memo-mode #cols,body.memo-mode .szwrap,body.memo-mode #undoB,body.memo-mode #redoB,body.memo-mode .pg,body.memo-mode #pdfB,body.memo-mode #orientB,body.memo-mode #pngB,body.memo-mode #printB,body.memo-mode #newB,body.memo-mode #libB,body.memo-mode #noteToolsToggle,body.memo-mode #nTplWrap{display:none !important}
/* 2.355 — 폴더 열 */
.memo-folders{width:172px;flex:0 0 172px;border-right:1px solid var(--line);display:flex;flex-direction:column;background:var(--bar2,var(--bar));padding:8px 6px}
.mf-list{flex:1 1 auto;overflow:auto;min-height:0}
.mf-it{display:flex;align-items:center;gap:7px;padding:8px 10px;border-radius:9px;cursor:pointer;font-size:var(--fs-body);color:var(--txt);position:relative}
.mf-it:hover{background:rgba(0,0,0,.05)}
.mf-it.on{background:var(--blue-soft);font-weight:var(--fw-head)}
body.fmdark .mf-it:hover{background:rgba(255,255,255,.07)}
body.fmdark .mf-it.on{background:#23272D}
.mf-it .n{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mf-it .c{font-size:var(--fs-caption);color:var(--dim);font-variant-numeric:tabular-nums}
.mf-it .fx{border:0;background:transparent;color:var(--dim);cursor:pointer;font-size:var(--fs-caption);opacity:0;padding:0 2px}
.mf-it:hover .fx,.mf-it.on .fx{opacity:.55}
.mf-it .fx:hover{opacity:1}
.mf-sep{height:1px;background:var(--line);margin:7px 4px}
.mf-new{margin-top:6px;padding:8px;border:1px dashed var(--line);border-radius:9px;background:transparent;color:var(--blue);font-weight:var(--fw-head);cursor:pointer;font-family:inherit;font-size:var(--fs-caption)}
/* 목록 머리 — 폴더 선택(폰) · 검색 · 정렬 */
.memo-top{display:flex;flex-direction:column;gap:6px;padding:2px 4px 8px}
.memo-top input,.memo-top select{width:100%;height:32px;border:1px solid var(--line);border-radius:6px;background:var(--panel,#fff);color:var(--txt);font:inherit;font-size:var(--fs-caption);padding:0 9px}
.memo-fsel{display:none}
.memo-sort{color:var(--dim)}
.mi-pin{color:var(--blue);font-size:var(--fs-caption);margin-right:3px}
/* 편집기 머리 */
.memo-bar{display:flex;align-items:center;gap:6px;padding:8px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.memo-bar button{border:1px solid var(--line);background:var(--panel,#fff);color:var(--txt);border-radius:6px;height:28px;padding:0 10px;font:inherit;font-size:var(--fs-caption);font-weight:var(--fw-head);cursor:pointer}
.memo-bar button.on{background:var(--blue-soft);border-color:var(--blue);color:var(--blue)}
.memo-move{height:30px;border:1px solid var(--line);border-radius:8px;background:var(--panel,#fff);color:var(--txt);font:inherit;font-size:var(--fs-caption);padding:0 8px;max-width:150px}
.memo-when{margin-left:auto;font-size:var(--fs-caption);color:var(--dim);font-variant-numeric:tabular-nums}
@media (max-width:760px){
  .memo-folders{display:none}
  .memo-fsel{display:block}
}

<script>
/* ==== PWA 안전 다이얼로그: 네이티브 confirm()/prompt() 대체 (설치형 PWA에서 차단됨) ==== */
(function(){
  if(window.psConfirm) return;
  function build(msg, withInput, def, onOk, onCancel){
    var ov=document.createElement('div');
    ov.style.cssText='position:fixed;inset:0;background:rgba(10,14,20,.45);z-index:2147483000;display:flex;align-items:center;justify-content:center;-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)';
    var dark=false; try{dark=document.body.classList.contains('fmdark');}catch(_){}
    var bx=document.createElement('div');
    bx.style.cssText='background:'+(dark?'#1C232E':'#fff')+';color:'+(dark?'#E7EBF1':'#14161A')+';border-radius:14px;box-shadow:0 18px 50px rgba(0,0,0,.35);padding:18px 18px 14px;width:min(320px,86vw);font:inherit';
    var tx=document.createElement('div');tx.style.cssText='font-size:14px;line-height:1.5;white-space:pre-wrap;margin-bottom:12px;word-break:break-word';tx.textContent=msg;bx.appendChild(tx);
    var inp=null;
    if(withInput){
      inp=document.createElement('input');inp.type='text';inp.value=(def==null?'':String(def));
      inp.style.cssText='width:100%;box-sizing:border-box;font-size:14px;padding:9px 10px;border:1.5px solid rgba(128,140,160,.45);border-radius:10px;margin-bottom:12px;background:transparent;color:inherit;outline:none';
      bx.appendChild(inp);
    }
    var row=document.createElement('div');row.style.cssText='display:flex;gap:8px;justify-content:flex-end';
    var bc=document.createElement('button');bc.type='button';bc.textContent='취소';
    bc.style.cssText='font:inherit;font-size:13px;padding:8px 14px;border-radius:10px;border:1px solid rgba(128,140,160,.35);background:transparent;color:inherit;cursor:pointer';
    var bo=document.createElement('button');bo.type='button';bo.textContent='확인';
    bo.style.cssText='font:inherit;font-size:13px;font-weight:600;padding:8px 16px;border-radius:10px;border:0;background:#3A6DF0;color:#fff;cursor:pointer';
    row.appendChild(bc);row.appendChild(bo);bx.appendChild(row);ov.appendChild(bx);
    var done=false;
    function close(){ if(done)return; done=true; document.removeEventListener('keydown',onKey,true); try{ov.remove();}catch(_){} }
    function ok(){ var v=inp?inp.value:true; close(); onOk&&onOk(v); }
    function cancel(){ close(); onCancel&&onCancel(); }
    function onKey(e){ if(e.key==='Escape'){e.stopPropagation();cancel();} else if(e.key==='Enter'){e.stopPropagation();ok();} }
    bo.onclick=ok; bc.onclick=cancel;
    ov.addEventListener('pointerdown',function(e){ if(e.target===ov) cancel(); });
    document.addEventListener('keydown',onKey,true);
    document.body.appendChild(ov);
    try{ov.animate&&ov.animate([{opacity:0},{opacity:1}],{duration:140,easing:'ease-out'});}catch(_){}
    if(inp){ try{inp.focus();inp.select();}catch(_){} }
  }
  window.psConfirm=function(msg,onOk,onCancel){ build(String(msg),false,null,function(){onOk&&onOk();},onCancel); };
  window.psPrompt=function(msg,def,onOk,onCancel){ build(String(msg),true,def,function(v){onOk&&onOk(v);},onCancel); };
})();
</script>

<script>
"use strict";
const $=id=>document.getElementById(id);
let LW=1000, LH=1414;
function applyOrient(){const l=note&&note.orient==='l';LW=l?1414:1000;LH=l?1000:1414;}
const KEY='cs_notes_v1';
const NOTE_SYNC_SAFE=1450000;
const COLORS=['#14161A','#3a6df0','#D6453D','#1D9E75'];
const HL_COLORS={'#14161A':'#FFE066','#3a6df0':'#9FD0FF','#D6453D':'#FFB3AC','#1D9E75':'#A9EBC9'};
let cv=$('cv');
let ctx=cv.getContext('2d',{desynchronized:true})||cv.getContext('2d');
let base=document.createElement('canvas'), bctx=base.getContext('2d');
let note=null, pi=0, tool='pen', color=COLORS[0], size=3;
const SIZES={pen:3,pencil:3,hl:3,eraser:18,text:18};
const SIZE_RANGE={pen:[1,14,0.5],pencil:[1,14,0.5],hl:[1,14,0.5],eraser:[8,72,2],text:[12,44,2]};
let live=null, redoStack=[], saveTimer=null;
let penOnly=false, penSeen=false;

function uid(){return 'n'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
/* 1.504 — 노트를 IndexedDB로 이사.
   필기·PDF는 계속 쌓이는데 localStorage는 앱 전체가 5MB를 나눠 쓰는 곳이라, 노트 하나가 1MB를 넘어가며
   "저장 공간 부족"이 눈앞이었다(보관함이 v309에 겪은 것과 같은 문제).
   화면 코드는 store()/persist()를 동기로 부르므로, 메모리 사본을 정본처럼 두고 저장만 비동기로 넘긴다.
   부팅 때 IndexedDB를 다 읽기 전에는 화면을 시작하지 않는다(먼저 그리면 빈 노트를 저장해 덮어쓴다). */
var _noteMem=null,_noteWrite=Promise.resolve();
function store(){
  if(_noteMem)return _noteMem;
  try{ _noteMem=JSON.parse(localStorage.getItem(KEY))||{notes:{},cur:null}; }catch(_){ _noteMem={notes:{},cur:null}; }
  return _noteMem;
}
function persist(s){
  _noteMem=s;
  var str;try{ str=JSON.stringify(s); }catch(_){ return false; }
  if(str.length>NOTE_SYNC_SAFE){var wn=Date.now();if(!persist._syncWarn||wn-persist._syncWarn>30000){persist._syncWarn=wn;toast('이 기기에는 저장되지만 동기화 용량이 찼어요 — 오래된 PDF 문서를 정리해 주세요');}}
  if(window.storage){
    /* 큰 PDF 사본 저장과 400ms 필기 저장이 역순으로 끝나지 않도록 직렬화한다. */
    _noteWrite=_noteWrite.catch(function(){}).then(function(){return window.storage.set(KEY,str);});
    _noteWrite.then(function(){
      try{window.PSSaveState.ok('note');}catch(__){}
      /* IndexedDB 저장이 확인된 뒤에만 옛 사본을 지운다 — 순서가 바뀌면 한 번의 실패로 노트가 사라진다 */
      if(!persist._moved){persist._moved=1;try{localStorage.removeItem(KEY);}catch(__){}}
    }).catch(function(e){
      var n=Date.now();if(!persist._t||n-persist._t>15000){persist._t=n;toast('⚠︎ 저장에 실패했어요 — 필기가 저장되지 않고 있어요');}
      try{window.PSSaveState.fail('note',e);}catch(__){}
    });
    return true;
  }
  try{localStorage.setItem(KEY,str);try{window.PSSaveState.ok('note');}catch(__){}return true;}catch(e){
  // 1회 경고 후 무음이면 필기가 계속 증발하는 걸 사용자가 모름 → 15초 간격 반복 경고 + 사라지지 않는 상태 표시
  const n=Date.now();if(!persist._t||n-persist._t>15000){persist._t=n;toast('⚠︎ 저장 공간 부족 — 지금 필기가 저장되지 않고 있어요! 오래된 노트·PDF를 삭제해주세요');}
  try{window.PSSaveState.fail('note',e);}catch(__){}return false;}}
async function persistImportedState(s){
  _noteMem=s;var str=JSON.stringify(s);
  if(window.storage){
    _noteWrite=_noteWrite.catch(function(){}).then(function(){return window.storage.set(KEY,str);});
    await _noteWrite;
    try{window.PSSaveState.ok('note');}catch(__){}
    if(!persist._moved){persist._moved=1;try{localStorage.removeItem(KEY);}catch(__){}}
    return true;
  }
  localStorage.setItem(KEY,str);try{window.PSSaveState.ok('note');}catch(__){}return true;
}
/* 새 노트만 세로 피치 3면 훈련 종이로 시작한다. 기존에 필기한 노트의 tpl/orient는 절대 마이그레이션하지 않는다. */
function blankNote(){return {id:uid(),title:'',tpl:'training3vertical_land_v1',orient:'l',pages:[{strokes:[]}],created:Date.now(),updated:Date.now()};}
function save(){if(!note)return true;note.updated=Date.now();note.title=$('nTitle').value;
  const s=store();s.notes[note.id]=note;s.cur=note.id;return persist(s);}
function saveSoon(){clearTimeout(saveTimer);saveTimer=setTimeout(save,400);}
/* 2.395 — 새로고침 전에 셸이 부른다. 400ms 지연 저장이 남아 있으면 지금 쓴다(자동 업데이트로 잃지 않게).
   ⚠ 메모(memoText)는 별도 타이머를 쓰므로 그것도 함께 민다. */
var _noteLastFlushOk=true;
window.psFlushPending=function(){
  _noteLastFlushOk=true;
  try{ if(saveTimer){ clearTimeout(saveTimer); saveTimer=null; if(save()===false)_noteLastFlushOk=false; } }catch(_){_noteLastFlushOk=false;}
  try{ if(window.__memoFlush&&window.__memoFlush()===false)_noteLastFlushOk=false; }catch(_){_noteLastFlushOk=false;}
  return false;
};
/* 2.733 — 타이머를 밀어낸 것과 IndexedDB 쓰기가 끝난 것은 다르다.
   쉘의 자동 업데이트·워크스페이스 전환은 노트 전용 직렬 큐(_noteWrite)까지
   확정된 뒤에만 프레임을 내린다. 메모는 localStorage 동기 쓰기라 flush 완료가 곧 확정이다. */
window.psFlushPendingReady=function(){
  window.psFlushPending();
  if(!_noteLastFlushOk)return Promise.reject(new Error('노트 입력을 저장하지 못했습니다'));
  function waitTail(){
    var tail=_noteWrite;
    return Promise.resolve(tail).then(function(){return tail===_noteWrite?true:waitTail();});
  }
  return waitTail().then(function(){
    if(window.psHasPending())throw new Error('노트 지연 저장이 남아 있습니다');
    return true;
  });
};
window.psHasPending=function(){ try{ return !!(saveTimer||(window.__memoPending&&window.__memoPending())); }catch(_){ return false; } };
/* ⚠ 2.398 — 여기도 **화면을 떠나는 길**이 막혀 있었다. 셸의 자동 업데이트만 막으면
   홈으로 나가거나 앱을 바꿀 때 잃는다. iOS 는 visibilitychange 가 더 확실히 온다 — 둘 다 건다. */
window.addEventListener('pagehide',function(){ try{ window.psFlushPending(); }catch(_){} });
document.addEventListener('visibilitychange',function(){ if(document.visibilityState==='hidden'){ try{ window.psFlushPending(); }catch(_){} } });
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),1600);}

/* ============ 크기 ============ */
function fit(){
  if(window.__nvReset)window.__nvReset();       /* 크기·방향이 바뀌면 확대 상태는 무의미 — 원래대로 */
  const st=$('stage'),pad=20;
  const sw=st.clientWidth-pad, sh=st.clientHeight-pad;
  const sc=Math.min(sw/LW, sh/LH);
  const w=Math.max(200,LW*sc), h=LH*sc;
  const dpr=Math.min(3,window.devicePixelRatio||1);
  cv.style.width=w+'px';cv.style.height=h+'px';
  cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);
  base.width=cv.width;base.height=cv.height;
  ctx.setTransform(cv.width/LW,0,0,cv.height/LH,0,0);
  bctx.setTransform(base.width/LW,0,0,base.height/LH,0,0);
  rebuildBase();present();
}
window.addEventListener('resize',fit);

/* ============ 배경 ============ */
const bgCache={};
function drawTpl(c){
  c.save();c.fillStyle='#fff';c.fillRect(0,0,LW,LH);
  const pg=note?note.pages[pi]:null;
  if(pg&&pg.bg){
    let img=bgCache[pg.bg];
    if(!img){img=new Image();img.onload=()=>{rebuildBase();present();};img.src=pg.bg;bgCache[pg.bg]=img;}
    if(img.complete&&img.naturalWidth){
      const sc=Math.min(LW/img.naturalWidth,LH/img.naturalHeight);
      const w=img.naturalWidth*sc,h=img.naturalHeight*sc;
      c.drawImage(img,(LW-w)/2,(LH-h)/2,w,h);
    }
    c.restore();return;
  }
  const t=note?note.tpl:'blank';
  if(t&&(t.indexOf('form:')===0||t.indexOf('my:')===0)){
    const e=tplEntry(t);
    if(e.img&&e.img.complete&&e.img.naturalWidth){
      const img=e.img;
      const sc=Math.min(LW/img.naturalWidth,LH/img.naturalHeight);   /* 양식은 A4 — 잘리지 않게 contain */
      const w=img.naturalWidth*sc,h=img.naturalHeight*sc;
      c.drawImage(img,(LW-w)/2,(LH-h)/2,w,h);
    }
    c.restore();return;
  }
  if(t&&t.indexOf('paper:')===0){
    const pp=papers().find(x=>'paper:'+x.id===t);
    if(pp){let img=bgCache[t];
      if(!img){img=new Image();img.onload=()=>{rebuildBase();present();};img.src=pp.img;bgCache[t]=img;}
      if(img.complete&&img.naturalWidth){
        const sc=Math.max(LW/img.naturalWidth,LH/img.naturalHeight);
        const w=img.naturalWidth*sc,h=img.naturalHeight*sc;
        c.drawImage(img,(LW-w)/2,(LH-h)/2,w,h);}}
    c.restore();return;}
  c.strokeStyle='#E7EAF0';c.lineWidth=1.2;
  if(t==='lines'){for(let y=80;y<LH;y+=46){c.beginPath();c.moveTo(50,y);c.lineTo(LW-50,y);c.stroke();}}
  else if(t==='grid'){for(let x=0;x<=LW;x+=40){c.beginPath();c.moveTo(x,0);c.lineTo(x,LH);c.stroke();}
    for(let y=0;y<=LH;y+=40){c.beginPath();c.moveTo(0,y);c.lineTo(LW,y);c.stroke();}}
  else if(t==='pitch'){
    drawPitchRect(c,70,70,LW-140,LH-140);
  }
  else if(t==='pitchgrid'){
    /* 축구장 모눈 — 은은한 모눈 위에 실측 비율 축구장 + 써드 가이드(점선). 전술 메모의 기본 종이 */
    c.strokeStyle='#EDF0F5';c.lineWidth=1;
    for(let x=0;x<=LW;x+=40){c.beginPath();c.moveTo(x,0);c.lineTo(x,LH);c.stroke();}
    for(let y=0;y<=LH;y+=40){c.beginPath();c.moveTo(0,y);c.lineTo(LW,y);c.stroke();}
    c.strokeStyle='#E7EAF0';c.lineWidth=1.2;
    const pr={x:70,y:70,w:LW-140,h:LW>LH?LH-140:(LW-140)*68/105};
    if(LW<=LH)pr.y=Math.max(70,(LH-pr.h)/2-LH*0.12);   /* 세로 노트: 축구장을 위쪽 1/3에, 아래는 모눈 메모 공간 */
    drawPitchSquares(c,pr.x,pr.y,pr.w,pr.h,34);   /* 1.940 — 피치 안은 정사각 모눈(종이 모눈과 겹치지 않게) */
    drawPitchRect(c,pr.x,pr.y,pr.w,pr.h);
    /* 써드 가이드 점선 — 축구장 폭 기준 3등분 */
    (function(){
      const horiz=pr.w>pr.h,asp=105/68;
      let fw,fh;if(horiz){fw=Math.min(pr.w,pr.h*asp);fh=fw/asp;}else{fh=Math.min(pr.h,pr.w*asp);fw=fh/asp;}
      const fx=pr.x+(pr.w-fw)/2,fy=pr.y+(pr.h-fh)/2;
      c.save();c.strokeStyle='#D7DCE5';c.setLineDash([7,7]);c.lineWidth=1.2;
      if(fw>=fh){for(let i=1;i<3;i++){const gx=fx+fw*i/3;c.beginPath();c.moveTo(gx,fy);c.lineTo(gx,fy+fh);c.stroke();}}
      else{for(let i=1;i<3;i++){const gy=fy+fh*i/3;c.beginPath();c.moveTo(fx,gy);c.lineTo(fx+fw,gy);c.stroke();}}
      c.restore();
    })();
  }
  else if(t==='training3land_v1'){
    /* A4 가로 훈련 구성 노트 — 약 5mm 모눈, 실측 비율 피치 3개, 아래 줄노트.
       모눈과 피치 선은 필기보다 충분히 옅게 그려 인쇄·iPad 모두에서 방해하지 않는다. */
    const margin=60,gap=32,grid=24;
    c.save();
    c.strokeStyle='#F3F5F8';c.lineWidth=.8;
    for(let x=0;x<=LW;x+=grid){c.beginPath();c.moveTo(x,0);c.lineTo(x,LH);c.stroke();}
    for(let y=0;y<=LH;y+=grid){c.beginPath();c.moveTo(0,y);c.lineTo(LW,y);c.stroke();}
    const pw=(LW-margin*2-gap*2)/3,ph=pw*68/105,py=64;
    c.globalAlpha=.42;
    for(let i=0;i<3;i++)drawPitchRect(c,margin+i*(pw+gap),py,pw,ph);
    c.globalAlpha=1;
    c.strokeStyle='#E4E8EE';c.lineWidth=1.1;
    const lineStart=Math.max(py+ph+62,392);
    for(let y=lineStart;y<LH-48;y+=46){c.beginPath();c.moveTo(margin,y);c.lineTo(LW-margin,y);c.stroke();}
    c.restore();
  }
  else if(t==='training3vertical_land_v1'){
    /* A4 가로 · 실제 68×105m 세로 피치 3면. 운동장마다 같은 폭의 줄노트를 둔다. */
    c.save();drawTrainingGrid(c);
    const designW=1414,designH=1000,sc=Math.min(LW/designW,LH/designH);
    c.translate((LW-designW*sc)/2,(LH-designH*sc)/2);c.scale(sc,sc);
    const gap=24,pitchW=(designW-72-gap*2)/3,pitchH=pitchW*105/68,py=24,startX=36;
    for(let i=0;i<3;i++){ drawPitchSquares(c,startX+i*(pitchW+gap),py,pitchW,pitchH,34); drawPitchRect(c,startX+i*(pitchW+gap),py,pitchW,pitchH,{realistic:true}); }   /* 1.940 — 정사각 모눈 */
    c.strokeStyle='rgba(96,112,135,.16)';c.lineWidth=1;
    for(let i=0;i<3;i++){
      const x=startX+i*(pitchW+gap);
      for(let y=744;y<=960;y+=36){c.beginPath();c.moveTo(x,y);c.lineTo(x+pitchW,y);c.stroke();}
    }
    c.restore();
  }
  else if(t==='training6grid_land_v1'){
    /* 1.838 — A4 가로. 왼쪽 2/3 = 세로 피치(68×105) 6면(3열×2행), 각 면 안에 은은한 모눈. 오른쪽 1/3 = 줄노트(메모장). 사용자 지시. */
    c.save();drawTrainingGrid(c);
    const designW=1414,designH=1000,sc=Math.min(LW/designW,LH/designH);
    c.translate((LW-designW*sc)/2,(LH-designH*sc)/2);c.scale(sc,sc);
    const leftW=Math.round(designW*2/3), pad=24, gap=18, cols=3, rows=2;
    const cellW=(leftW-pad*2-gap*(cols-1))/cols, cellH=(designH-pad*2-gap*(rows-1))/rows;
    /* 피치를 셀 안에 contain(세로 피치) */
    let pw=cellW, ph=pw*105/68; if(ph>cellH){ph=cellH;pw=ph*68/105;}
    for(let r=0;r<rows;r++)for(let k=0;k<cols;k++){
      const cx=pad+k*(cellW+gap)+(cellW-pw)/2, cy=pad+r*(cellH+gap)+(cellH-ph)/2;
      drawPitchSquares(c,cx,cy,pw,ph,34);   /* 1.940 — 정사각 모눈 */
      drawPitchRect(c,cx,cy,pw,ph,{realistic:true});
    }
    /* 오른쪽 메모장 */
    c.strokeStyle='rgba(96,112,135,.16)';c.lineWidth=1;
    const mx0=leftW+pad, mx1=designW-pad;
    for(let y=pad+36;y<=designH-pad;y+=36){c.beginPath();c.moveTo(mx0,y);c.lineTo(mx1,y);c.stroke();}
    c.restore();
  }
  else if(t==='training1horizontal_land_v1'){
    /* A4 가로 · 실제 105×68m 가로 피치 1면과 하단 전체 폭 줄노트. */
    c.save();drawTrainingGrid(c);
    const designW=1414,designH=1000,sc=Math.min(LW/designW,LH/designH);
    c.translate((LW-designW*sc)/2,(LH-designH*sc)/2);c.scale(sc,sc);
    const pitchW=1152,pitchH=pitchW*68/105,px=131,py=24;
    drawPitchSquares(c,px,py,pitchW,pitchH,34);   /* 1.940 — 정사각 모눈 */
    drawPitchRect(c,px,py,pitchW,pitchH,{realistic:true});
    c.strokeStyle='rgba(96,112,135,.16)';c.lineWidth=1;
    for(let y=800;y<=960;y+=40){c.beginPath();c.moveTo(48,y);c.lineTo(1366,y);c.stroke();}
    c.restore();
  }
  else if(t==='meet'){
    if(LW>LH){                                   /* 가로: 왼쪽 피치 + 오른쪽 메모줄 */
      drawPitchRect(c,60,60,LW*0.44,LH-120);
      c.strokeStyle='#E7EAF0';c.lineWidth=1.2;
      const x0=60+LW*0.44+50;
      for(let y=120;y<LH-50;y+=46){c.beginPath();c.moveTo(x0,y);c.lineTo(LW-60,y);c.stroke();}
    }else{                                       /* 세로: 위 피치 + 아래 메모줄 */
      drawPitchRect(c,60,60,LW-120,LH*0.40);
      c.strokeStyle='#E7EAF0';c.lineWidth=1.2;
      const y0=60+LH*0.40+70;
      for(let y=y0;y<LH-50;y+=46){c.beginPath();c.moveTo(60,y);c.lineTo(LW-60,y);c.stroke();}
    }
  }
  c.restore();
}

/* 신규 훈련 종이는 진한 기준선 없이 같은 농도의 약 5mm 모눈만 쓴다. */
function drawTrainingGrid(c){
  const grid=24;
  c.strokeStyle='rgba(96,112,135,.065)';c.lineWidth=.8;
  for(let x=0;x<=LW;x+=grid){c.beginPath();c.moveTo(x,0);c.lineTo(x,LH);c.stroke();}
  for(let y=0;y<=LH;y+=grid){c.beginPath();c.moveTo(0,y);c.lineTo(LW,y);c.stroke();}
}
/* 1.940 — 축구장 안 정사각 모눈(사용자: 라인을 일관되게 그릴 수 있게).
   피치 실측 68m 짧은 변을 n(기본 8, ≈8.5m)으로 나눈 정사각형을 피치 안에만 그리고, 그 아래 종이 모눈은 지워(흰 바탕) 겹선을 없앤다.
   drawPitchRect 와 같은 contain 규칙으로 실제 피치 사각형을 구한 뒤 그 안을 채운다. */
function drawPitchSquares(c,rx,ry,rw,rh,n){
  const horiz=rw>rh, asp=105/68; let fw,fh;
  if(horiz){fw=Math.min(rw,rh*asp);fh=fw/asp;} else {fh=Math.min(rh,rw*asp);fw=fh/asp;}
  /* 1.942 — 작전판 '훈련' 피치의 모눈 문법(2m 격자, 아주 연하게)을 그대로: 짧은 변 68m ÷ 34 = 2m 정사각 */
  const x0=rx+(rw-fw)/2, y0=ry+(rh-fh)/2, short=horiz?fh:fw, g=short/(n||34);
  c.save();
  c.fillStyle='#fff';c.fillRect(x0,y0,fw,fh);
  c.beginPath();c.rect(x0,y0,fw,fh);c.clip();
  c.strokeStyle='rgba(96,112,135,.075)';c.lineWidth=.6;
  for(let x=x0+g;x<x0+fw-0.5;x+=g){c.beginPath();c.moveTo(x,y0);c.lineTo(x,y0+fh);c.stroke();}
  for(let y=y0+g;y<y0+fh-0.5;y+=g){c.beginPath();c.moveTo(x0,y);c.lineTo(x0+fw,y);c.stroke();}
  c.restore();
}

/* 실측 비율(68×105m) 축구장을 rect 안에 contain — 넓은 rect면 골대 좌우(눕힘), 좁으면 위아래.
   realistic 옵션은 공식 1m 코너아크와 7.32m 골대까지 그리며 기존 양식의 외형은 바꾸지 않는다. */
function drawPitchRect(c,rx,ry,rw,rh,opt){
  const horiz=rw>rh, asp=105/68;
  let fw,fh;
  if(horiz){fw=Math.min(rw,rh*asp);fh=fw/asp;}
  else{fh=Math.min(rh,rw*asp);fw=fh/asp;}
  c.save();
  c.translate(rx+(rw-fw)/2, ry+(rh-fh)/2);
  if(horiz){c.translate(0,fh);c.rotate(-Math.PI/2);}   /* 세로 좌표계로 그리고 통째로 눕힌다 */
  const k=(horiz?fh:fw)/68, W=68*k, H=105*k;
  const realistic=!!(opt&&opt.realistic),sr=realistic?Math.max(1.5,0.11*k):Math.max(2,0.35*k);
  c.strokeStyle=realistic?'rgba(96,112,135,.26)':'#AEB4BE';c.fillStyle=c.strokeStyle;
  c.lineWidth=Math.max(1.1,k*(realistic?0.12:0.16));
  c.strokeRect(0,0,W,H);
  c.beginPath();c.moveTo(0,H/2);c.lineTo(W,H/2);c.stroke();
  c.beginPath();c.arc(W/2,H/2,9.15*k,0,Math.PI*2);c.stroke();
  c.beginPath();c.arc(W/2,H/2,sr,0,Math.PI*2);c.fill();
  c.strokeRect(13.84*k,0,40.32*k,16.5*k);c.strokeRect(13.84*k,H-16.5*k,40.32*k,16.5*k);
  c.strokeRect(24.84*k,0,18.32*k,5.5*k);c.strokeRect(24.84*k,H-5.5*k,18.32*k,5.5*k);
  c.beginPath();c.arc(W/2,11*k,sr,0,Math.PI*2);c.fill();
  c.beginPath();c.arc(W/2,H-11*k,sr,0,Math.PI*2);c.fill();
  const a=Math.asin(5.5/9.15);                         /* 페널티 아크 — 박스 밖 부분만 */
  c.beginPath();c.arc(W/2,11*k,9.15*k,a,Math.PI-a);c.stroke();
  c.beginPath();c.arc(W/2,H-11*k,9.15*k,Math.PI+a,2*Math.PI-a);c.stroke();
  const ca=(realistic?1:1.5)*k;
  c.beginPath();c.arc(0,0,ca,0,0.5*Math.PI);c.stroke();
  c.beginPath();c.arc(W,0,ca,0.5*Math.PI,Math.PI);c.stroke();
  c.beginPath();c.arc(W,H,ca,Math.PI,1.5*Math.PI);c.stroke();
  c.beginPath();c.arc(0,H,ca,1.5*Math.PI,2*Math.PI);c.stroke();
  if(realistic){                                      /* 평면도 골망: 폭 7.32m · 깊이 2m */
    const gw=7.32*k,gd=2*k,gx=(W-gw)/2;
    c.strokeRect(gx,-gd,gw,gd);c.strokeRect(gx,H,gw,gd);
  }
  c.restore();
}

/* ============ 획 렌더 — 리본 (저장본·완성본용) ============ */
function ribbon(c,s){
  const pts=s.pts,n=pts.length;
  if(n===0)return;
  c.fillStyle=s.color;
  if(n===1){c.beginPath();c.arc(pts[0].x,pts[0].y,(pts[0].w||s.size)/2,0,Math.PI*2);c.fill();return;}
  const L=[],R=[];
  for(let i=0;i<n;i++){
    const a=pts[Math.max(0,i-1)],b=pts[Math.min(n-1,i+1)];
    let dx=b.x-a.x,dy=b.y-a.y;const len=Math.hypot(dx,dy)||1;
    const w=(pts[i].w||s.size)/2;
    L.push({x:pts[i].x-dy/len*w,y:pts[i].y+dx/len*w});
    R.push({x:pts[i].x+dy/len*w,y:pts[i].y-dx/len*w});
  }
  c.beginPath();
  c.moveTo(L[0].x,L[0].y);
  for(let i=1;i<n-1;i++){const mx=(L[i].x+L[i+1].x)/2,my=(L[i].y+L[i+1].y)/2;c.quadraticCurveTo(L[i].x,L[i].y,mx,my);}
  c.lineTo(L[n-1].x,L[n-1].y);
  c.arc(pts[n-1].x,pts[n-1].y,(pts[n-1].w||s.size)/2,
    Math.atan2(L[n-1].y-pts[n-1].y,L[n-1].x-pts[n-1].x),
    Math.atan2(R[n-1].y-pts[n-1].y,R[n-1].x-pts[n-1].x));
  for(let i=n-2;i>0;i--){const mx=(R[i].x+R[i-1].x)/2,my=(R[i].y+R[i-1].y)/2;c.quadraticCurveTo(R[i].x,R[i].y,mx,my);}
  c.lineTo(R[0].x,R[0].y);
  c.arc(pts[0].x,pts[0].y,(pts[0].w||s.size)/2,
    Math.atan2(R[0].y-pts[0].y,R[0].x-pts[0].x),
    Math.atan2(L[0].y-pts[0].y,L[0].x-pts[0].x));
  c.closePath();c.fill();
}
let tmp=document.createElement('canvas'),tctx=tmp.getContext('2d');
/* 텍스트 줄바꿈 — s.wrap(논리 px)이 있으면 그 폭에서 자동 줄바꿈, 없으면 기존처럼 \n만 */
let mcv=document.createElement('canvas'),mctx=mcv.getContext('2d');
function textFont(s){return '600 '+(s.size*1.7)+"px -apple-system,BlinkMacSystemFont,system-ui,'Apple SD Gothic Neo','Malgun Gothic',sans-serif";}
function textLines(s){
  const raw=String(s.text||'').split('\n');
  if(!s.wrap)return raw;
  mctx.font=textFont(s);
  const out=[];
  raw.forEach(ln=>{
    if(!ln||mctx.measureText(ln).width<=s.wrap){out.push(ln);return;}
    let cur='';
    for(const ch of ln){
      if(cur&&mctx.measureText(cur+ch).width>s.wrap){
        const sp=cur.lastIndexOf(' ');
        if(sp>0&&ch!==' '){out.push(cur.slice(0,sp));cur=cur.slice(sp+1)+ch;}
        else{out.push(cur);cur=ch===' '?'':ch;}
      }else cur+=ch;
    }
    out.push(cur);
  });
  return out;
}
function renderStroke(c,s,cw,chh){
  if(s.tool==='hl'){
    const W=cw||cv.width,H=chh||cv.height;
    if(tmp.width!==W||tmp.height!==H){tmp.width=W;tmp.height=H;}
    tctx.setTransform(W/LW,0,0,H/LH,0,0);
    tctx.clearRect(0,0,LW,LH);ribbon(tctx,s);
    c.save();c.globalAlpha=0.38;c.setTransform(1,0,0,1,0,0);c.drawImage(tmp,0,0,W,H);c.restore();
    c.setTransform(W/LW,0,0,H/LH,0,0);
  }else if(s.tool==='eraser'){
    c.save();c.globalCompositeOperation='destination-out';ribbon(c,s);c.restore();
  }else if(s.tool==='pencil'){
    c.save();c.globalAlpha=0.66;ribbon(c,s);c.restore();
  }else if(s.tool==='text'){
    c.save();c.fillStyle=s.color;
    c.font=textFont(s);
    c.textBaseline='top';
    textLines(s).forEach((ln,i)=>c.fillText(ln,s.x,s.y+i*s.size*1.7*1.34));
    c.restore();
  }else ribbon(c,s);
}

/* 잉크는 별도 캔버스에 합성 — 지우개(destination-out)가 배경/PDF를 뚫지 않도록 */
let ink=document.createElement('canvas'),ictx=ink.getContext('2d');
function renderInk(c,W,H,strokes,extra){
  if(ink.width!==W||ink.height!==H){ink.width=W;ink.height=H;}
  ictx.setTransform(1,0,0,1,0,0);ictx.clearRect(0,0,W,H);
  ictx.setTransform(W/LW,0,0,H/LH,0,0);
  (strokes||[]).forEach(s=>renderStroke(ictx,s,W,H));
  if(extra)renderStroke(ictx,extra,W,H);
  c.save();c.setTransform(1,0,0,1,0,0);c.drawImage(ink,0,0);c.restore();
  c.setTransform(W/LW,0,0,H/LH,0,0);
}
function rebuildBase(){
  drawTpl(bctx);
  if(note)renderInk(bctx,base.width,base.height,note.pages[pi].strokes,(live&&live.tool==='eraser')?live:null);
}
function present(){
  ctx.save();ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,cv.width,cv.height);
  ctx.drawImage(base,0,0);ctx.restore();
  ctx.setTransform(cv.width/LW,0,0,cv.height/LH,0,0);
}

/* ============ 입력 v3 — 무보정·증분 렌더·속도 기반 굵기 ============ */
let rect=null, lastT=0, emaW=0, drawnIdx=0;
function widthFor(s,p,speed){
  const baseW=s.tool==='eraser'?s.size:(s.size*(s.tool==='hl'?3.2:s.tool==='pencil'?0.92:1));
  if(s.tool==='hl'||s.tool==='eraser')return baseW;
  const pr=(p==null||p===0)?0.5:p;
  const spd=Math.min(1, speed/2.2);            // 속도 0~2.2u/ms 정규화
  let w=baseW*(0.42+Math.pow(pr,1.35)*1.05)*(1.1-0.46*spd);   // 빠르면 가늘게 (잉크 느낌)
  emaW=emaW===0?w:emaW*0.55+w*0.45;            // 굵기만 부드럽게 (좌표는 무보정)
  return Math.max(0.7,emaW);
}
function toL(e){
  return {x:(e.clientX-rect.left)/rect.width*LW, y:(e.clientY-rect.top)/rect.height*LH, p:e.pressure||0, t:e.timeStamp};
}
function addPoint(e){
  const q=toL(e);
  const pts=live.pts;
  const prev=pts[pts.length-1];
  if(prev){
    const d=Math.hypot(q.x-prev.x,q.y-prev.y);
    if(d<0.9)return;
    const dt=Math.max(1,(q.t||0)-(prev.t||0));
    const sp=d/dt;
    const a=sp<0.22?0.42:sp<0.7?0.18:0;        // 천천히 쓸 때만 미세 보정 (빠를 땐 무보정)
    if(a>0){q.x=prev.x*a+q.x*(1-a);q.y=prev.y*a+q.y*(1-a);}
    q.w=widthFor(live,q.p,sp);
  }else q.w=widthFor(live,q.p,0.3);
  pts.push(q);
}

function renderPageRail(){
  var rail=$('pageRail');if(!rail||!note)return;
  /* 빈 종이에 첫 획을 그은 순간에도 미리보기 상태가 바로 바뀐다. 획 개수 전체를
     서명에 넣지는 않아 필기 중 매번 레일을 다시 만들지 않는다. */
  var sig=note.id+':'+note.pages.map(function(pg){return (pg&&pg.bg?'b':'p')+((pg&&pg.strokes&&pg.strokes.length)?'i':'0');}).join(',');
  if(rail.dataset.sig!==sig){
    rail.dataset.sig=sig;rail.innerHTML='';
    note.pages.forEach(function(pg,i){
      var b=document.createElement('button');b.type='button';b.setAttribute('aria-label',(i+1)+'페이지 열기');

      var no=document.createElement('small');no.textContent=i+1;b.appendChild(no);

(function(){
  var st=$('stage'); if(!st) return;
  var sw=null;
  function turn(dir){ if(!note) return; var b=$(dir>0?'pgNext':'pgPrev'); if(b&&b.onclick) b.onclick(); }
  st.addEventListener('pointerdown',function(e){
    if(e.pointerType==='pen') return;
    var onPaper=(e.target===cv);
    if(onPaper && !(e.pointerType==='touch' && penOnly)) return;      /* 종이 위 손가락/마우스는 그리기 */

   이미지를 저장하지 않고 키(form:<k>)만 남긴다 → localStorage 0 + '월간 양식'이 늘 이번 달.
   그릴 때 셸에서 양식 HTML을 받아 foreignObject 로 래스터화하고 메모리에만 캐시. */
const FKEY='cs_note_forms_v1';

function formsApi(){try{return window.parent!==window?window.parent.__psForms:null;}catch(_){return null;}}
/* 관대한 HTML 파서로 읽고 XMLSerializer 로 다시 뱉는다 → 항상 well-formed XHTML.
   foreignObject 는 XHTML만 받는데 '매치데이 양식'은 태그가 안 닫혀 있어 원문 그대로는 거부당한다.
   덤으로 <svg> 에 네임스페이스가 자동으로 붙어 운동장 블록도 그려진다. */
function docToXhtml(doc){
  const d=new DOMParser().parseFromString(doc,'text/html');
  const css=[...d.querySelectorAll('style')].map(s=>s.textContent).join('\n');
  const wrap=d.createElement('div');
  wrap.setAttribute('xmlns','http://www.w3.org/1999/xhtml');
  const st=d.createElement('style');st.textContent=css;wrap.appendChild(st);
  while(d.body.firstChild) wrap.appendChild(d.body.firstChild);
  return new XMLSerializer().serializeToString(wrap);
}
const formCache={};   /* 캐시키 → {img,err} */
function rasterEntry(ck,getDoc,land){
  let e=formCache[ck]; if(e) return e;
  e=formCache[ck]={img:null,err:false};
  Promise.resolve().then(getDoc).then(doc=>{
    const xh=docToXhtml(doc);
    const NW=land?1100:760, NH=land?780:1080;
    /* viewBox 로 2배 확대 — 내용이 벡터라 노트 해상도(1000×1414)에서 선명하게 래스터된다 */
    const svg='<svg xmlns="http://www.w3.org/2000/svg" width="'+(NW*2)+'" height="'+(NH*2)+'" viewBox="0 0 '+NW+' '+NH+'">'
             +'<foreignObject width="'+NW+'" height="'+NH+'">'+xh+'</foreignObject></svg>';
    const img=new Image();
    img.onload=()=>{e.img=img;rebuildBase();present();};
    img.onerror=()=>{e.err=true;toast('이 양식은 배경으로 못 써요 — 인쇄로 써주세요');};
    img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
  }).catch(()=>{e.err=true;toast('양식을 불러오지 못했어요');});
  return e;
}
function formEntry(k){
  const api=formsApi(); if(!api){const e={img:null,err:true};return e;}

function myEntry(id){

function openFormPicker(){
  refreshTplSel();                                  /* select 를 원래 값으로 되돌림 */
  const api=formsApi();
  if(!api){toast('양식은 앱 안에서만 쓸 수 있어요');return;}
  const g=$('fmGrid');g.innerHTML='';
  let list=[];try{list=api.list();}catch(_){}
  if(!list.length){toast('양식을 불러오지 못했어요');return;}
  let cat=null;
  list.forEach(f=>{
    if(f.cat&&f.cat!==cat){                          /* 양식 화면과 같은 분류·색으로 묶는다 */
      cat=f.cat;
      const h=document.createElement('div');h.className='fmcat';
      h.style.color=f.color||'';h.textContent=cat;g.appendChild(h);
    }
    const b=document.createElement('button');b.className='fmit';b.type='button';
    b.innerHTML='<span class="fi"></span><span class="ft"><b></b><span></span></span>';
    const fi=b.querySelector('.fi');fi.innerHTML=f.icon;if(f.color)fi.style.color=f.color;
    b.querySelector('b').textContent=f.name;
    b.querySelector('.ft span').textContent=f.desc+((f.land&&f.desc.indexOf('가로')<0)?' · 가로':'');
    b.onclick=()=>pickForm(f);

  });
  $('fmOvl').classList.add('on');
}
function pickForm(f){
  $('fmOvl').classList.remove('on');
  if(!note)return;
  const arr=usedForms().filter(x=>x.k!==f.k);arr.unshift({k:f.k,name:f.name});
  try{localStorage.setItem(FKEY,JSON.stringify(arr.slice(0,12)));}catch(_){}
  note.orient=f.land?'l':'p';                       /* 양식 방향에 맞춤 — 안 그러면 위아래 흰 띠가 남는다 */
  applyOrient();
  note.tpl='form:'+f.k;
  refreshTplSel();$('nTpl').value=note.tpl;
  rebuildBase();present();fit();saveSoon();

$('fmX').onclick=()=>$('fmOvl').classList.remove('on');
$('fmOvl').onclick=e=>{if(e.target===$('fmOvl'))$('fmOvl').classList.remove('on');};

/* ===== 내가 만든 양식 — 블록을 쌓아 A4 한 장을 조립한다 =====
   블록 정의(JSON)만 저장하고 그릴 때 HTML을 만들어 위 rasterEntry 로 넘긴다 → 용량 0 + 언제든 재편집. */
const MKEY='cs_note_myforms_v1';
function myForms(){try{return JSON.parse(localStorage.getItem(MKEY))||[];}catch(_){return [];}}
function myForm(id){return myForms().find(x=>x.id===id)||null;}
function saveMyForms(a){try{localStorage.setItem(MKEY,JSON.stringify(a));return true;}catch(_){toast('저장 공간이 부족해요');return false;}}
function esc(s){return window.PSSafe&&window.PSSafe.html?window.PSSafe.html(s):String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}

/* 블록 종류 — 기존 미팅 양식(제목·메타칸·줄상자·표)을 분해해서 나온 것 + 운동장 */
const BLK={
  title:{n:'제목',   mk:()=>({t:'title',text:'미팅 제목',sub:'',w:'full'})},
  meta: {n:'메타칸', mk:()=>({t:'meta',label:'상대, 일자, 장소',w:'full'})},
  pitch:{n:'운동장', mk:()=>({t:'pitch',kind:'full',w:'half',h:'m'})},
  text: {n:'글상자', mk:()=>({t:'text',label:'게임플랜',lines:'1',w:'half',h:'m'})},
  table:{n:'표',     mk:()=>({t:'table',label:'역할 · 지시',cols:'선수, 역할',w:'full',h:'m'})},
  check:{n:'체크',   mk:()=>({t:'check',label:'점검',items:'항목1, 항목2, 항목3',w:'full',h:'s'})}
};
const BH={s:70,m:130,l:210};   /* 블록 높이(px, 문서 기준 760 폭) */

/* 축구장 SVG — 실측 비율(68×105m). 세로 좌표계로 그린 뒤 가로는 회전시킨다.
   XMLSerializer 가 <svg> 에 네임스페이스를 붙여주므로 foreignObject 안에서도 그려진다. */
const PITCH_ASP={full:105/68, land:68/105, half:52.5/68};   /* 높이 = 폭 × 이 값 — 비율 고정 물건이라 S/M/L 로 높이를 강제하면 찌그러진다 */
function pitchSVG(kind){
  const K='#A6ADB8', S='fill="none" stroke="'+K+'" stroke-width="0.45"';
  const half=kind==='half', land=kind==='land';
  const H=half?52.5:105;
  let s='<rect x="0" y="0" width="68" height="'+H+'" fill="#fff" stroke="'+K+'" stroke-width="0.45"/>';
  s+='<rect x="13.84" y="0" width="40.32" height="16.5" '+S+'/>';       /* 페널티 박스 */
  s+='<rect x="24.84" y="0" width="18.32" height="5.5" '+S+'/>';        /* 골 에어리어 */
  s+='<circle cx="34" cy="11" r="0.5" fill="'+K+'"/>';                  /* 페널티 스팟 */
  s+='<path d="M 26.69 16.5 A 9.15 9.15 0 0 0 41.31 16.5" '+S+'/>';     /* 아크 — 박스 바깥으로 나온 부분만 */
  s+='<line x1="0" y1="52.5" x2="68" y2="52.5" stroke="'+K+'" stroke-width="0.45"/>';
  if(half){
    s+='<path d="M 24.85 52.5 A 9.15 9.15 0 0 1 43.15 52.5" '+S+'/>';   /* 하프코트: 센터서클 절반 */
  }else{
    s+='<circle cx="34" cy="52.5" r="9.15" '+S+'/><circle cx="34" cy="52.5" r="0.5" fill="'+K+'"/>';
    s+='<rect x="13.84" y="88.5" width="40.32" height="16.5" '+S+'/>';
    s+='<rect x="24.84" y="99.5" width="18.32" height="5.5" '+S+'/>';
    s+='<circle cx="34" cy="94" r="0.5" fill="'+K+'"/>';
    s+='<path d="M 26.69 88.5 A 9.15 9.15 0 0 1 41.31 88.5" '+S+'/>';
  }
  /* 가로: translate 먼저, rotate 나중(오른쪽→왼쪽 적용). (x,y)→(105-y, x) 로 105×68 안에 정확히 들어간다 */
  const vb=land?'0 0 105 68':('0 0 68 '+H);
  const g=land?'<g transform="translate(105 0) rotate(90)">'+s+'</g>':s;
  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="'+vb+'" preserveAspectRatio="xMidYMid meet" class="pt">'+g+'</svg>';
}
/* 블록 높이 — 운동장만 폭에서 자동(비율 고정), 나머지는 S/M/L */
function contentW(land){return (land?1100:760)-32;}
function blockH(b,land){
  if(b.t==='title') return 26;
  if(b.t==='meta')  return 20;
  if(b.t==='pitch'){
    const CW=contentW(land), w=(b.w==='half')?(CW-9)/2:CW;
    return Math.round(w*(PITCH_ASP[b.kind||'full']));
  }
  return BH[b.h||'m'];
}

/* 블록 → A4 한 장 HTML. 기존 양식들과 같은 톤(11px 본문, 얇은 회색 선) */
function myDoc(f){
  const land=f.orient==='l';
  let body='';
  (f.blocks||[]).forEach(b=>{
    const cls='bk '+(b.w==='half'?'half':'full');
    const h=blockH(b,land);
    if(b.t==='title'){
      body+='<div class="'+cls+' ttl"><h1>'+esc(b.text)+'</h1>'+(b.sub?'<div class="sb">'+esc(b.sub)+'</div>':'')+'</div>';
    }else if(b.t==='meta'){
      const fs=String(b.label||'').split(',').map(x=>x.trim()).filter(Boolean);
      body+='<div class="'+cls+' mt">'+fs.map(x=>'<span class="mi"><i>'+esc(x)+'</i><u></u></span>').join('')+'</div>';
    }else if(b.t==='pitch'){
      body+='<div class="'+cls+'" style="height:'+h+'px">'+pitchSVG(b.kind||'full')+'</div>';
    }else if(b.t==='text'){
      const rows=Math.max(1,Math.floor((h-(b.label?15:2))/19));
      const ln=b.lines==='1'?new Array(rows).fill('<div class="rl"></div>').join(''):'';
      body+='<div class="'+cls+' bx" style="height:'+h+'px">'+(b.label?'<i>'+esc(b.label)+'</i>':'')+'<div class="ib">'+ln+'</div></div>';
    }else if(b.t==='table'){
      const cols=String(b.cols||'').split(',').map(x=>x.trim()).filter(Boolean);
      const rows=Math.max(1,Math.floor((h-(b.label?15:0)-16)/17));
      let tb='<table><tr>'+cols.map(c=>'<th>'+esc(c)+'</th>').join('')+'</tr>';
      for(let i=0;i<rows;i++) tb+='<tr>'+cols.map(()=>'<td></td>').join('')+'</tr>';
      tb+='</table>';
      body+='<div class="'+cls+' bx" style="height:'+h+'px">'+(b.label?'<i>'+esc(b.label)+'</i>':'')+tb+'</div>';
    }else if(b.t==='check'){
      const its=String(b.items||'').split(',').map(x=>x.trim()).filter(Boolean);
      body+='<div class="'+cls+' bx" style="height:'+h+'px">'+(b.label?'<i>'+esc(b.label)+'</i>':'')
           +'<div class="ck">'+its.map(x=>'<span><b></b>'+esc(x)+'</span>').join('')+'</div></div>';
    }
  });
  const CSS='*{box-sizing:border-box}body{margin:0;padding:16px;font-family:\'Pretendard\',-apple-system,system-ui,sans-serif;color:#1f2430;font-size:11px;line-height:1.45}'
   +'.pg{display:flex;flex-wrap:wrap;gap:9px;align-items:flex-start}'
   +'.bk{flex:0 0 auto}.bk.full{width:100%}.bk.half{width:calc(50% - 4.5px)}'
   +'.ttl h1{font-size:16px;font-weight:800;margin:0;letter-spacing:-.3px}'
   +'.ttl .sb{font-size:10px;color:#8A9099;margin-top:2px;letter-spacing:.06em;text-transform:uppercase}'
   +'.mt{display:flex;gap:8px}.mi{flex:1;display:flex;align-items:baseline;gap:5px}'
   +'.mi i{font-style:normal;font-size:10px;font-weight:800;color:#8A9099;flex:0 0 auto}'
   +'.mi u{flex:1;text-decoration:none;border-bottom:1px solid #C9CFD8;height:15px}'
   +'.bx{border:1px solid #D5DAE2;border-radius:3px;padding:5px 7px;display:flex;flex-direction:column;overflow:hidden}'
   +'.bx>i{font-style:normal;font-size:10px;font-weight:800;color:#8A9099;flex:0 0 auto;margin-bottom:3px}'
   +'.ib{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:flex-start}'
   +'.rl{height:19px;border-bottom:1px solid #E7EAF0;flex:0 0 auto}'
   +'table{width:100%;border-collapse:collapse;table-layout:fixed}'
   +'th{font-size:10px;font-weight:800;color:#8A9099;text-align:left;border-bottom:1px solid #C9CFD8;padding:2px 4px}'
   +'td{height:17px;border-bottom:1px solid #E7EAF0;padding:2px 4px}'
   +'.ck{display:flex;flex-direction:column;gap:4px}'
   +'.ck span{display:flex;align-items:center;gap:6px;font-size:10px}'
   +'.ck b{width:9px;height:9px;border:1px solid #C9CFD8;border-radius:2px;flex:0 0 auto}'
   +'svg.pt{width:100%;height:100%;display:block}';
  return '<!doctype html><html lang="ko"><head><meta charset="utf-8"><style>@page{size:A4 '+(land?'landscape':'portrait')+';margin:0}'+CSS+'</style></head><body><div class="pg">'+body+'</div></body></html>';
}

/* ===== 빌더 UI (데스크톱·아이패드) ===== */
let bldCur=null, _bDrag=-1;
function openBuilder(id){
  bldCur = id ? JSON.parse(JSON.stringify(myForm(id)||{})) : {id:'mf'+Date.now().toString(36),name:'',orient:'p',v:0,blocks:[]};
  if(!bldCur.blocks) bldCur.blocks=[];
  $('bldName').value=bldCur.name||'';
  $('bldOrient').value=bldCur.orient||'p';
  const pal=$('bldPal');pal.innerHTML='';
  Object.keys(BLK).forEach(k=>{
    const b=document.createElement('button');b.type='button';b.textContent='＋ '+BLK[k].n;
    b.onclick=()=>{bldCur.blocks.push(BLK[k].mk());bldRender();};
    pal.appendChild(b);
  });
  bldRender();
  $('bldOvl').classList.add('on');
}
function bldRender(){
  const L=$('bldList');L.innerHTML='';
  if(!bldCur.blocks.length){
    L.innerHTML='<div class="bempty">위에서 블록을 눌러 쌓아보세요.<br>운동장을 <b>절반</b>으로 두면 옆에 글상자가 나란히 놓입니다.</div>';
  }
  bldCur.blocks.forEach((b,i)=>{
    const row=document.createElement('div');row.className='bitem';row.draggable=true;
    row.innerHTML='<span class="gr">⠿</span><span class="bn"></span>';
    row.querySelector('.bn').textContent=BLK[b.t]?BLK[b.t].n:b.t;
    // 블록별 입력칸
    const mk=(v,ph,key)=>{const i2=document.createElement('input');i2.className='lb';i2.value=v||'';i2.placeholder=ph;
      i2.oninput=()=>{b[key]=i2.value;bldPreview();};return i2;};
    if(b.t==='title'){ row.appendChild(mk(b.text,'제목','text')); row.appendChild(mk(b.sub,'부제(선택)','sub')); }
    else if(b.t==='meta'){ row.appendChild(mk(b.label,'상대, 일자, 장소','label')); }
    else if(b.t==='table'){ row.appendChild(mk(b.label,'라벨','label')); row.appendChild(mk(b.cols,'열 이름들','cols')); }
    else if(b.t==='check'){ row.appendChild(mk(b.label,'라벨','label')); row.appendChild(mk(b.items,'항목들','items')); }
    else if(b.t==='text'){ row.appendChild(mk(b.label,'라벨','label')); }
    else if(b.t==='pitch'){ row.appendChild(sel(b,'kind',[['full','풀피치 세로'],['land','풀피치 가로'],['half','하프코트']])); }
    if(b.t==='text') row.appendChild(sel(b,'lines',[['1','줄 있음'],['0','빈칸']]));
    if(b.t!=='title'&&b.t!=='meta') row.appendChild(sel(b,'w',[['full','전체'],['half','절반']]));
    /* 운동장은 폭에서 높이가 자동으로 나온다(비율 고정) — S/M/L 을 주면 찌그러진다 */
    if(b.t!=='title'&&b.t!=='meta'&&b.t!=='pitch') row.appendChild(sel(b,'h',[['s','S'],['m','M'],['l','L']]));
    const x=document.createElement('button');x.className='x';x.textContent='×';x.title='삭제';
    x.onclick=()=>{bldCur.blocks.splice(i,1);bldRender();};
    row.appendChild(x);
    row.addEventListener('dragstart',()=>{_bDrag=i;row.classList.add('drag');});
    row.addEventListener('dragend',()=>{_bDrag=-1;row.classList.remove('drag');[...L.children].forEach(c=>c.classList.remove('over'));});
    row.addEventListener('dragover',e=>{e.preventDefault();if(_bDrag>=0&&_bDrag!==i)row.classList.add('over');});
    row.addEventListener('dragleave',()=>row.classList.remove('over'));
    row.addEventListener('drop',e=>{e.preventDefault();if(_bDrag<0||_bDrag===i)return;
      const m=bldCur.blocks.splice(_bDrag,1)[0];bldCur.blocks.splice(i,0,m);_bDrag=-1;bldRender();});
    L.appendChild(row);
  });
  bldPreview();
  function sel(b,key,opts){
    const s=document.createElement('select');
    opts.forEach(([v,t])=>{const o=document.createElement('option');o.value=v;o.textContent=t;s.appendChild(o);});
    s.value=b[key]!=null?String(b[key]):opts[0][0];
    s.onchange=()=>{b[key]=s.value;bldPreview();};
    return s;
  }
}
function bldPreview(){
  bldCur.orient=$('bldOrient').value;
  const land=bldCur.orient==='l', W=land?1100:760, H=land?780:1080;
  const box=$('bldPv'), ifr=$('bldIfr'), pane=box.parentElement;
  const av=Math.max(120,pane.clientHeight-28), avw=Math.max(120,pane.clientWidth-28);
  const sc=Math.min(av/H, avw/W);
  ifr.style.width=W+'px'; ifr.style.height=H+'px'; ifr.style.transform='scale('+sc+')';
  box.style.width=Math.round(W*sc)+'px'; box.style.height=Math.round(H*sc)+'px';
  ifr.srcdoc=myDoc(bldCur);
  // 블록이 A4 한 장을 넘겼는지 알려준다 (넘치면 잘려서 인쇄된다). 생성기와 같은 blockH 를 써야 숫자가 맞는다
  let used=0; (bldCur.blocks||[]).forEach(b=>{ used += (b.w==='half'?blockH(b,land)/2:blockH(b,land))+9; });
  let el=$('bldList').querySelector('.bfull');
  if(!el){el=document.createElement('div');el.className='bfull';$('bldList').appendChild(el);}
  const cap=H-32, pct=Math.round(used/cap*100);
  el.textContent='A4 한 장 사용량 약 '+pct+'%';
  el.classList.toggle('over',pct>100);
  if(pct>100) el.textContent='A4 한 장을 넘겼어요 (약 '+pct+'%) — 블록을 줄이거나 크기를 S로 낮춰주세요';
}
$('bldOrient').onchange=bldPreview;
$('bldX').onclick=()=>$('bldOvl').classList.remove('on');
$('bldSave').onclick=()=>{
  if(!bldCur)return;
  if(!bldCur.blocks.length){toast('블록을 하나 이상 넣어주세요');return;}
  bldCur.name=($('bldName').value||'').trim()||'내 양식';
  bldCur.orient=$('bldOrient').value;
  bldCur.v=(bldCur.v||0)+1;                       /* 캐시키가 바뀌어 편집분이 즉시 반영된다 */
  const arr=myForms().filter(x=>x.id!==bldCur.id); arr.unshift(bldCur);
  if(!saveMyForms(arr))return;
  $('bldOvl').classList.remove('on');
  if(note){
    note.orient=bldCur.orient; applyOrient();
    note.tpl='my:'+bldCur.id;
    refreshTplSel(); $('nTpl').value=note.tpl;
    rebuildBase();present();fit();saveSoon();
  }
  toast(bldCur.name+' 저장 ✓');
};
$('nTitle').addEventListener('input',saveSoon);

/* ============ 내보내기 ============ */
function loadBgs(){ // 모든 페이지 배경 이미지를 bgCache에 미리 로드 (내보내기용)
  if(!note)return Promise.resolve();
  // 양식 배경은 비동기 래스터라 아직 안 그려졌을 수 있다 — 기다리지 않으면 빈 종이가 나간다
  const fw=(note.tpl&&(note.tpl.indexOf('form:')===0||note.tpl.indexOf('my:')===0))?formReady(note.tpl):Promise.resolve();
  return Promise.all([fw].concat(note.pages.filter(p=>p.bg).map(p=>new Promise(res=>{
    let img=bgCache[p.bg];
    if(!img){img=new Image();img.onload=()=>{rebuildBase();present();};img.src=p.bg;bgCache[p.bg]=img;}
    if(img.complete)return res();
    img.addEventListener('load',res,{once:true});
    img.addEventListener('error',res,{once:true});
  }))));
}
$('pngB').onclick=async()=>{
  await loadBgs();
  const off=document.createElement('canvas');off.width=LW*2;off.height=LH*2;
  const oc=off.getContext('2d');oc.setTransform(2,0,0,2,0,0);
  drawTpl(oc);
  renderInk(oc,off.width,off.height,note.pages[pi].strokes);
  off.toBlob(b=>{
    const a=document.createElement('a');a.href=URL.createObjectURL(b);
    a.download=(note.title||'훈련노트')+'-p'+(pi+1)+'.png';a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),2000);
    toast('이미지 저장됨 ✓');
  },'image/png');
};

function pageCanvas(idx){
  const off=document.createElement('canvas');off.width=LW*2;off.height=LH*2;
  const oc=off.getContext('2d');oc.setTransform(2,0,0,2,0,0);
  const keep=pi;pi=idx;drawTpl(oc);pi=keep;
  renderInk(oc,off.width,off.height,note.pages[idx].strokes);
  return off;}
$('printB').onclick=async()=>{
  if(!note)return;
  await loadBgs();
  let el=document.getElementById('printDoc');
  if(!el){el=document.createElement('div');el.id='printDoc';document.body.appendChild(el);}
  el.innerHTML=note.pages.map((_,i)=>'<img class="pp" src="'+pageCanvas(i).toDataURL('image/png')+'">').join('');
  let stl=document.getElementById('printStyle');
  if(!stl){stl=document.createElement('style');stl.id='printStyle';document.head.appendChild(stl);}

function ensurePdfjs(){
  /* 로컬 번들 우선(완전 오프라인) → 실패 시에만 CDN 폴백. 로컬 워커는 동일 출처라 blob 우회 불필요 */
  return new Promise((res,rej)=>{
    if(window.pdfjsLib)return res(window.pdfjsLib);
    function load(src,worker,isLocal,next){
      const sc=document.createElement('script');
      sc.src=src;
      sc.onload=async()=>{try{
        const lib=window.pdfjsLib;
        if(isLocal){ lib.GlobalWorkerOptions.workerSrc=worker; }
        else{
          try{ // 사파리/아이패드: 교차출처 워커 차단 → blob 워커로 우회
            const r=await fetch(worker);if(!r.ok)throw 0;

          }catch(_){lib.GlobalWorkerOptions.workerSrc=worker;}
        }
        res(lib);}catch(e){rej(e);}};
      sc.onerror=()=>{ if(next)next(); else rej(new Error('offline')); };
      document.head.appendChild(sc);
    }
    load('/vendor/pdfjs/pdf.min.js','/vendor/pdfjs/pdf.worker.min.js',true,function(){
      load('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js','https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js',false,null);
    });
  });
}

async function importPdfBuffer(buf,name,meta){

      if(bytes>2000000){toast('용량 한도 — '+(i-1)+'쪽까지 불러왔어요');break;}   // 3.5M자는 사파리 쿼터(~5MB) 단독 초과 → 노트 전체 저장 실패 유발

       명시적으로 멈춰, 로컬에는 보이지만 다른 기기에는 사라지는 문서를 만들지 않는다. */

    if(syncChars>NOTE_SYNC_SAFE){delete s.notes[imported.id];s.cur=prev;_noteMem=s;toast('문서 보관함 용량이 찼어요 — 오래된 PDF 문서를 정리한 뒤 다시 가져와 주세요');return false;}
    try{await persistImportedState(s);}catch(err){delete s.notes[imported.id];s.cur=prev;_noteMem=s;try{window.PSSaveState.fail('note',err);}catch(_){}toast('PDF 문서를 저장하지 못했어요 — 저장 공간을 확인해 주세요');return false;}
    note=imported;pi=0;redoStack=[];$('nTitle').value=note.title;refreshTplSel();$('nTpl').value='blank';
    applyOrient();save();fit();updateUI();

/* ============ 데스크톱·아이패드 제작 최적화 ============ */
/* 줌·팬 — CSS transform 만 쓴다. 필기 좌표는 getBoundingClientRect 기준이라 확대 중에도 그대로 맞는다 */
const view={s:1,tx:0,ty:0};
function viewGeom(){const r=cv.getBoundingClientRect();return {Bx:r.left-view.tx,By:r.top-view.ty,cw:r.width/view.s,ch:r.height/view.s};}
function viewApply(){
  cv.style.transformOrigin='0 0';
  cv.style.transform=(view.s===1&&!view.tx&&!view.ty)?'':'translate('+view.tx+'px,'+view.ty+'px) scale('+view.s+')';
  const zb=$('zoomR');
  zb.style.display=view.s>1.01?'inline-flex':'none';
  zb.textContent=Math.round(view.s*100)+'% · 원래대로';
}
function viewReset(){view.s=1;view.tx=0;view.ty=0;viewApply();}
window.__nvReset=viewReset;
$('zoomR').onclick=viewReset;
function clampPan(g){
  const st=$('stage').getBoundingClientRect();
  const w=g.cw*view.s,h=g.ch*view.s,M=46;   /* 종이가 최소 46px 은 화면에 걸치게 */
  view.tx=Math.min(view.tx, st.right-M-g.Bx);
  view.tx=Math.max(view.tx, st.left+M-g.Bx-w);
  view.ty=Math.min(view.ty, st.bottom-M-g.By);
  view.ty=Math.max(view.ty, st.top+M-g.By-h);
}
function zoomAt(cx,cy,s2){
  const g=viewGeom();
  s2=Math.min(4,Math.max(1,s2));
  const ux=(cx-g.Bx-view.tx)/view.s, uy=(cy-g.By-view.ty)/view.s;
  view.s=s2;
  view.tx=cx-g.Bx-ux*s2; view.ty=cy-g.By-uy*s2;
  if(view.s<1.03){view.s=1;view.tx=0;view.ty=0;}
  else clampPan(g);
  viewApply();
}
/* 아이패드 터치 제스처 — 핀치 줌·두 손가락 팬, 두 손가락 탭=실행취소, 세 손가락 탭=다시 실행.
   펜 전용 모드에선 한 손가락으로 팬(확대 중일 때). 손바닥(넓은 접촉)은 제스처로 안 센다 */
(function(){
  const stg=$('stage'), tps=new Map();
  let gest=null, panOne=null;
  window.__nvMulti=()=>tps.size>=2;
  stg.addEventListener('pointerdown',e=>{
    if(e.pointerType!=='touch')return;
    if(Math.max(e.width||0,e.height||0)>40)return;            /* 손바닥 — 추적 제외 */
    tps.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(tps.size===2&&!(live&&!live._touch)){                  /* 펜으로 긋는 중엔 제스처 시작 안 함 */
      if(live&&live._touch)cancelLive();
      panOne=null;
      const p=[...tps.values()], g=viewGeom();
      gest={t0:Date.now(),taps:2,moved:0,g,
        d0:Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y)||1,
        mx0:(p[0].x+p[1].x)/2,my0:(p[0].y+p[1].y)/2,s0:view.s};
      gest.ux=(gest.mx0-g.Bx-view.tx)/view.s;
      gest.uy=(gest.my0-g.By-view.ty)/view.s;
    }else if(tps.size===3&&gest)gest.taps=3;
    else if(tps.size===1&&penOnly&&view.s>1.01)panOne={x:e.clientX,y:e.clientY,g:viewGeom()};
  },true);
  stg.addEventListener('pointermove',e=>{
    if(e.pointerType!=='touch'||!tps.has(e.pointerId))return;
    tps.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(gest&&tps.size===2){
      const p=[...tps.values()];
      const d=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y)||1;
      const mx=(p[0].x+p[1].x)/2,my=(p[0].y+p[1].y)/2;
      gest.moved=Math.max(gest.moved,Math.abs(d-gest.d0),Math.hypot(mx-gest.mx0,my-gest.my0));
      if(gest.moved>12){
        view.s=Math.min(4,Math.max(1,gest.s0*d/gest.d0));
        view.tx=mx-gest.g.Bx-gest.ux*view.s;
        view.ty=my-gest.g.By-gest.uy*view.s;
        clampPan(gest.g);viewApply();
      }
    }else if(panOne&&tps.size===1){
      view.tx+=e.clientX-panOne.x;view.ty+=e.clientY-panOne.y;
      panOne.x=e.clientX;panOne.y=e.clientY;
      clampPan(panOne.g);viewApply();
    }
  },true);
  function tEnd(e){
    if(e.pointerType!=='touch')return;
    tps.delete(e.pointerId);
    if(gest&&tps.size<2){
      if(gest.moved<12&&Date.now()-gest.t0<350&&e.type==='pointerup'){
        const b=gest.taps===2?$('undoB'):$('redoB');
        if(!b.disabled){b.click();toast(gest.taps===2?'실행취소':'다시 실행');}
      }
      if(view.s<1.03)viewReset();
      gest=null;
    }
    if(!tps.size)panOne=null;
  }
  stg.addEventListener('pointerup',tEnd,true);
  stg.addEventListener('pointercancel',tEnd,true);
  /* 데스크톱 — 트랙패드 핀치(Ctrl+휠로 들어옴)·Ctrl/⌘+휠 줌, 확대 중 휠 팬 */
  stg.addEventListener('wheel',e=>{
    if(e.ctrlKey||e.metaKey){e.preventDefault();zoomAt(e.clientX,e.clientY,view.s*Math.exp(-e.deltaY*0.01));}
    else if(view.s>1.01){e.preventDefault();const g=viewGeom();view.tx-=e.deltaX;view.ty-=e.deltaY;clampPan(g);viewApply();}
  },{passive:false});
  /* 사파리(맥) 트랙패드 핀치는 gesture 이벤트로 온다 — 터치 핀치가 이미 처리 중이면 무시 */
  let gs=null;
  stg.addEventListener('gesturestart',e=>{if(tps.size)return;e.preventDefault();gs={s0:view.s};});
  stg.addEventListener('gesturechange',e=>{if(!gs)return;e.preventDefault();zoomAt(e.clientX,e.clientY,gs.s0*e.scale);});
  stg.addEventListener('gestureend',()=>{gs=null;});
})();
/* 키보드 단축키(데스크톱) — B/P 볼펜 · N 연필 · H 형광펜 · T 텍스트 · E 지우개 · 1~5 · [ ] 굵기 · ⌘Z/⌘⇧Z · ←→ 페이지 */
document.addEventListener('keydown',e=>{
  if(document.body.classList.contains('memo-mode'))return;
  const tg=e.target;
  if(tg&&(tg.tagName==='INPUT'||tg.tagName==='TEXTAREA'||tg.tagName==='SELECT'||tg.isContentEditable))return;
  const mod=e.metaKey||e.ctrlKey, k=(e.key||'').toLowerCase();
  if(mod&&k==='z'){e.preventDefault();(e.shiftKey?$('redoB'):$('undoB')).click();return;}
  if(mod&&k==='y'){e.preventDefault();$('redoB').click();return;}
  if(mod||e.altKey)return;
  const tm={b:'pen',p:'pen',n:'pencil',h:'hl',t:'text',e:'eraser','1':'pen','2':'pencil','3':'hl','4':'text','5':'eraser'};
  if(tm[k]){const b=$('tools').querySelector('[data-t="'+tm[k]+'"]');if(b)b.click();return;}
  if(k==='['||k===']'){
    const sl=$('size'),st=(+sl.step||0.5)*2;
    size=Math.min(+sl.max,Math.max(+sl.min,size+(k===']'?st:-st)));sl.value=size;return;}
  if(e.key==='ArrowLeft'){$('pgPrev').click();return;}
  if(e.key==='ArrowRight'){$('pgNext').click();return;}
});
</script>
<script>
(function(){
  /* ══ 2.355 · 메모 = 폴더가 있는 메모장 ═══════════════════════════════════════════
     사용자: "맥의 기본앱인 메모처럼 폴더도 만들고 여러기능". 지금까지는 한 줄 목록 + 글상자 하나였다.
     이번 판: **폴더 · 검색 · 정렬 · 고정 · 체크리스트 줄**.
     ⚠ 저장 자리는 **그대로 `cs_notes_memo_v1` 배열**이다. 메모에 `folder`·`pinned`·`createdAt` 이 없으면
        읽을 때 채운다 — 옛 메모를 고쳐 쓰지 않고 **읽는 쪽에서** 맞춘다(2.334·2.336 과 같은 방식).
     ⚠ 폴더는 새 키 `cs_notes_folders_v1` 하나(이름만). 메모는 `folder` 에 폴더 id 를 든다.
        폴더를 지워도 **메모는 안 지운다** — '모든 메모'로 돌아온다(지우는 도구가 아니다).
     ⚠ 이 두 키는 **이 기기에만** 있다(동기화 목록에 없다 — 예전부터 그랬다). */
  var MK='cs_notes_memo_v1', FK='cs_notes_folders_v1';
  function load(){try{var a=JSON.parse(localStorage.getItem(MK)||'[]')||[];
    return a.map(function(m){ m.folder=m.folder||''; m.pinned=!!m.pinned; m.createdAt=m.createdAt||m.updatedAt||Date.now(); return m; });
  }catch(_){return [];}}
  function loadF(){try{return JSON.parse(localStorage.getItem(FK)||'[]')||[];}catch(_){return [];}}
  function persist(){try{localStorage.setItem(MK,JSON.stringify(memos));localStorage.setItem(FK,JSON.stringify(folders));try{window.PSSaveState.ok('memo');}catch(__){}return true;}catch(e){try{const n=Date.now();if(!window.__psQwT2||n-window.__psQwT2>15000){window.__psQwT2=n;toast('⚠︎ 저장 공간 부족 — 메모가 저장되지 않았어요');}}catch(__){}try{window.PSSaveState.fail('memo',e);}catch(__){}return false;}}
  function mesc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c];});}
  var memos=load(), folders=loadF(), cur=null, curFolder='__all', q='', sortBy='upd';
  /* ⚠ `Date.now()` 만으로 id 를 만들면 **같은 밀리초에 두 번 만들 때 겹친다**(실측: 폴더 둘을 잇달아
     만들었더니 같은 id 라 개수가 양쪽 다 1). 순번을 붙여 겹치지 않게 한다. */
  var __uidN=0;
  function mkId(p){ return p+Date.now().toString(36)+(++__uidN).toString(36); }
  var items=document.getElementById('memoItems');
  var ta=document.getElementById('memoText');
  /* ── 2.396 글씨 색 ──
     ⚠ 글상자(textarea)는 **글자마다 색을 가질 수 없다.** 그래서 편집기를 contenteditable 로 바꿨다.
     ⚠ 색은 인라인(style="color:…")이 아니라 **class(mc-*)로** 담는다 — 인라인 색은 어두운 화면에서 안 보인다.
     ⚠ 저장은 두 벌을 **늘 같이** 쓴다: `m.html`(꾸민 것) + `m.text`(순수 글). 제목·미리보기·검색은 여전히 m.text 를 본다.
        한 벌만 쓰면 색은 남고 검색이 죽거나, 검색은 살고 색이 사라진다. */
  var MC_KEYS=['n','r','o','g','b','p'];

  /* 붓으로 쓸 색값. n(기본)은 되돌리기용 표식이라 눈에 띄지 않는 값을 쓴다. */
  var MC_HEX={n:'#010203',r:'#e5484d',o:'#d97706',g:'#159a5b',b:'#2563eb',p:'#7c3aed'};
  var MC_BYC={};
  (function(){ for(var i=0;i<MC_KEYS.length;i++){ var k=MC_KEYS[i],h=MC_HEX[k],n=parseInt(h.slice(1),16);
    MC_BYC[h]=k; MC_BYC['rgb('+((n>>16)&255)+', '+((n>>8)&255)+', '+(n&255)+')']=k; } })();
  /* 저장본을 innerHTML 로 되돌리기 전에 **아는 것만 남긴다** — 붙여넣기로 들어온 것이 실행되지 않게. */
  function mcClean(root){
    var all=root.querySelectorAll('*');
    for(var i=all.length-1;i>=0;i--){ var el=all[i], t=el.tagName;
      if(t==='SCRIPT'||t==='STYLE'||t==='IFRAME'||t==='OBJECT'||t==='EMBED'){ el.parentNode.removeChild(el); continue; }
      if(t!=='SPAN'&&t!=='DIV'&&t!=='BR'&&t!=='B'&&t!=='I'&&t!=='U'&&t!=='P'){
        while(el.firstChild)el.parentNode.insertBefore(el.firstChild,el);
        el.parentNode.removeChild(el); continue; }
      var cls=(el.getAttribute('class')||'').split(/\s+/).filter(function(c){return /^mc-[nrogbp]$/.test(c);}).join(' ');
      if(t==='SPAN'&&!cls){ /* 아무것도 안 남은 마디는 벗겨 낸다 — 빈 껍데기가 쌓이지 않게 */
        while(el.firstChild)el.parentNode.insertBefore(el.firstChild,el);
        el.parentNode.removeChild(el); continue; }
      while(el.attributes.length)el.removeAttribute(el.attributes[0].name);

  /* 브라우저가 남긴 인라인 색·<font> 를 우리 class 로 바꾼다.
     ⚠ 색칩을 누른 뒤 **이어서 친 글자**는 이 손질이 끝난 뒤에 생긴다(실측: `style="color: rgb(124,58,237)"` 로 남았다).
        그래서 저장할 때마다 **사본을 떠서** 한 번 더 손질한다 — 살아 있는 화면을 건드리면 커서가 튄다. */
  function mcNorm(root){
    var els=(root||ta).querySelectorAll('[style],font');
    for(var i=0;i<els.length;i++){ var el=els[i];
      var c=(el.style&&el.style.color)||el.getAttribute('color')||'';
      var k=MC_BYC[c]||MC_BYC[String(c).toLowerCase()];
      if(!k)continue;
      /* ⚠ <font> 는 mcClean 이 통째로 벗겨 내는 태그다 — 여기서 class 만 달아 두면 색이 같이 날아간다.
         실측: 저장된 <font color="#e5484d">빨강</font> 이 그냥 '빨강' 이 됐다. 마디로 갈아 끼운다. */
      if(el.tagName==='FONT'){ var sp=document.createElement('span');

        el.parentNode.insertBefore(sp,el); el.parentNode.removeChild(el); el=sp; }
      try{ el.style.removeProperty('color'); }catch(_){}
      var cls=(el.getAttribute('class')||'').replace(/\bmc-[nrogbp]\b/g,'').replace(/\s+/g,' ').trim();

      if(!el.getAttribute('style'))el.removeAttribute('style'); } }
  /* 한 글자씩 따로 싸인 같은 색 마디를 하나로 합친다(사본에서만 — 살아 있는 화면에서 하면 커서를 잃는다). */
  function mcMerge(root){
    var sp=root.querySelectorAll('span[class^="mc-"]');

      while(a.nextSibling&&a.nextSibling.nodeType===1&&a.nextSibling.tagName==='SPAN'

  /* 저장할 모습 — 사본을 떠서 손질한 뒤 내놓는다. */
  function mcSnapshot(){

  function mcFromText(s){

  function taText(){ try{ return String(ta.innerText||'').replace(/\u00a0/g,' ').replace(/\n$/,''); }catch(_){ return ta.textContent||''; } }

  /* ⚠ 순서가 곧 뜻이다. mcClean 은 **아는 것만 남기므로** 인라인 색도 지운다 —
     먼저 mcNorm 으로 색을 class 로 옮겨 놓고 지워야 한다. 반대로 했더니 예전에 저장된 색이 통째로 날아갔다. */
  function taSet(m){ ta.innerHTML=m?((m.html!=null&&m.html!=='')?m.html:mcFromText(m.text)):'';

  function titleOf(m){var t=((m.text||'').trim().split('\n')[0]||'새 메모');return t.replace(/^-\s*\[[ x]\]\s*/,'').slice(0,40)||'새 메모';}
  function preview(m){var ls=(m.text||'').trim().split('\n');var p=ls.slice(1).join(' ').trim();return p?p.slice(0,52):'';}
  function fmt(ts){try{var d=new Date(ts);return (d.getMonth()+1)+'월 '+d.getDate()+'일';}catch(_){return '';}}
  function fmtFull(ts){try{var d=new Date(ts);return (d.getMonth()+1)+'/'+d.getDate()+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}catch(_){return '';}}

/* 1.926 — 폰: 그리기 도구(펜 종류·색·굵기·되돌리기)를 보드와 같은 '떠 있는 하단 도크' 카드로 옮긴다(사용자: 개인 노트 모바일 UI 일관성).
   위 바에는 모드·노트 선택·도구·제목만 남아 캔버스가 커진다. 767px 넘어가면 원래 자리로 되돌린다 */
(function(){
  if(!window.matchMedia)return;
  /* 2.597 — 디자인 6단계: 펜 묶음 도크를 데스크톱에도(작전판 도크와 같은 자리). 폭 조건을 없앤다 */
  var mq=window.matchMedia('(min-width:1px)'), dock=null;
  function apply(){
    var core=document.querySelector('.note-core'), ink=document.querySelector('.note-ink'); if(!core||!ink)return;
    if(mq.matches){
      if(!dock){ dock=document.createElement('div'); dock.id='nDock'; dock.setAttribute('role','toolbar'); dock.setAttribute('aria-label','그리기 도구'); document.body.appendChild(dock); }
      if(core.parentNode!==dock){ dock.appendChild(core); dock.appendChild(ink); }
      document.body.classList.add('note-dock');
    }else{
      if(dock&&core.parentNode===dock){ var bar=document.querySelector('.bar'), anchor=document.getElementById('nTplWrap'); if(bar){ bar.insertBefore(core,anchor||null); bar.insertBefore(ink,anchor||null); } }
      document.body.classList.remove('note-dock');
    }
    try{ if(typeof fit==='function')fit(); }catch(_){}
  }
  apply();
  if(mq.addEventListener)mq.addEventListener('change',apply); else if(mq.addListener)mq.addListener(apply);
})();
</script>
