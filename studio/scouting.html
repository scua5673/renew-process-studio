<html lang="ko">
<head>

<title>스카우팅 · 후보 선수 DB</title>
<script>document.documentElement.classList.add('ps-page-scouting')</script>
<script src="storage.js"></script>
<script src="scouting-store.js"></script>
<script src="perms.js"></script>
<script src="/vendor/qrcode.js"></script><!-- 2.617 -->

<link rel="stylesheet" href="/vendor/fonts.css?v=2.552b"><link rel="stylesheet" href="/vendor/tokens.css?v=2.552b">
<style>
/* 스카우팅 v1 — 후보 선수 DB. 토큰은 에디터형 리디자인 정본(피그마 핸드오프 §3) 값 그대로, 새 색 없음 */
:root{
  --ink:#0f1420;--text:#374151;--text2:#4b5563;--muted:#646A73;--faint:#8A9099;--ghost:#b3bac6;
  --border:#e6e8ee;--border2:#eef0f4;--surface:#fff;--bg:#f7f8fa;--canvas:#eceef2;--chip:#f2f4f7;
  --accent:#3a6df0;--accent-soft:#edf2fe;--accent-text:#2c54c4;   /* 2.018 — 앱 파랑 하나로(3a6df0) */--red:#c92a3d;--green:#0e7a5f;--amber:#d97706;
}
body.fmdark{
  --ink:#ECEFF4;--text:#C6CDD6;--text2:#AEB6C2;--muted:#8B93A0;--faint:#8A9099;--ghost:#565E6A;
  --border:#23262C;--border2:#1C2027;--surface:#15181D;--bg:#0C0E11;--canvas:#101216;--chip:#1C2027;
  --accent-soft:#16233F;--accent-text:#7DA4F5;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;margin:0;}
body{background:var(--bg);color:var(--text);font-family:'Pretendard Variable','Pretendard',-apple-system,system-ui,'Apple SD Gothic Neo',sans-serif;font-size:14px;line-height:1.5;overflow:hidden;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;color:var(--text);}
/* ── 상단바 50px ── */
.sc-top{display:flex;align-items:center;gap:12px;height:50px;padding:0 14px;background:var(--surface);border-bottom:1px solid var(--border);}
.sc-title{font-size:13px;font-weight:800;color:var(--ink);white-space:nowrap;}
.sc-count{font-size:11px;color:var(--faint);white-space:nowrap;}
.sc-search{flex:1 1 auto;display:flex;align-items:center;gap:7px;max-width:520px;height:34px;padding:0 11px;border:1px solid var(--border);border-radius:8px;background:var(--bg);}
.sc-search svg{flex:0 0 auto;color:var(--muted);}
.sc-search input{flex:1;border:0;background:transparent;outline:0;font-size:13px;min-width:0;}
.sc-search input::placeholder{color:var(--ghost);}
.sc-top .spacer{flex:1 0 8px;}
.sc-tbtn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 11px;border:1px solid var(--border);border-radius:6px;background:var(--surface);color:var(--text);font-size:13px;font-weight:600;white-space:nowrap;}
.sc-tbtn:hover{background:var(--chip);}
/* ── 팀 아이덴티티 밴드 ── */
.sc-band{display:flex;align-items:center;gap:10px;height:44px;padding:0 14px;background:var(--surface,#fff);border-bottom:3px solid var(--band,#2563eb);}   /* 2.592 — 파란 통판 → 흰 줄, 팀 색은 밑선 3px 로만(색 고르기·엠블럼 기능 그대로). 앱에서 유일한 «채운 띠» 였다 */
.sc-emblem{flex:0 0 30px;width:30px;height:30px;padding:0;border:1px dashed rgba(255,255,255,.55);border-radius:50%;background:rgba(255,255,255,.14);color:var(--bandtxt,#fff);font-size:13px;overflow:hidden;display:flex;align-items:center;justify-content:center;}
.sc-emblem img{width:100%;height:100%;object-fit:cover;}
.sc-emblem.has{border-style:solid;border-color:rgba(255,255,255,.4);background:var(--surface);}
.sc-bandname{flex:1 1 auto;min-width:0;max-width:340px;height:32px;padding:0 8px;border:0;border-radius:6px;background:transparent;color:var(--text,#14161A);font-size:13px;font-weight:800;outline:0;}
.sc-bandname::placeholder{color:var(--faint);opacity:1;}
.sc-bandname:focus{background:var(--surface-2);}
.sc-bandcolor{margin-left:auto;display:inline-flex;align-items:center;gap:6px;color:var(--dim);font-size:11px;font-weight:600;cursor:pointer;}
.sc-bandcolor input{width:22px;height:22px;padding:0;border:1px solid #D3D7DD;border-radius:50%;background:transparent;cursor:pointer;-webkit-appearance:none;appearance:none;}
.sc-bandcolor input::-webkit-color-swatch-wrapper{padding:1px;}
.sc-bandcolor input::-webkit-color-swatch{border:0;border-radius:50%;}
/* ── 본문 3패널 ── */
.sc-main{display:flex;height:calc(100% - 94px);}
/* 레일 폭 = 내용물에 딱 맞춤(가장 긴 라벨 기준) — 긴 커스텀 태그만 140px에서 말줄임 */
.sc-rail{flex:0 0 auto;width:max-content;max-width:140px;overflow-y:auto;padding:8px 6px;background:var(--surface);border-right:1px solid var(--border);}
.sc-sec{margin:0 0 2px;padding-left:8px;font-size:10px;font-weight:600;letter-spacing:.04em;color:var(--faint);}
.sc-sec:not(:first-child){margin-top:7px;}
.sc-chips{display:flex;flex-wrap:wrap;gap:5px;}
.sc-chip{padding:4px 10px;border:1px solid var(--border);border-radius:99px;background:var(--surface);color:var(--text2);font-size:11px;font-weight:600;}
.sc-chip.on{background:var(--ink);border-color:var(--ink);color:var(--surface);}
.sc-chip.add{border-style:dashed;color:var(--muted);}
/* 필터 초기화 — 다른 행과 같은 왼쪽 정렬 리스트 행(타이트) */
.sc-reset{margin-top:7px;width:100%;padding:2px 8px;border:0;border-radius:6px;background:transparent;color:var(--muted);font-size:11px;font-weight:600;text-align:left;line-height:1.5;white-space:nowrap;}
.sc-reset:hover{background:var(--chip);}
/* 좌측 레일 필터 — 1열 리스트, 여백 최소(컴팩트). 활성은 내비 아이템 문법(accent-soft). 상세 패널 칩은 그대로 */
.sc-rail .sc-chips{flex-direction:column;gap:0;}
.sc-rail .sc-chip{width:100%;text-align:left;padding:2px 8px;border:0;border-radius:6px;background:transparent;color:var(--text2);font-size:11px;line-height:1.5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sc-rail .sc-chip:hover{background:var(--chip);}
.sc-rail .sc-chip.on{background:var(--accent-soft);color:var(--accent-text);font-weight:600;}
.sc-rail .sc-chip.add{border:0;color:var(--muted);font-size:11px;text-align:left;}
.sc-empty-phone{display:none;}
/* ── 중앙 ── */
.sc-center{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;background:var(--canvas);}
.sc-quick{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 14px;background:var(--surface);border-bottom:1px solid var(--border2);}
.sc-quick .ql{font-size:11px;font-weight:600;color:var(--faint);letter-spacing:.04em;}
.sc-quick input{height:32px;padding:0 10px;border:1px solid var(--border);border-radius:6px;background:var(--bg);font-size:13px;outline:0;}
.sc-quick input:focus{border-color:var(--accent);}
.sc-quick .qname{width:140px;}.sc-quick .qclub{width:130px;}
.sc-qpos{display:flex;flex-wrap:wrap;gap:3px;}
.sc-qpos button{padding:3px 7px;border:1px solid var(--border);border-radius:6px;background:var(--surface);color:var(--muted);font-size:10px;font-weight:600;}
.sc-qpos button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-text);}
/* 폰 연속 기록 — ＋ 플로팅 버튼과 기록 시트 (폰에서만 표시) */
.sc-fab{display:none;position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));width:54px;height:54px;border:0;border-radius:50%;
  background:var(--accent);color:#fff;font-size:26px;font-weight:600;box-shadow:0 6px 18px rgba(15,23,42,.25);z-index:55;}
.sc-qsheet{display:none;position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--surface);border-top:1px solid var(--border);
  border-radius:16px 16px 0 0;box-shadow:0 -8px 30px rgba(15,23,42,.25);padding:14px 16px calc(14px + env(safe-area-inset-bottom));}
.sc-qsheet.on{display:block;}
.sc-qsheet .qs-hd{display:flex;align-items:center;margin-bottom:10px;}
.sc-qsheet .qs-hd b{flex:1;font-size:13px;color:var(--ink);}
.sc-qsheet input{width:100%;height:40px;margin-bottom:8px;padding:0 12px;border:1px solid var(--border);border-radius:9px;background:var(--bg);font-size:14px;outline:0;}
.sc-qsheet input:focus{border-color:var(--accent);}
.sc-qsheet .qs-pos{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px;}
.sc-qsheet .qs-pos button{min-width:42px;padding:7px 0;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--muted);font-size:12px;font-weight:600;}
.sc-qsheet .qs-pos button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-text);}
.sc-qsheet .qs-actions{display:flex;gap:8px;}
.sc-qsheet .qs-next{flex:1;height:42px;border:0;border-radius:9px;background:var(--accent);color:#fff;font-size:14px;font-weight:600;}
.sc-qsheet .qs-done{flex:0 0 84px;height:42px;border:1px solid var(--border);border-radius:9px;background:var(--surface);color:var(--text2);font-size:13px;font-weight:600;}
.sc-qadd{height:32px;padding:0 15px;border:0;border-radius:8px;background:var(--accent);color:#fff;font-size:13px;font-weight:600;box-shadow:0 3px 10px rgba(37,99,235,.3);}
.sc-grid-wrap{flex:1 1 auto;overflow-y:auto;padding:14px;}
.sc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;}
.sc-card{display:flex;gap:10px;align-items:center;padding:11px;border:1px solid var(--border);border-radius:12px;background:var(--surface);cursor:pointer;transition:box-shadow .12s ease,transform .12s ease;}
.sc-card:hover{box-shadow:0 8px 24px rgba(15,23,42,.12);transform:translateY(-1px);}
.sc-card.sel{border-color:var(--accent);background:var(--accent-soft);}
.sc-ava{flex:0 0 44px;width:44px;height:44px;border-radius:10px;background:var(--chip);color:var(--muted);font-size:14px;font-weight:800;display:flex;align-items:center;justify-content:center;overflow:hidden;}
.sc-ava img{width:100%;height:100%;object-fit:cover;}
.sc-cbody{min-width:0;flex:1;}
.sc-cname{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sc-grade{flex:0 0 auto;min-width:18px;padding:1px 5px;border-radius:6px;background:var(--ink);color:var(--surface);font-size:10px;font-weight:800;text-align:center;}
.sc-cmeta{margin-top:2px;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sc-cpos{margin-top:4px;display:flex;flex-wrap:wrap;gap:3px;}
.sc-cpos span{padding:1px 6px;border-radius:5px;background:var(--chip);color:var(--text2);font-size:10px;font-weight:600;}
.sc-empty{padding:60px 20px;text-align:center;color:var(--muted);}
.sc-attach{margin-top:6px;height:24px;padding:0 9px;border:1px solid var(--border);border-radius:6px;background:var(--surface);color:var(--text2);font-size:10px;font-weight:600;}
.sc-attach.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-text);}
.sc-attach:hover{background:var(--chip);}
.sc-empty b{display:block;margin-bottom:6px;color:var(--ink);font-size:14px;}
/* ── 우측 상세 ── */
.sc-detail{flex:0 0 300px;overflow-y:auto;background:var(--surface);border-left:1px solid var(--border);display:none;}
.sc-detail.on{display:block;}
.sc-dhead{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--border2);position:sticky;top:0;background:var(--surface);z-index:2;}
.sc-dhead .t{flex:1;font-size:13px;font-weight:800;color:var(--ink);}
.sc-x{width:26px;height:26px;border:0;border-radius:7px;background:transparent;color:var(--muted);font-size:14px;}
.sc-x:hover{background:var(--chip);}
.sc-dbody{padding:14px;}
.sc-photo{position:relative;width:96px;height:96px;margin:0 auto 6px;border-radius:14px;background:var(--chip);color:var(--muted);font-size:26px;font-weight:800;display:flex;align-items:center;justify-content:center;overflow:hidden;}
.sc-photo img{width:100%;height:100%;object-fit:cover;}
.sc-photorow{display:flex;justify-content:center;gap:6px;margin-bottom:12px;}
.sc-mini{height:24px;padding:0 9px;border:1px solid var(--border);border-radius:6px;background:var(--surface);color:var(--muted);font-size:10px;font-weight:600;}
.sc-frow{display:flex;align-items:center;gap:8px;margin-bottom:7px;}
.sc-frow>label{flex:0 0 52px;font-size:11px;font-weight:600;color:var(--faint);}
.sc-frow>input,.sc-frow>select{flex:1;min-width:0;height:28px;padding:0 9px;border:1px solid var(--border);border-radius:6px;background:var(--bg);font-size:13px;outline:0;}
.sc-frow>input:focus{border-color:var(--accent);}
.sc-frow>.fx{flex:0 0 16px;border:0;background:none;color:var(--ghost);font-size:12px;padding:0;cursor:pointer;}
.sc-frow .half{flex:1 1 0;}
.sc-dpos{display:flex;flex-wrap:wrap;gap:3px;flex:1;}
.sc-dpos button{padding:3px 7px;border:1px solid var(--border);border-radius:6px;background:var(--surface);color:var(--muted);font-size:10px;font-weight:600;}
.sc-dpos button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-text);}
.sc-dtags{display:flex;flex-wrap:wrap;gap:4px;flex:1;}
.sc-dsec{margin:16px 0 8px;font-size:11px;font-weight:600;letter-spacing:.04em;color:var(--faint);}
.sc-frow>textarea.sc-ta{flex:1;min-width:0;min-height:58px;padding:6px 9px;border:1px solid var(--border);border-radius:6px;background:var(--bg);font:inherit;font-size:13px;line-height:1.4;color:inherit;resize:vertical;outline:0;}.sc-frow>textarea.sc-ta:focus{border-color:var(--accent);}
.sc-frow>label.top{align-self:flex-start;padding-top:7px;}
.sc-contact{display:flex;gap:5px;margin-bottom:6px;}
.sc-contact select{flex:0 0 82px;height:28px;border:1px solid var(--border);border-radius:6px;background:var(--bg);font-size:11px;}
.sc-contact input{flex:1;min-width:0;height:28px;padding:0 8px;border:1px solid var(--border);border-radius:6px;background:var(--bg);font-size:12px;outline:0;}
.sc-contact .del{flex:0 0 26px;border:0;border-radius:6px;background:transparent;color:var(--ghost);}
.sc-rate{flex:1;display:flex;align-items:center;gap:3px;}
.sc-rate button{flex:1;height:28px;border:1px solid var(--border);border-radius:6px;background:var(--surface);color:var(--ghost);font-size:11px;font-weight:600;}
.sc-rate button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-text);}
.sc-rate .rd{flex:0 0 16px;height:auto;border:0;background:none;color:var(--ghost);font-size:11px;padding:0;}
.sc-grade.avg{background:var(--chip);color:var(--text2);}
.sc-gr{display:flex;gap:4px;}
.sc-gr button{flex:1;height:28px;border:1px solid var(--border);border-radius:6px;background:var(--surface);color:var(--muted);font-size:12px;font-weight:800;}
.sc-gr button.on{background:var(--ink);border-color:var(--ink);color:var(--surface);}
textarea.sc-memo{width:100%;min-height:64px;padding:8px 9px;border:1px solid var(--border);border-radius:8px;background:var(--bg);font-size:13px;resize:vertical;outline:0;}
textarea.sc-memo:focus{border-color:var(--accent);}
.sc-obs-add{display:flex;gap:6px;margin-bottom:8px;}
.sc-obs-add input{flex:1;height:28px;padding:0 9px;border:1px solid var(--border);border-radius:6px;background:var(--bg);font-size:12px;outline:0;}
.sc-obs-add button{height:28px;padding:0 11px;border:1px solid var(--border);border-radius:6px;background:var(--surface);font-size:11px;font-weight:600;color:var(--text2);}
.sc-obs{list-style:none;margin:0;padding:0;}
.sc-vids{list-style:none;margin:0;padding:0;}
.sc-vids li{padding:6px 9px;margin-bottom:5px;border:1px solid var(--border2);border-radius:8px;background:var(--bg);font-size:11px;}
.sc-vids li .d{font-size:10px;color:var(--faint);font-weight:600;margin-bottom:1px;display:flex;justify-content:space-between;}
.sc-vids li .rm{border:0;background:none;color:var(--ghost);font-size:10px;cursor:pointer;}
.sc-vids li a{display:block;color:var(--accent-text);text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sc-vids li a:hover{text-decoration:underline;}
.sc-obs li{padding:7px 9px;margin-bottom:5px;border:1px solid var(--border2);border-radius:8px;background:var(--bg);font-size:12px;}
.sc-obs li .d{font-size:10px;color:var(--faint);font-weight:600;margin-bottom:1px;display:flex;justify-content:space-between;}
.sc-obs li .rm{border:0;background:none;color:var(--ghost);font-size:10px;cursor:pointer;}
.sc-danger{margin-top:20px;width:100%;height:32px;border:1px solid #ecc9c6;border-radius:8px;background:transparent;color:var(--red);font-size:12px;font-weight:600;}
.sc-privacy{margin-top:10px;font-size:10px;color:var(--faint);line-height:1.5;}
/* ── 포인트 설정·평가지 ── */
.sc-ptset,.sc-pteval{display:none;position:fixed;inset:0;z-index:80;background:var(--bg);flex-direction:column;}
.sc-ptset.on,.sc-pteval.on{display:flex;}
.sc-ptset-body,.sc-pteval-body{flex:1;min-height:0;overflow-y:auto;padding:14px;max-width:860px;width:100%;margin:0 auto;}
.pt-group{margin-bottom:12px;border:1px solid var(--border);border-radius:12px;background:var(--surface);overflow:hidden;}
.pt-group-h{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--border2);}
.pt-group-h input.gname{flex:0 0 220px;height:28px;padding:0 8px;border:1px solid var(--border);border-radius:6px;background:var(--bg);font-size:13px;font-weight:600;outline:0;}
.pt-group-h .gpos{flex:1;display:flex;flex-wrap:wrap;gap:3px;}
.pt-group-h .gpos button{padding:2px 6px;border:1px solid var(--border);border-radius:5px;background:var(--surface);color:var(--muted);font-size:10px;font-weight:600;}
.pt-group-h .gpos button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-text);}
.pt-group-h .gdel{border:0;background:none;color:var(--ghost);font-size:13px;cursor:pointer;}
.pt-group textarea{display:block;width:100%;min-height:120px;padding:10px 12px;border:0;background:transparent;font-size:12px;line-height:1.7;resize:vertical;outline:0;color:var(--text);}
.pt-sec{margin:14px 0 6px;font-size:11px;font-weight:800;letter-spacing:.04em;color:var(--faint);}
.pt-q{display:flex;align-items:center;gap:10px;padding:5px 0;border-bottom:1px solid var(--border2);}
.pt-q .qt{flex:1;font-size:13px;color:var(--text);}
.pt-q .sc-rate{flex:0 0 170px;}
.pt-empty{padding:40px;text-align:center;color:var(--muted);}

/* 1.926 — 포지션 그룹 카드 격자 */
.pt-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;padding:2px 0 8px;}
/* 1.976 — 접이식 카드(사용자): 한 열 목록, 머리(이름·포지션·질문 수·화살표) 누르면 그 자리에서 펼침. 데스크톱은 카드 폭 넓게 */
.pt-cards.pt-acc{grid-template-columns:minmax(0,1fr);gap:8px;max-width:920px;}
.pt-acc .pt-card{display:block;min-height:0;padding:0;overflow:hidden;cursor:default;}
.pt-acc .pt-card:hover{box-shadow:none;border-color:var(--border);}

<script>
(function(){
"use strict";
var esc=(window.PSSafe&&PSSafe.html)||function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});};
var $=function(id){return document.getElementById(id);};
var POS=["GK","CB","LB","RB","WB","DM","CM","AM","LM","RM","LW","RW","FW","ST"];
var GRADES=["S","A","B","C","D"];
var KEY="cs_scout_targets_v1";
var scPageClient=PSScoutStore.createClient(window),scPageSnapshot=null;
var scPageSaves=PSSaveState.createTracker('scouting',function(){return scPageScope();});
window.psHasPending=function(){return scPageSaves.hasPending();};
window.psFlushPendingReady=function(){return scPageSaves.ready(true).then(function(){return PSStorage.sharedReady(KEY);});};
function scPageState(message){var e=document.getElementById('scStoreState');if(!e){e=document.createElement('div');e.id='scStoreState';document.body.appendChild(e);}e.textContent=message||'';e.hidden=!message;document.body.classList.toggle('sc-pending',!!message);}
function scPageLoad(){
  if(!scPageClient.state.verified){scPageState('팀의 후보 자료와 저장소를 확인하고 있어요.');return;}
  var d=scPageClient.read(),r=d.scoutRegistry;
  db={players:Object.keys(r.candidates).filter(function(id){return !r.candidates[id].archivedAt;}).map(function(id){var c=r.candidates[id],p=PSScoutStore.copy(c.source||{}),i=c.info;p.id=id;p._candidateId=id;p.nameKr=i.name||'';p.num=i.num||'';p.foot=i.foot||'';p.club=i.club||'';p.grade=i.grade||'';p.points=PSScoutStore.copy(c.points||{});p.ratings=PSScoutStore.copy(c.ratings||{});p.pos=p.pos||[];p.tags=p.tags||[];p.contacts=p.contacts||[];p.videos=p.videos||[];p.custom=p.custom||{};p.obs=p.obs||[];['nameEn','nat','height','weight','photo'].forEach(function(k){if(i.profile&&i.profile[k]!=null)p[k]=PSScoutStore.copy(i.profile[k]);else delete p[k];});return p;}),meta:PSScoutStore.copy(r.meta||{})};
  scPageSnapshot=PSScoutStore.copy(db);scPageState('');
}
function scPageSave(){
  try{scPageClient.check();var d=PSScoutStore.copy(scPageClient.state.doc),stamp=scPageClient.stamp(),known={};
    db.players.forEach(function(p){
      var cid=p._candidateId;
      if(!cid){PSScoutStore.importLegacy(d,{players:[p]},[p.id],false);cid='db:'+p.id;p._candidateId=cid;p.id=cid;}
      var c=d.scoutRegistry.candidates[cid];if(!c)throw new Error('후보 자료가 바뀌었습니다. 다시 열어 주세요.');known[cid]=true;
      [['name','nameKr'],['num','num'],['foot','foot'],['club','club'],['grade','grade']].forEach(function(pair){PSScoutStore.edit(d,cid,pair[0],p[pair[1]]||'',stamp);});
      ['nameEn','nat','height','weight','photo'].forEach(function(k){PSScoutStore.edit(d,cid,'profile.'+k,p[k],stamp);});
      Object.keys(p.points||{}).forEach(function(k){if(c.points[k]!==p.points[k])PSScoutStore.score(d,cid,k,p.points[k],stamp);});
      Object.keys(p.ratings||{}).forEach(function(k){if(c.ratings[k]!==p.ratings[k]){c.ratings[k]=p.ratings[k];c.edits['ratings.'+k]=stamp;}});
      var before=(scPageSnapshot&&scPageSnapshot.players||[]).find(function(x){return x._candidateId===cid;}),canonical=['id','_candidateId','nameKr','nameEn','num','foot','club','grade','nat','height','weight','photo','points','ratings','updatedAt'];
      var sourceKeys=Array.from(new Set(Object.keys(p).concat(Object.keys(before||{})))).filter(function(k){return canonical.indexOf(k)<0&&typeof p[k]!=='function'&&k.indexOf('__')!==0;});
      if(before&&sourceKeys.some(function(k){return JSON.stringify(before[k])!==JSON.stringify(p[k]);})){
        var original=PSScoutStore.copy(c.source||{});sourceKeys.forEach(function(k){if(p[k]===undefined)delete original[k];else original[k]=PSScoutStore.copy(p[k]);});
        canonical.forEach(function(k){delete original[k];});c.source=original;c.sourceEdit=stamp;
      }
    });
    (scPageSnapshot&&scPageSnapshot.players||[]).forEach(function(p){if(!known[p._candidateId])PSScoutStore.archive(d,p._candidateId,Date.now(),stamp);});
    if(JSON.stringify(d.scoutRegistry.meta)!==JSON.stringify(db.meta)){d.scoutRegistry.metaHistory=d.scoutRegistry.metaHistory||[];d.scoutRegistry.metaHistory.push(PSScoutStore.copy(d.scoutRegistry.meta));d.scoutRegistry.meta=PSScoutStore.copy(db.meta);d.scoutRegistry.metaEdit=stamp;}
    var pending=scPageClient.save(d);scPageSaves.track(KEY,pending,function(){return scPageClient.retry();});pending.catch(function(e){scPageState('기기 저장 확인이 필요해요. '+e.message);});scPageSnapshot=PSScoutStore.copy(db);
  }catch(e){scPageState(e.message);toast(e.message);}
}
function scPageHydrate(){

    if(/[?&]view=evaluate\b/.test(location.search)){document.body.classList.add('sc-eval-only');var cid=new URLSearchParams(location.search).get('candidate'),p=db.players.find(function(p){return p._candidateId===cid;});if(p)openPtEval(p);else scPageState('후보를 찾을 수 없거나 보관된 기록입니다.');}
  }).catch(function(e){scPageState(e.message);});
}

var DEFAULT_TAGS=["프로","대학","고교","클럽","해외","자유계약"];

/* 프로세스 기본세트 — 포지션 그룹별 스카우팅 포인트(체크 질문). '## '로 시작하는 줄 = 섹션, 나머지 줄 = 질문 */
var PS_POINT_TEMPLATE=[
{name:"공격수(FW)",positions:["FW","ST"],text:"## 오프 더 볼 · 움직임\n최전방 수비수 역할을 수행하는가?\n동료들이 정렬되었을 때 가장 먼저 움직이는가?\n상대 수비수를 한쪽 측면으로 몰아내는가?\n동료 미드필더와 적극 소통하는가?\n## 오프 더 볼 · 프레싱\n상대 수비의 빌드업을 측면으로 몰고 백패스를 유도하는가?\n상대 수비가 GK에게 백패스할 때 적절히 프레싱하는가?\n빠르게 볼 소유 상대에게 접근하는가?\n드리블하는 상대 수비에게 압박을 가하고 볼을 뺏는가?\n부정확한 상대 패스를 예측하고 빼앗는가?\n볼을 향해 공격적인 태도와 적극성을 보이는가?\n## 온 더 볼 · 움직임\n필드 공간의 너비와 깊이를 잘 활용하는가?\n오프사이드 라인을 활용해 상대 사각지대를 돌파하는가?\n롱볼을 머리로 받거나 연결하는 데 능숙한가?\n공중볼 경합에서 적극적이고 동료에게 세컨볼을 전달하는가?\n## 온 더 볼 · 빌드업\n상대 수비수와 맞서서 공을 지키는 데 능숙한가?\n팀 동료 지원을 위해 볼을 지키는 데 능숙한가?\n동료 플레이메이커와의 콤비 플레이가 좋은가?\n상대 수비를 따돌리고 2대1 패스의 기점 역할을 하는가?\n## 온 더 볼 · 기회 창출\n상대의 사각지대를 파고들어 득점 기회를 창출하는가?\n수직적 움직임으로 팀원에게 공간을 만들어주는가?\n페널티킥이나 프리킥을 얻기 위해 박스 안에서 과감하게 움직이는가?"},
{name:"윙포워드·측면 미드필더(WF/SMF)",positions:["LW","RW","LM","RM"],text:"## 오프 더 볼 · 움직임\n공과 상대 선수를 동시에 시야에 두고 있는가?\n상대 선수가 마크가 붙은 선수에게 패스하도록 유도하는가?\n주변 동료 선수들과 적극적으로 소통하는가?\n상대에게 뚫렸을 때 뒤로 물러나 동료를 지원하는가?\n## 오프 더 볼 · 프레싱\n상대의 수직 패스를 차단하여 측면 패스를 유도하는가?\n상대 수비를 바깥쪽으로 밀어내고 플레이를 방해하는가?\n상대의 부정확한 패스를 예측하고 빼앗는가?\n볼 탈취에 대한 결단력과 집중력을 보여주는가?\n## 온 더 볼 · 움직임\nSB, CB, DMF를 위한 패스 스테이션 역할을 하는가?\n하프/센터 스페이스에서 패싱 스테이션 역할을 하는가?\n항상 달릴 준비가 되어 있고 패스를 요청하는가?\n반대 측면 플레이 시 파 포스트에서 득점 시도를 하는가?\n## 온 더 볼 · 기회 창출\n오프사이드 라인을 활용해 대각선으로 안쪽 돌파를 하는가?\n하프 스페이스에서 원투패스로 득점 기회를 만드는가?\n박스 안으로 과감하게 드리블을 하는가?\n상대 수비 라인 뒤로 날카로운 크로스를 시도하는가?"},
{name:"공격형·중앙 미드필더(AMF/CMF)",positions:["AM","CM"],text:"## 오프 더 볼 · 움직임\n항상 공격적으로 상대 공을 처리할 준비가 되어있는가?\n동료 공격수와 계속 짝을 이뤄 움직이는가?\n동료를 돕거나 도움을 받을 수 있는 상황을 만드는가?\n뒤에 있는 동료 MF와 의사소통을 하는가?\n## 오프 더 볼 · 프레싱\n상대 DMF가 패스를 받을 때 공격적으로 압박하는가?\n상대 선수 뒤에서 볼을 탈취하기 위해 노력하는가?\n상대 실수를 예측하고 효과적으로 공을 탈취하는가?\n압박 상황에서 볼 회수를 위한 적극성을 보여주는가?\n## 온 더 볼 · 움직임\n세컨드 볼을 획득한 후 공을 지켜내는가?\n공 획득 후 즉시 필드 중앙을 점유하는가?\n2대1 패스가 필요할 때 FW/WF를 능숙하게 활용하는가?\n측면 패스를 원활하게 제공하는가?\n## 온 더 볼 · 빌드업\n상대를 향해 빠르게 드리블 후 정확한 패스를 연결하는가?\n볼 획득 즉시 공격 전환을 위한 준비가 되어 있는가?\n측면 선수들과 원투 패스로 박스 침투를 시도하는가?\n## 온 더 볼 · 기회 창출\n상황에 따라 세컨드 스트라이커 역할을 수행하는가?\n박스 안으로 돌파하여 마무리를 시도하는가?\n2대1 패스로 상대 파이널 써드로 쇄도하는가?\n중거리 슈팅을 시도하는가?\n항상 득점할 의지를 보여주는가?"},
{name:"수비형 미드필더(DMF)",positions:["DM"],text:"## 오프 더 볼 · 움직임\n스위퍼 역할을 효과적으로 수행하는가?\n불필요하게 중앙에서 벗어나지 않고 플레이하는가?\n상대가 측면 라인을 돌파할 때 적절히 대응하는가?\n필요시 CB 역할을 맡아 숫자 균형을 맞추는가?\n수비와 공격 사이의 간격을 잘 조정하는가?\n## 오프 더 볼 · 프레싱\n압박과 협력 수비를 리드하고 패스 경로를 차단하는가?\n공중볼 경합에서 용감하게 경쟁하고 공간을 창출하는가?\n상대의 패스를 예측하고 패스 경로를 차단하는가?\n## 온 더 볼 · 움직임\n볼 터치를 최소화하며 전진하고 빠른 공격 전환을 하는가?\n경기장의 폭과 깊이를 효과적으로 활용하는가?\n수비 라인 앞에서 볼을 따라가되 역습에 대비하는가?\n## 온 더 볼 · 빌드업\n빠르고 짧은 패스로 MF와 연결하고 함께 전진하는가?\n삼각 플레이를 위한 패스 조합의 출발점이 되는가?\n상대 미드필더가 촘촘할 때 대각선 전환을 시도하는가?\n동료 수비수를 위한 공간을 만들어주는가?\n## 온 더 볼 · 기회 창출\n팀이 상대 골라인으로 쇄도할 때 득점을 시도하는가?"},
{name:"사이드백(SB)",positions:["LB","RB","WB"],text:"## 오프 더 볼 · 움직임\n상대 패스 경로를 차단하고 안쪽을 봉쇄하는가?\n상대를 외곽으로 밀어내고 크로스를 방어하는가?\n대각선 패스와 돌파를 예측하고 대응하는가?\n볼이 뒤에 있을 때 신속히 복귀하고 압박하는가?\n## 오프 더 볼 · 프레싱\n안쪽에서 바깥쪽으로 효과적으로 프레싱하는가?\n상대 윙어를 선제적으로 압박하고 돌파를 차단하는가?\n반대편 공격 시 중앙으로 이동하여 CB를 지원하는가?\n상대 크로스 상황에서 적절히 대응하는가?\n## 온 더 볼 · 움직임\n대각선 패스가 가능한 위치에서 움직이는가?\n자기편 골대 근처에서 위험한 드리블을 하지 않는가?\n하프 스페이스에서 페널티 박스 안으로 쇄도하는가?\nWF가 안쪽으로 커팅할 때 윙 포지션을 점유하는가?\n반대편 공격 시 역습에 대비하는가?\n## 온 더 볼 · 빌드업\n패스 스테이션 역할을 위해 넓게 포지셔닝하는가?\n전방을 주시하며 수직적인 패스를 정확히 전달하는가?\nWF가 하프 스페이스에 있을 때 원투패스 기점이 되는가?\n정확하고 날카로운 패스를 안쪽으로 공급하는가?\n## 온 더 볼 · 기회 창출\nWF를 오버래핑하여 플랫 크로스를 시도하는가?\n달리는 상대를 향해 플랫 크로스를 정확히 시도하는가?\n상대 수비가 정렬되기 전에 빠르게 크로스를 시도하는가?"},
{name:"중앙 수비수(CB)",positions:["CB"],text:"## 오프 더 볼 · 움직임\n팀을 조직화하고 안정화하는 리더십이 있는가?\n동료 CB와 서로 깊이를 바꾸며 상호 지원하는가?\n동료 CB의 공중볼 경합 시 빈 공간을 메우는가?\n공간 커버 시 공격적이고 피지컬한 대응을 하는가?\n적극적으로 수비 라인 앞에 상대를 막아서는가?\n수비 라인을 밀어올려 팀을 콤팩트하게 유지하는가?\n## 오프 더 볼 · 프레싱\n적극적인 공중볼 경합을 펼치는가?\n상대 접근 시 포위하여 골대 방향 회전을 막는가?\n상대 패스를 예측하고 오프사이드 트랩을 활용하는가?\n상대의 롱볼과 백패스를 유도하는가?\n크로스 상황에서 맨투맨 수비로 대응하는가?\n페널티 박스 안에서 밀착 마크를 하는가?\n위험 상황에서 과감하게 볼을 클리어하는가?\n## 온 더 볼 · 움직임\n필드의 너비와 깊이를 보는 시야가 있는가?\n상대 FW가 혼자일 때 미드필드로 과감히 드리블하는가?\n적절한 타이밍에 패스를 정확히 전달하는가?\n세트피스에서 페널티 박스 내 기회를 만드는가?\n## 온 더 볼 · 빌드업\nDMF와 연계하여 빌드업의 시작점이 되는가?\n전진하는 측면 공격수에게 빠른 패스를 정확히 전달하는가?\n깊고 플랫한 패스로 측면/하프 스페이스 공격을 지원하는가?\n상황에 맞게 롱 킥과 대각선 롱패스를 정확히 시도하는가?"},
{name:"골키퍼(GK)",positions:["GK"],text:"## 오프 더 볼 · 움직임\n팀과 함께 움직이며 상대 볼을 클리어하는가?\n명확하고 침착하게 팀원들과 소통하고 지시하는가?\n상대 슛 시 균형을 잘 유지하는가?\n볼 방향에 맞춰 적절한 발을 먼저 움직이는가?\n## 오프 더 볼 · 대응\n프리킥 시 수비 라인과 벽 위치를 잘 조정하는가?\n슈팅 위험 시 효율적인 벽을 구축하는가?\n중거리 슛에 적절한 타이밍에 대응하는가?\n1대1 상황에서 신속하고 적절한 판단을 하는가?\n페널티 파울 없이 균형과 침착함을 유지하는가?\n복잡한 상황에서 볼 처리(캐칭/펀칭)를 적절히 결정하는가?\n## 온 더 볼 · 움직임\n팀 동료에게 높고 넓은 패스를 정확히 전달하는가?\n백패스 처리와 측면 전환을 안전하게 수행하는가?\n코너킥 후 빠르게 볼을 패스하여 위험을 벗어나는가?\n볼 지키기와 패스 플레이 완성도가 높은가?\n## 온 더 볼 · 빌드업\n짧고 간결하게 양발로 안정적인 플레이를 하는가?\n압박받는 팀원에게 위험한 패스를 하지 않는가?\n공중볼에 강한 공격수에게 적절한 롱패스를 전달하는가?\n## 온 더 볼 · 기회 창출\n빠르고 정확한 스로우로 역습을 효과적으로 유도하는가?"}];
function load(){scPageLoad();if(!Array.isArray(db.meta.tagOptions))db.meta.tagOptions=DEFAULT_TAGS.slice();if(!Array.isArray(db.meta.evalDomains)||!db.meta.evalDomains.length)db.meta.evalDomains=DEFAULT_EVAL.slice();if(!Array.isArray(db.meta.customFields))db.meta.customFields=[];if(!Array.isArray(db.meta.pointSets))db.meta.pointSets=[];}

/* 포인트 세트 파싱: '## '줄 = 섹션, 그 외 비지 않은 줄 = 질문 */
function parsePoints(text){var out=[],cur={name:"",qs:[]};
  String(text||"").split(/\r?\n/).forEach(function(l){l=l.trim();if(!l)return;
    if(l.indexOf("##")===0){if(cur.qs.length)out.push(cur);cur={name:l.replace(/^#+\s*/,""),qs:[]};}
    else cur.qs.push(l.replace(/^[-*·]\s*/,""));});
  if(cur.qs.length)out.push(cur);return out;}
function pointKey(setName,q){return setName+"|"+q;}
function pointSummary(p){var s=0,n=0;
  (db.meta.pointSets||[]).forEach(function(set){parsePoints(set.text).forEach(function(sec){sec.qs.forEach(function(q){
    var v=(p.points||{})[pointKey(set.name,q)];if(v>0){s+=v;n++;}});});});
  return n?{avg:Math.round(s/n*10)/10,n:n}:null;}
function save(){scPageSave();}
function uid(){return "sc"+Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function blank(name,pos,club){var now=new Date().toISOString();
  return {id:uid(),nameKr:name||"",nameEn:"",num:"",year:"",pos:pos?pos.slice():[],tags:[],nat:"",height:"",weight:"",foot:"",
    club:club||"",formerClub:"",league:"",contract:"",custom:{},contacts:[],videos:[],photo:"",bio:"",grade:"",oneliner:"",ratings:{},points:{},obs:[],status:"관찰",createdAt:now,updatedAt:now};}
function ratingAvg(p){var ds=db.meta.evalDomains||[],s=0,n=0;ds.forEach(function(k){var v=(p.ratings||{})[k];if(v>0){s+=v;n++;}});return n?Math.round(s/n*10)/10:0;}
function touch(p){p.updatedAt=new Date().toISOString();save();}

/* ── 상태 ── */
var filter={q:"",pos:[],tags:[],grades:[]};
var selId=null;

/* ── 토스트 ── */
var toastT=null;
function toast(m){var t=$("toast");t.textContent=m;t.classList.add("on");if(toastT)clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove("on");},1800);}

/* ── 검색·필터 ── */
function age(p){var y=parseInt(p.year,10);if(!y)return "";var a=new Date().getFullYear()-y+1;return y+"년생("+a+"세)";}
function match(p){
  if(filter.pos.length&&!filter.pos.some(function(x){return (p.pos||[]).indexOf(x)>=0}))return false;
  if(filter.tags.length&&!filter.tags.some(function(x){return (p.tags||[]).indexOf(x)>=0}))return false;
  if(filter.grades.length&&filter.grades.indexOf(p.grade||"")<0)return false;
  var q=filter.q.trim().toLowerCase();
  if(!q)return true;
  var hay=[p.nameKr,p.nameEn,p.club,p.formerClub,p.league,p.nat,(p.pos||[]).join(" ")].join(" ").toLowerCase();
  return q.split(/\s+/).every(function(w){return hay.indexOf(w)>=0;});
}
function list(){return db.players.filter(match);}

/* ── 렌더: 필터 레일 ── */
function chipRow(host,values,activeArr,onToggle,extra){
  host.innerHTML="";
  values.forEach(function(v){
    var b=document.createElement("button");b.type="button";b.className="sc-chip"+(activeArr.indexOf(v)>=0?" on":"");b.textContent=v;
    b.addEventListener("click",function(){var i=activeArr.indexOf(v);if(i>=0)activeArr.splice(i,1);else activeArr.push(v);renderAll();});
    host.appendChild(b);
  });
  if(extra)host.appendChild(extra);
}
function renderRail(){
  chipRow($("posFilter"),POS,filter.pos);
  var add=document.createElement("button");add.type="button";add.className="sc-chip add";add.textContent="＋ 태그 추가";add.title="구분 태그 추가";
  add.addEventListener("click",function(){var t=prompt("추가할 구분 태그 이름");t=t&&t.trim();if(!t)return;if(db.meta.tagOptions.indexOf(t)<0){db.meta.tagOptions.push(t);save();renderAll();}});
  chipRow($("tagFilter"),db.meta.tagOptions,filter.tags,null,add);
  chipRow($("gradeFilter"),GRADES,filter.grades);
}

$("importFile").addEventListener("change",function(){
  var f=this.files&&this.files[0];this.value="";if(!f)return;

    var text=String(rd.result||""),added=0;
    if(/^\s*[\[{]/.test(text)){
      var d=JSON.parse(text);
      var arr=Array.isArray(d)?d:(d.players||[]);
      arr.forEach(function(src){
        var p=blank(src.nameKr||src.name||"",[],src.club||"");
        p.nameEn=src.nameEn||"";p.num=String(src.num||"");p.year=String(src.year||"");
        p.pos=Array.isArray(src.pos)?src.pos.slice():(src.pos?[String(src.pos)]:[]);
        p.tags=Array.isArray(src.tags)?src.tags.slice():(src.cat?[String(src.cat)]:[]);   /* FC안양: cat → tags */
        p.nat=src.nat||"";p.height=String(src.height||"");p.weight=String(src.weight||"");p.foot=src.foot||"";

        p.photo=src.photo||"";p.bio=src.bio||"";p.grade=src.grade||"";p.oneliner=src.oneliner||"";p.obs=Array.isArray(src.obs)?src.obs:[];
        p.videos=Array.isArray(src.videos)?src.videos.filter(function(v){return v&&/^https?:\/\//i.test(v.url||"");}):[];
        p.ratings=(src.ratings&&typeof src.ratings==="object")?src.ratings:{};
        p.contract=src.contract||"";p.custom=(src.custom&&typeof src.custom==="object")?src.custom:{};
        p.points=(src.points&&typeof src.points==="object")?src.points:{};
        if(p.nameKr){db.players.push(p);added++;}
        p.tags.forEach(function(t){if(db.meta.tagOptions.indexOf(t)<0)db.meta.tagOptions.push(t);});
      });
    }else{
      /* CSV — 첫 줄 헤더: 이름,포지션,소속,출생년,국적 등 인식 (엑셀·구글시트 내보내기) */
      var lines=text.split(/\r?\n/).filter(function(l){return l.trim();});
      var sep=lines[0].indexOf("\t")>=0?"\t":",";
      var head=lines[0].split(sep).map(function(h){return h.trim();});
      var col=function(names){for(var i=0;i<head.length;i++)if(names.indexOf(head[i])>=0)return i;return -1;};
      var ci={name:col(["이름","성명","name","nameKr"]),pos:col(["포지션","pos","position"]),club:col(["소속","현소속","출신","club"]),
        former:col(["전소속","formerClub"]),year:col(["출생년","출생년도","생년","year"]),nat:col(["국적","nat"]),num:col(["등번호","번호","num"])};
      if(ci.name<0)throw new Error("이름 열을 찾지 못했습니다");
      lines.slice(1).forEach(function(l){var c=l.split(sep).map(function(x){return x.trim();});
        var nm=c[ci.name];if(!nm)return;
        var p=blank(nm,[],ci.club>=0?c[ci.club]:"");
        if(ci.pos>=0&&c[ci.pos])p.pos=c[ci.pos].split(/[\/·,\s]+/).map(function(x){return x.toUpperCase();}).filter(function(x){return POS.indexOf(x)>=0;});
        if(ci.former>=0)p.formerClub=c[ci.former]||"";
        if(ci.year>=0)p.year=(c[ci.year]||"").replace(/[^0-9]/g,"");
        if(ci.nat>=0)p.nat=c[ci.nat]||"";
        if(ci.num>=0)p.num=c[ci.num]||"";
        db.players.push(p);added++;});
    }
    save();renderAll();toast(added+"명 가져왔습니다");
  }catch(e){toast("가져오기 실패 — 파일 형식을 확인하세요");}};
  rd.readAsText(f);
