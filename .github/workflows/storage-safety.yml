name: Storage safety

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse scripts and run isolated storage regressions
        run: node --test tests/*.test.cjs
      - name: Install pinned in-memory SQL test runtime
        run: npm install --prefix "$RUNNER_TEMP/ps-sql" --ignore-scripts --no-package-lock --no-audit --no-fund @electric-sql/pglite@0.5.8
      - name: Test prepared roster migration without a database connection
        env:
          PGLITE_MODULE: ${{ runner.temp }}/ps-sql/node_modules/@electric-sql/pglite
        run: node migrations/20260915_roster_canonical.local-test.cjs
