name: Storage safety

on:
  pull_request:
  push:
    # 2.958 — staging 은 testprocess(점검용 사이트)가 배포하는 가지다. 그 사이트도 이 커밋의 release-gate 를 기다린다(scripts/verify-release.mjs).
    branches: [main, staging]

permissions:
  contents: read

concurrency:
  group: storage-safety-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse scripts and run isolated storage regressions
        run: node --test tests/*.test.cjs
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify SQL ownership and restore a synthetic archive in a fresh instance
        run: npm run test:sql
      - name: Verify runtime-only deploy artifact
        run: node scripts/package-site.mjs

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # 브라우저와 시스템 라이브러리가 미리 든 Playwright 공식 이미지 — 매번 `playwright install --with-deps` 를 하던 단계가
    # 1~13분(들쭉날쭉)이라 main CI 가 15분을 넘겨, 12분만 기다리는 Netlify 게시(scripts/verify-release.mjs)가 번번이 멈췄다.
    # ⚠ package.json 의 playwright 버전을 바꾸면 이 태그도 같이 바꾼다(아래 확인 단계가 어긋나면 바로 실패한다).
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --user 1001
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
        group: [board, identity, storage, idp]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Playwright version matches the container image
        run: test "$(node -p "require('playwright/package.json').version")" = "1.62.1"
      - name: Exercise critical user flows with isolated synthetic accounts
        env:
          PS_BROWSER_ENGINE: ${{ matrix.engine }}
          PS_TEST_GROUP: ${{ matrix.group }}
        run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-${{ matrix.engine }}-${{ matrix.group }}
          path: test-results/
          retention-days: 7

  release-gate:
    if: always()
    needs: [regression, browser]
    runs-on: ubuntu-latest
    steps:
      - name: Require all regression and browser jobs
        env:
          REGRESSION: ${{ needs.regression.result }}
          BROWSER: ${{ needs.browser.result }}
        run: test "$REGRESSION" = success && test "$BROWSER" = success
