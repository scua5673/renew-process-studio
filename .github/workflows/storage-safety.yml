name: Storage safety

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: storage-safety-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse scripts and run isolated storage regressions
        run: node --test tests/*.test.cjs
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify SQL ownership and restore a synthetic archive in a fresh instance
        run: npm run test:sql
      - name: Verify runtime-only deploy artifact
        run: node scripts/package-site.mjs

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
        group: [board, identity, storage, idp]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps ${{ matrix.engine }}
      - name: Exercise critical user flows with isolated synthetic accounts
        env:
          PS_BROWSER_ENGINE: ${{ matrix.engine }}
          PS_TEST_GROUP: ${{ matrix.group }}
        run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-${{ matrix.engine }}-${{ matrix.group }}
          path: test-results/
          retention-days: 7

  release-gate:
    if: always()
    needs: [regression, browser]
    runs-on: ubuntu-latest
    steps:
      - name: Require all regression and browser jobs
        env:
          REGRESSION: ${{ needs.regression.result }}
          BROWSER: ${{ needs.browser.result }}
        run: test "$REGRESSION" = success && test "$BROWSER" = success
