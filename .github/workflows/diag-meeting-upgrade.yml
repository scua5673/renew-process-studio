# 임시 진단 — 리눅스 CI 에서만 흔들리는 브라우저 테스트를 값으로 확정한다. 확인이 끝나면 이 가지째 지운다.
name: Diag meeting-upgrade

on:
  push:
    branches: ['diag/**']

permissions:
  contents: read

jobs:
  repeat:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --user 1001
    strategy:
      fail-fast: false
      matrix:
        test: [match-board-vault, vault-folder-delete, meeting-upgrade]
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Repeat on WebKit
        env:
          PS_BROWSER_ENGINE: webkit
        run: |
          pass=0; fail=0
          for i in $(seq 1 15); do
            if node tests/browser/${{ matrix.test }}.mjs > out.log 2>&1; then pass=$((pass+1)); else
              fail=$((fail+1)); echo "=== run $i FAILED ==="; grep -E "AssertionError|Error:" out.log | head -3 | cut -c1-7000
            fi
          done
          echo "RESULT test=${{ matrix.test }} shard=${{ matrix.shard }} pass=$pass fail=$fail"
          test "$fail" -eq 0
